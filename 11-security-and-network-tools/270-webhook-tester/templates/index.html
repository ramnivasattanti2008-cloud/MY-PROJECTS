<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Tester</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 28px;
            color: #00ff88;
        }
        .webhook-url {
            background: #16213e;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #00ff88;
        }
        .webhook-url span {
            color: #888;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-refresh {
            background: #00ff88;
            color: #1a1a2e;
        }
        .btn-clear {
            background: #ff4757;
            color: white;
        }
        .btn-refresh:hover {
            background: #00cc6a;
        }
        .btn-clear:hover {
            background: #ff2e43;
        }
        .webhook-list {
            display: grid;
            gap: 16px;
        }
        .webhook-card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: border-color 0.2s;
        }
        .webhook-card:hover {
            border-color: #00ff88;
        }
        .webhook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #0f1629;
            border-bottom: 1px solid #333;
        }
        .webhook-info {
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .method {
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .method.POST { background: #00ff88; color: #1a1a2e; }
        .method.GET { background: #4a9eff; color: #1a1a2e; }
        .method.PUT { background: #ffa502; color: #1a1a2e; }
        .method.DELETE { background: #ff4757; color: white; }
        .method.PATCH { background: #a55eea; color: white; }
        .path {
            font-family: monospace;
            color: #00ff88;
        }
        .timestamp {
            color: #888;
            font-size: 12px;
        }
        .delete-btn {
            background: transparent;
            color: #ff4757;
            padding: 6px 12px;
            border: 1px solid #ff4757;
        }
        .delete-btn:hover {
            background: #ff4757;
            color: white;
        }
        .webhook-body {
            padding: 16px;
        }
        .section {
            margin-bottom: 16px;
        }
        .section:last-child {
            margin-bottom: 0;
        }
        .section-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .headers-list, .body-content {
            background: #0f1629;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
        }
        .body-content {
            max-height: 300px;
            overflow-y: auto;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .empty-state p {
            margin-bottom: 20px;
        }
        .example-cmd {
            background: #0f1629;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            text-align: left;
            display: inline-block;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ff88;
            color: #1a1a2e;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Webhook Tester</h1>
            <div class="webhook-url">
                <span>Endpoint:</span> <span id="endpoint-url"></span>
            </div>
        </header>

        <div class="controls">
            <button class="btn-refresh" onclick="loadWebhooks()">Refresh</button>
            <button class="btn-clear" onclick="clearWebhooks()">Clear All</button>
        </div>

        <div id="webhook-list" class="webhook-list">
            <div class="empty-state">
                <h2>No Webhooks Yet</h2>
                <p>Send a POST request to the webhook endpoint to see it here.</p>
                <div class="example-cmd">
curl -X POST <span id="example-url"></span> \<br>
&nbsp;&nbsp;-H "Content-Type: application/json" \<br>
&nbsp;&nbsp;-d '{"event": "test", "data": {"message": "Hello"}}'
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const baseUrl = window.location.origin;
        document.getElementById('endpoint-url').textContent = baseUrl + '/webhook';
        document.getElementById('example-url').textContent = baseUrl + '/webhook';

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        async function loadWebhooks() {
            try {
                const res = await fetch('/api/webhooks');
                const data = await res.json();
                renderWebhooks(data.webhooks || []);
            } catch (err) {
                showToast('Failed to load webhooks');
            }
        }

        async function clearWebhooks() {
            if (!confirm('Clear all webhooks?')) return;
            try {
                await fetch('/api/webhooks/clear', { method: 'POST' });
                loadWebhooks();
                showToast('All webhooks cleared');
            } catch (err) {
                showToast('Failed to clear webhooks');
            }
        }

        async function deleteWebhook(id) {
            if (!confirm('Delete this webhook?')) return;
            try {
                await fetch(`/api/webhooks/${id}`, { method: 'DELETE' });
                loadWebhooks();
                showToast('Webhook deleted');
            } catch (err) {
                showToast('Failed to delete webhook');
            }
        }

        function formatHeaders(headers) {
            const skipHeaders = ['Host', 'Connection', 'Content-Length'];
            return Object.entries(headers)
                .filter(([k]) => !skipHeaders.includes(k))
                .map(([k, v]) => `<strong>${k}:</strong> ${v}`)
                .join('\n');
        }

        function formatBody(body) {
            if (!body) return '<em>No body</em>';
            if (typeof body === 'string') return body;
            return JSON.stringify(body, null, 2);
        }

        function renderWebhooks(webhooks) {
            const container = document.getElementById('webhook-list');

            if (webhooks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>No Webhooks Yet</h2>
                        <p>Send a POST request to the webhook endpoint to see it here.</p>
                        <div class="example-cmd">
curl -X POST ${baseUrl}/webhook \\
    -H "Content-Type: application/json" \\
    -d '{"event": "test", "data": {"message": "Hello"}}'
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = webhooks.map(w => `
                <div class="webhook-card" id="webhook-${w.id}">
                    <div class="webhook-header">
                        <div class="webhook-info">
                            <span class="method ${w.method}">${w.method}</span>
                            <span class="path">${w.path}</span>
                            <span class="timestamp">${new Date(w.timestamp).toLocaleString()}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteWebhook(${w.id})">Delete</button>
                    </div>
                    <div class="webhook-body">
                        <div class="section">
                            <div class="section-title">Headers</div>
                            <div class="headers-list"><pre>${formatHeaders(w.headers || {})}</pre></div>
                        </div>
                        <div class="section">
                            <div class="section-title">Body</div>
                            <div class="body-content"><pre>${formatBody(null)}</pre></div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Load full body for each webhook
            webhooks.forEach(async (w) => {
                try {
                    const res = await fetch(`/api/webhooks/${w.id}`);
                    const data = await res.json();
                    if (data.webhook) {
                        const card = document.querySelector(`#webhook-${w.id} .body-content pre`);
                        if (card) {
                            card.textContent = data.webhook.body
                                ? JSON.stringify(data.webhook.body, null, 2)
                                : (data.webhook.body_raw || '<empty>');
                        }
                    }
                } catch (err) {
                    console.error('Failed to load webhook body:', err);
                }
            });
        }

        // Auto-refresh every 5 seconds
        loadWebhooks();
        setInterval(loadWebhooks, 5000);
    </script>
</body>
</html>
