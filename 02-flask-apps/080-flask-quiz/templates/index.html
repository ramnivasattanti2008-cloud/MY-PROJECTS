<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        nav { max-width: 800px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { color: #58a6ff; font-size: 1.5rem; }
        nav a { color: #c9d1d9; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }
        nav a:hover { background: #21262d; }
        .hero { text-align: center; padding: 3rem 0; }
        .hero h1 { color: #f0f6fc; font-size: 2.5rem; margin-bottom: 1rem; }
        .hero p { color: #8b949e; font-size: 1.2rem; margin-bottom: 2rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
        h2 { color: #f0f6fc; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #8b949e; }
        input, select { width: 100%; padding: 0.75rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 1rem; }
        input:focus, select:focus { outline: none; border-color: #58a6ff; }
        .btn { background: #238636; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 6px; cursor: pointer; font-size: 1.1rem; }
        .btn:hover { background: #2ea043; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .error { background: rgba(248, 81, 73, 0.1); border: 1px solid #f85149; color: #f85149; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .stats-preview { display: flex; gap: 2rem; justify-content: center; margin-top: 2rem; }
        .stat { text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #58a6ff; }
        .stat-label { color: #8b949e; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Quiz App</h1>
            <a href="/leaderboard">Leaderboard</a>
        </nav>
    </header>
    <div class="container">
        <div class="hero">
            <h1>Test Your Knowledge</h1>
            <p>Challenge yourself with trivia questions from various categories!</p>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <div class="card">
            <h2>Quiz Settings</h2>
            <form method="POST" action="/setup">
                <div class="form-group">
                    <label for="player_name">Your Name</label>
                    <input type="text" id="player_name" name="player_name" placeholder="Enter your name" maxlength="50">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Number of Questions</label>
                        <select id="amount" name="amount">
                            <option value="5">5 Questions</option>
                            <option value="10" selected>10 Questions</option>
                            <option value="15">15 Questions</option>
                            <option value="20">20 Questions</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="difficulty">Difficulty</label>
                        <select id="difficulty" name="difficulty">
                            <option value="">Any Difficulty</option>
                            <option value="easy">Easy</option>
                            <option value="medium">Medium</option>
                            <option value="hard">Hard</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        {% for cid, name in categories %}
                        <option value="{{ cid }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn">Start Quiz</button>
            </form>
        </div>
    </div>
</body>
</html>
