<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question {{ current }} of {{ total }} - Quiz App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 0; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        nav { max-width: 800px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { color: #58a6ff; font-size: 1.5rem; }
        .progress-bar { background: #21262d; border-radius: 10px; height: 10px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { background: #238636; height: 100%; transition: width 0.3s; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; }
        .question-number { color: #8b949e; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .question-text { color: #f0f6fc; font-size: 1.3rem; line-height: 1.6; margin-bottom: 2rem; }
        .answers { display: flex; flex-direction: column; gap: 0.75rem; }
        .answer-btn { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem 1.5rem; text-align: left; cursor: pointer; color: #c9d1d9; font-size: 1rem; transition: all 0.2s; }
        .answer-btn:hover { background: #21262d; border-color: #58a6ff; }
        .answer-btn input { display: none; }
        .answer-btn input:checked + span { color: #58a6ff; }
        .answer-label { display: flex; align-items: center; gap: 0.75rem; }
        .answer-radio { width: 20px; height: 20px; border: 2px solid #30363d; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .answer-btn input:checked ~ .answer-radio { border-color: #58a6ff; background: #58a6ff; }
        .answer-btn input:checked ~ .answer-radio::after { content: ''; width: 8px; height: 8px; background: #0d1117; border-radius: 50%; }
        .btn { background: #238636; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 6px; cursor: pointer; font-size: 1.1rem; margin-top: 1.5rem; }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Quiz App</h1>
        </nav>
    </header>
    <div class="container">
        <div class="progress-bar">
            <div class="progress-fill" style="width: {{ (current / total * 100) }}%"></div>
        </div>
        <div class="card">
            <div class="question-number">Question {{ current }} of {{ total }}</div>
            <div class="question-text">{{ question.decoded_question }}</div>
            <form method="POST" action="/answer">
                <div class="answers">
                    {% for answer in question.decoded_answers %}
                    <label class="answer-btn">
                        <input type="radio" name="answer" value="{{ answer }}" required>
                        <span class="answer-radio"></span>
                        <span class="answer-label">{{ answer }}</span>
                    </label>
                    {% endfor %}
                </div>
                <button type="submit" class="btn">Submit Answer</button>
            </form>
        </div>
    </div>
</body>
</html>
