{% extends "base.html" %}

{% block title %}Settings - Microblog{% endblock %}

{% block content %}
<div class="container" style="padding: 40px 20px;">
    <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 24px;">Settings</h1>

    <div class="card" style="max-width: 500px;">
        <form action="{{ url_for('settings') }}" method="POST">
            <div class="form-group">
                <label class="label" for="email">Email</label>
                <input type="email" id="email" name="email" class="input" value="{{ current_user.email }}" required>
            </div>
            <div class="form-group">
                <label class="label" for="bio">Bio</label>
                <textarea id="bio" name="bio" class="input" rows="3">{{ current_user.bio or '' }}</textarea>
            </div>
            <div class="form-group">
                <label class="label" for="password">New Password (leave blank to keep current)</label>
                <input type="password" id="password" name="password" class="input" placeholder="Enter new password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">Save Changes</button>
        </form>

        <div style="margin-top: 32px; padding-top: 32px; border-top: 1px solid #27272a;">
            <a href="{{ url_for('profile', username=current_user.username) }}" class="btn btn-secondary" style="width: 100%; justify-content: center;">View Profile</a>
        </div>
    </div>
</div>
{% endblock %}
