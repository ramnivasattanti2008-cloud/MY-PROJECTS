{% extends "base.html" %}

{% block title %}Sign In - Microblog{% endblock %}

{% block content %}
<div class="container" style="padding: 80px 20px;">
    <div style="max-width: 400px; margin: 0 auto;">
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 8px; text-align: center;">Welcome Back</h1>
        <p style="color: #71717a; text-align: center; margin-bottom: 32px;">Sign in to your account</p>

        <div class="card">
            <form action="{{ url_for('login') }}" method="POST">
                <div class="form-group">
                    <label class="label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="input" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label class="label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="input" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;">Sign In</button>
            </form>

            <p style="text-align: center; margin-top: 24px; color: #71717a; font-size: 14px;">
                Don't have an account? <a href="{{ url_for('register') }}" style="color: #ec4899;">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
