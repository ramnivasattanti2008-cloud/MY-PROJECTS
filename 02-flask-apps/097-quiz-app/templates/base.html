<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz App{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f14;
            color: #e4e4e7;
            min-height: 100vh;
        }
        h1, h2, h3 { font-family: 'Poppins', sans-serif; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 20px; }
        nav {
            background: #1a1a24;
            border-bottom: 1px solid #2a2a3a;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f97316;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
        }
        nav .nav-links { display: flex; gap: 24px; }
        nav .nav-links a { color: #a1a1aa; text-decoration: none; font-weight: 500; transition: color 0.2s; }
        nav .nav-links a:hover { color: #f97316; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 12px 24px; border-radius: 10px; font-weight: 600;
            text-decoration: none; transition: all 0.2s; cursor: pointer;
            border: none; font-size: 14px;
        }
        .btn-primary { background: linear-gradient(135deg, #f97316, #ea580c); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3); }
        .btn-secondary { background: #2a2a3a; color: #e4e4e7; }
        .btn-secondary:hover { background: #3a3a4a; }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
        .flash.error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; }
        .flash.success { background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #22c55e; }
        .card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 16px; padding: 32px; }
        .input, select {
            width: 100%; padding: 14px 18px; background: #0f0f14;
            border: 1px solid #2a2a3a; border-radius: 10px; color: #e4e4e7;
            font-size: 14px; font-family: inherit; transition: all 0.2s;
        }
        select { cursor: pointer; }
        .input:focus, select:focus { outline: none; border-color: #f97316; box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.1); }
        .input::placeholder { color: #71717a; }
        .label { display: block; margin-bottom: 8px; font-weight: 500; color: #a1a1aa; }
        .form-group { margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 12px; padding: 24px; text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #f97316; }
        .stat-label { color: #71717a; font-size: 14px; margin-top: 4px; }
        footer { text-align: center; padding: 40px 0; color: #52525b; font-size: 14px; margin-top: 60px; border-top: 1px solid #2a2a3a; }
        .progress-bar { height: 8px; background: #2a2a3a; border-radius: 4px; overflow: hidden; margin-bottom: 24px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f97316, #ea580c); border-radius: 4px; transition: width 0.3s; }
        .option-btn {
            width: 100%; padding: 18px 24px; background: #0f0f14;
            border: 2px solid #2a2a3a; border-radius: 12px;
            color: #e4e4e7; font-size: 16px; text-align: left;
            cursor: pointer; transition: all 0.2s; margin-bottom: 12px;
        }
        .option-btn:hover { border-color: #f97316; background: rgba(249, 115, 22, 0.05); }
        .option-btn.selected { border-color: #f97316; background: rgba(249, 115, 22, 0.1); }
        .option-letter {
            display: inline-flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; background: #2a2a3a; border-radius: 8px;
            margin-right: 12px; font-weight: 600; font-size: 14px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">&#10003; Quiz</a>
            <div class="nav-links">
                <a href="/">Start Quiz</a>
                <a href="/leaderboard">Leaderboard</a>
            </div>
        </div>
    </nav>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="container" style="padding-top: 20px;">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            &#10003; Quiz App &copy; 2024
        </div>
    </footer>
</body>
</html>
