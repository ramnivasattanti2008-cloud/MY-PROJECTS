{% extends 'base.html' %}
{% block title %}Manage Categories{% endblock %}
{% block content %}
<div class="nav">
    <a href="/" class="btn btn-ghost">&#9745; Back to Tasks</a>
</div>

<div class="card">
    <h2>Add Category</h2>
    <form action="/categories" method="POST" class="form-row">
        <input type="text" name="name" placeholder="Category name" required>
        <input type="color" name="color" value="#6366f1" style="width: 50px; height: 44px; padding: 0; border: none;">
        <button type="submit" class="btn btn-primary">Add Category</button>
    </form>
</div>

<div class="card">
    <h2>Categories</h2>
    {% if categories %}
    <ul class="task-list">
        {% for cat in categories %}
        <li class="task">
            <span class="category-badge" style="background: {{ cat.color }}22; color: {{ cat.color }};">
                <span style="display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: {{ cat.color }};"></span>
                {{ cat.name }}
            </span>
            <a href="/delete_category/{{ cat.id }}" class="btn btn-danger" onclick="return confirm('Delete this category? Tasks will be uncategorized.')">&#10005;</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <div class="empty">
        <p>No categories yet.</p>
    </div>
    {% endif %}
</div>
{% endblock %}
