{% extends 'base.html' %}

{% block title %}Setup Master Password{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card">
        <h2>Setup Master Password</h2>
        <p style="color: #8b949e; margin-bottom: 1.5rem;">
            This is the first time setup. Please create a master password to protect your vault.
        </p>

        <form method="post">
            <div class="form-group">
                <label for="password">Master Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                       placeholder="Minimum 8 characters">
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" name="confirm" required
                       placeholder="Re-enter your password">
            </div>

            <button type="submit" class="btn" style="width: 100%;">Set Master Password</button>
        </form>
    </div>
</div>
{% endblock %}
