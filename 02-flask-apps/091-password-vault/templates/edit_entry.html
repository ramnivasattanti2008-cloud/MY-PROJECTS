{% extends 'base.html' %}

{% block title %}Edit Password{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <h2>Edit Password</h2>

        <form method="post">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" value="{{ entry.title }}" required>
            </div>

            <div class="form-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" name="username" value="{{ entry.username or '' }}">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" value="{{ decrypted_password }}" required>
            </div>

            <div class="form-group">
                <label for="url">Website URL</label>
                <input type="url" id="url" name="url" value="{{ entry.url or '' }}">
            </div>

            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" id="tags" name="tags" value="{{ entry.tags or '' }}">
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes">{{ entry.notes or '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary">Update Password</button>
            <a href="{{ url_for('view_entry', id=entry.id) }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
