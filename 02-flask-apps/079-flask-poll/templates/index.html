<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polls App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        header { background: #6366f1; color: white; padding: 1.5rem 0; margin-bottom: 2rem; }
        header h1 { text-align: center; }
        .create-btn { display: inline-block; background: #22c55e; color: white; padding: 0.75rem 1.5rem;
                      text-decoration: none; border-radius: 8px; margin-bottom: 1.5rem; }
        .poll-list { display: flex; flex-direction: column; gap: 1rem; }
        .poll-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .poll-card h3 { color: #1f2937; margin-bottom: 0.5rem; }
        .poll-meta { color: #6b7280; font-size: 0.875rem; margin-bottom: 1rem; }
        .poll-actions { display: flex; gap: 0.5rem; }
        .btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.875rem; }
        .btn-vote { background: #6366f1; color: white; }
        .btn-results { background: #f59e0b; color: white; }
        .btn-delete { background: #ef4444; color: white; }
        .empty { text-align: center; color: #6b7280; padding: 3rem; }
    </style>
</head>
<body>
    <header><h1>Polls</h1></header>
    <div class="container">
        <a href="{{ url_for('create') }}" class="create-btn">+ Create New Poll</a>

        {% if polls %}
        <div class="poll-list">
            {% for poll in polls %}
            <div class="poll-card">
                <h3>{{ poll.question }}</h3>
                <p class="poll-meta">Created: {{ poll.created_at }}</p>
                <div class="poll-actions">
                    <a href="{{ url_for('poll', poll_id=poll.id) }}" class="btn btn-vote">Vote</a>
                    <a href="{{ url_for('results', poll_id=poll.id) }}" class="btn btn-results">Results</a>
                    <form action="{{ url_for('delete', poll_id=poll.id) }}" method="POST" style="display:inline;">
                        <button type="submit" class="btn btn-delete" onclick="return confirm('Delete this poll?')">Delete</button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
        {% else %}
        <div class="empty">
            <p>No polls yet. Create one to get started!</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
