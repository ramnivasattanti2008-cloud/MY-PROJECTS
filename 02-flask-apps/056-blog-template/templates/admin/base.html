<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} - ModernBlog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-page">
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo">Modern<span>Blog</span></a>
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('admin') }}" class="nav-item {% if request.endpoint == 'admin' %}active{% endif %}">
                Dashboard
            </a>
            <a href="{{ url_for('admin_posts') }}" class="nav-item {% if 'posts' in request.endpoint %}active{% endif %}">
                Posts
            </a>
            <a href="{{ url_for('admin_comments') }}" class="nav-item {% if 'comments' in request.endpoint %}active{% endif %}">
                Comments
            </a>
            <a href="{{ url_for('index') }}" class="nav-item" target="_blank">
                View Site
            </a>
            <a href="{{ url_for('logout') }}" class="nav-item">
                Logout
            </a>
        </nav>
    </aside>

    <main class="admin-main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
