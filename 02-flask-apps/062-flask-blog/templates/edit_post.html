{% extends "base.html" %}

{% block title %}Edit Post{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <h2 class="mb-4"><i class="bi bi-pencil me-2"></i>Edit Post</h2>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ post['title'] }}" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="author" class="form-label fw-semibold">Author</label>
                        <input type="text" class="form-control" id="author" name="author" value="{{ post['author'] }}">
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label fw-semibold">Content (Markdown supported)</label>
                        <textarea class="form-control" id="content" name="content" rows="15" required>{{ post['content'] }}</textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-2"></i>Save Changes</button>
                        <a href="/post/{{ post['slug'] }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
