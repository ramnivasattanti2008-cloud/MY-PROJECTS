{% extends "base.html" %}
{% block title %}Order Confirmed{% endblock %}
{% block content %}
<div class="text-center max-w-xl mx-auto">
    <div class="bg-green-100 rounded-full w-24 h-24 flex items-center justify-center mx-auto mb-6">
        <svg class="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
    </div>
    <h1 class="text-3xl font-bold text-green-600 mb-4">Order Confirmed!</h1>
    <p class="text-gray-600 mb-8">Thank you for your purchase. Your order has been placed successfully. You will receive a confirmation email shortly.</p>
    <a href="/" class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-indigo-700">Continue Shopping</a>
</div>
{% endblock %}
