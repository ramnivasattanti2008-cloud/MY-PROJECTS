{% extends "base.html" %}
{% block title %}Products{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-8">Our Products</h1>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    {% for product in products %}
    <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition">
        <img src="{{ product.image }}" alt="{{ product.name }}" class="w-full h-48 object-cover">
        <div class="p-6">
            <span class="text-xs text-indigo-600 uppercase font-semibold">{{ product.category }}</span>
            <h2 class="text-xl font-bold mt-2">{{ product.name }}</h2>
            <p class="text-2xl font-bold text-gray-900 mt-2">${{ "%.2f"|format(product.price) }}</p>
            <div class="flex gap-2 mt-4">
                <a href="{{ url_for('product_detail', product_id=product.id) }}" class="flex-1 bg-gray-200 text-gray-800 py-2 rounded-lg text-center hover:bg-gray-300">View</a>
                <form action="{{ url_for('add_to_cart', product_id=product.id) }}" method="POST" class="flex-1">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Add to Cart</button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
