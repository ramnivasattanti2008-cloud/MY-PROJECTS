<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protected Paste - Code Pastebin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #f0f6fc; margin-bottom: 1rem; }
        p { color: #8b949e; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; color: #8b949e; }
        input { width: 100%; padding: 0.75rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; }
        input:focus { outline: none; border-color: #58a6ff; }
        .btn { width: 100%; background: #238636; color: #fff; border: none; padding: 0.75rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #2ea043; }
        .error { color: #f85149; margin-top: 1rem; }
        a { color: #58a6ff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Password Protected</h1>
        <p>This paste is password protected. Enter the password to view it.</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/p/{{ paste_id }}/unlock">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus>
            </div>
            <button type="submit" class="btn">Unlock Paste</button>
        </form>
        <p style="margin-top: 1rem;"><a href="/">Create new paste</a></p>
    </div>
</body>
</html>
