<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ paste.title or 'Paste' }} - Code Pastebin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 0; }
        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        nav { max-width: 1000px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { color: #58a6ff; font-size: 1.5rem; }
        nav a { color: #c9d1d9; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }
        nav a:hover { background: #21262d; }
        .paste-header { background: #161b22; border: 1px solid #30363d; border-radius: 12px 12px 0 0; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .paste-meta { display: flex; gap: 2rem; align-items: center; }
        .paste-meta span { color: #8b949e; font-size: 0.9rem; }
        .paste-meta strong { color: #f0f6fc; }
        .paste-actions { display: flex; gap: 0.5rem; }
        .btn { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
        .btn:hover { background: #30363d; }
        .btn-primary { background: #238636; border-color: #238636; }
        .btn-primary:hover { background: #2ea043; }
        pre { background: #161b22; border: 1px solid #30363d; border-top: none; border-radius: 0 0 12px 12px; padding: 1.5rem; overflow-x: auto; margin: 0; }
        code { font-family: 'Consolas', 'Monaco', monospace; font-size: 0.9rem; line-height: 1.5; }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Code Pastebin</h1>
            <a href="/">New Paste</a>
        </nav>
    </header>
    <div class="container">
        <div class="paste-header">
            <div class="paste-meta">
                <span><strong>Title:</strong> {{ paste.title or 'Untitled' }}</span>
                <span><strong>Language:</strong> {{ paste.language }}</span>
                <span><strong>Views:</strong> {{ paste.view_count }}</span>
                <span><strong>Created:</strong> {{ paste.created_at[:10] }}</span>
            </div>
            <div class="paste-actions">
                <a href="/raw/{{ paste.paste_id }}" class="btn">Raw</a>
                <a href="/" class="btn btn-primary">New Paste</a>
            </div>
        </div>
        <pre><code class="language-{{ paste.language }}">{{ paste.content }}</code></pre>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
</body>
</html>
