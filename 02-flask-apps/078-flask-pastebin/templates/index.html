<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Pastebin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        header { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        nav { max-width: 900px; margin: 0 auto; padding: 0 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav h1 { color: #58a6ff; font-size: 1.5rem; }
        nav a { color: #c9d1d9; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; }
        nav a:hover { background: #21262d; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
        h2 { color: #f0f6fc; margin-bottom: 1.5rem; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #8b949e; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-family: 'Consolas', monospace; }
        textarea { min-height: 300px; resize: vertical; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #58a6ff; }
        .btn { background: #238636; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background: #2ea043; }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
        .checkbox-group input { width: auto; }
        .result { margin-top: 1.5rem; padding: 1rem; background: #0d1117; border: 1px solid #238636; border-radius: 6px; display: none; }
        .result.show { display: block; }
        .result-url { font-family: monospace; color: #58a6ff; word-break: break-all; }
        .error { color: #f85149; margin-top: 1rem; display: none; }
        .error.show { display: block; }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>Code Pastebin</h1>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h2>Create New Paste</h2>
            <form id="pasteForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="title">Title (optional)</label>
                        <input type="text" id="title" name="title" placeholder="My awesome code">
                    </div>
                    <div class="form-group">
                        <label for="language">Language</label>
                        <select id="language" name="language">
                            {% for code, name in languages %}
                            <option value="{{ code }}">{{ name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="content">Code</label>
                    <textarea id="content" name="content" placeholder="Paste your code here..." required></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="expiration">Expiration</label>
                        <select id="expiration" name="expiration">
                            <option value="never">Never</option>
                            <option value="1h">1 Hour</option>
                            <option value="24h">24 Hours</option>
                            <option value="7d">7 Days</option>
                            <option value="30d">30 Days</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="password">Password (optional)</label>
                        <input type="password" id="password" name="password" placeholder="Leave empty for public">
                    </div>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="is_public" name="is_public" checked>
                    <label for="is_public" style="margin: 0;">Public paste</label>
                </div>
                <button type="submit" class="btn">Create Paste</button>
            </form>
            <div id="error" class="error"></div>
            <div id="result" class="result">
                <p>Paste created! Share this URL:</p>
                <div class="result-url" id="pasteUrl"></div>
                <p style="margin-top: 0.5rem;"><a href="#" id="copyLink" style="color: #58a6ff;">Copy to clipboard</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
        const form = document.getElementById('pasteForm');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const pasteUrl = document.getElementById('pasteUrl');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            result.classList.remove('show');
            error.classList.remove('show');

            const formData = new FormData(form);

            try {
                const response = await fetch('/create', { method: 'POST', body: formData });
                const data = await response.json();

                if (response.ok) {
                    pasteUrl.textContent = data.url;
                    pasteUrl.href = data.url;
                    result.classList.add('show');
                    form.reset();
                } else {
                    error.textContent = data.error;
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = 'An error occurred.';
                error.classList.add('show');
            }
        });

        document.getElementById('copyLink').addEventListener('click', (e) => {
            e.preventDefault();
            navigator.clipboard.writeText(pasteUrl.textContent);
        });
    </script>
</body>
</html>
