{% extends "base.html" %}
{% block title %}Blog{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold mb-8">Latest Posts</h1>
<div class="space-y-8">
    {% for post in posts %}
    <article class="bg-white rounded-lg shadow-md p-6">
        <span class="text-sm text-gray-500">{{ post.created_at.strftime('%B %d, %Y') }}</span>
        <h2 class="text-2xl font-bold mt-2"><a href="/post/{{ post.slug }}" class="hover:text-indigo-600">{{ post.title }}</a></h2>
        <p class="text-gray-600 mt-2">{{ post.content[:200] }}...</p>
        <a href="/post/{{ post.slug }}" class="inline-block mt-4 text-indigo-600 hover:underline">Read more</a>
    </article>
    {% else %}
    <p class="text-gray-600">No posts yet.</p>
    {% endfor %}
</div>
{% endblock %}
