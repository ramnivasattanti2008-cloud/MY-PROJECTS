<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CMS{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-2xl font-bold text-indigo-600">SimpleCMS</a>
            <div class="flex gap-6">
                <a href="/" class="hover:text-indigo-600">Blog</a>
                <a href="/page/about" class="hover:text-indigo-600">About</a>
                <a href="/admin" class="text-gray-400 hover:text-gray-600">Admin</a>
            </div>
        </nav>
    </header>
    <main class="container mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-gray-800 text-white px-6 py-6 mt-12">
        <p class="text-center">&copy; 2026 SimpleCMS</p>
    </footer>
</body>
</html>
