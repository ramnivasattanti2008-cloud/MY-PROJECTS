<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 40px;
        }
        h1 { color: #58a6ff; font-size: 2.5rem; text-align: center; }
        .subtitle { color: #8b949e; text-align: center; margin-bottom: 40px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #8b949e; }
        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1rem;
        }
        input:focus, select:focus { outline: none; border-color: #58a6ff; }
        select { cursor: pointer; }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.1rem;
            width: 100%;
            transition: background 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .feature {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
        }
        .feature-icon { font-size: 2rem; margin-bottom: 10px; }
        .feature h3 { color: #fff; margin-bottom: 5px; }
        .feature p { color: #8b949e; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <nav class="nav" style="display: flex; gap: 20px;">
                <a href="/leaderboard" style="color: #58a6ff; text-decoration: none;">Leaderboard</a>
            </nav>
        </header>

        <h1>Quiz Game</h1>
        <p class="subtitle">Test your knowledge with trivia questions from Open Trivia DB</p>

        <form action="/play" method="POST" class="card">
            <div class="form-group">
                <label for="player_name">Your Name</label>
                <input type="text" name="player_name" id="player_name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select name="category" id="category">
                    <option value="">Any Category</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="difficulty">Difficulty</label>
                <select name="difficulty" id="difficulty">
                    <option value="">Any Difficulty</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <button type="submit" class="btn">Start Quiz</button>
        </form>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">10</div>
                <h3>Questions</h3>
                <p>Per quiz session</p>
            </div>
            <div class="feature">
                <div class="feature-icon">Multiple Choice</div>
                <h3>Format</h3>
                <p>4 options each</p>
            </div>
            <div class="feature">
                <div class="feature-icon">Timer</div>
                <h3>Scoring</h3>
                <p>Based on speed</p>
            </div>
        </div>
    </div>
</body>
</html>
