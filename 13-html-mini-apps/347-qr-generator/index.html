<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            animation: fadeInUp 0.8s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header { text-align: center; margin-bottom: 40px; }
        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d9ff, #00ff88, #00d9ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 3s ease infinite;
        }
        @keyframes gradient { 0%, 100% { background-position: 0% center; } 50% { background-position: 200% center; } }
        .subtitle { color: #64748b; margin-top: 8px; font-size: 1.1rem; }
        .card {
            background: rgba(20, 25, 45, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }
        .input-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        textarea, input[type="text"], select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px 20px;
            color: #e2e8f0;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            resize: none;
            transition: all 0.3s ease;
        }
        textarea { min-height: 120px; }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: #00d9ff;
            box-shadow: 0 0 0 3px rgba(0, 217, 255, 0.1);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .option {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .option:hover { border-color: rgba(0, 217, 255, 0.3); }
        .option-label {
            font-size: 0.75rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .option-value {
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
            color: #00d9ff;
        }
        .option input, .option select {
            background: transparent;
            border: none;
            padding: 8px 0;
            text-align: center;
            color: #00d9ff;
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
        }
        .btn-row {
            display: flex;
            gap: 12px;
        }
        button {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 14px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-generate {
            background: linear-gradient(135deg, #00d9ff, #00b4d8);
            color: #0a0a0a;
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3); }
        .btn-download, .btn-copy {
            background: rgba(0, 217, 255, 0.1);
            color: #00d9ff;
            border: 1px solid rgba(0, 217, 255, 0.3);
        }
        .btn-download:hover, .btn-copy:hover {
            background: rgba(0, 217, 255, 0.2);
            transform: translateY(-2px);
        }
        .qr-container {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .qr-container.show { display: flex; }
        #qrcode {
            background: white;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        #qrcode:hover { transform: scale(1.05); }
        .qr-content {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #64748b;
            max-width: 250px;
            text-align: center;
            word-break: break-all;
            line-height: 1.6;
        }
        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .preset {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.8rem;
            color: #00d9ff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .preset:hover { background: rgba(0, 217, 255, 0.2); transform: translateY(-2px); }
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 217, 255, 0.15);
            border: 1px solid rgba(0, 217, 255, 0.3);
            backdrop-filter: blur(10px);
            padding: 14px 28px;
            border-radius: 12px;
            color: #00d9ff;
            font-weight: 500;
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>QR Generator</h1>
            <p class="subtitle">Create QR codes for any text or URL</p>
        </header>
        <div class="card">
            <div class="presets">
                <button class="preset" onclick="setPreset('https://github.com')">GitHub</button>
                <button class="preset" onclick="setPreset('https://linkedin.com')">LinkedIn</button>
                <button class="preset" onclick="setPreset('mailto:')">Email</button>
                <button class="preset" onclick="setPreset('WiFi:T:WPA;S:NetworkName;P:password;;')">WiFi</button>
                <button class="preset" onclick="setPreset('BEGIN:VCARD\nVERSION:3.0\nFN:\nEND:VCARD')">vCard</button>
            </div>
            <div class="input-group">
                <label>Content</label>
                <textarea id="content" placeholder="Enter URL, text, WiFi config, or vCard data..."></textarea>
            </div>
            <div class="options-grid">
                <div class="option">
                    <div class="option-label">Size</div>
                    <input type="number" id="size" value="200" min="100" max="400" step="10">
                </div>
                <div class="option">
                    <div class="option-label">Color</div>
                    <input type="color" id="colorDark" value="#000000" style="width:50px;height:30px;border:none;cursor:pointer;">
                </div>
                <div class="option">
                    <div class="option-label">BG Color</div>
                    <input type="color" id="colorLight" value="#ffffff" style="width:50px;height:30px;border:none;cursor:pointer;">
                </div>
                <div class="option">
                    <div class="option-label">Error Level</div>
                    <select id="correctLevel">
                        <option value="L">Low</option>
                        <option value="M" selected>Medium</option>
                        <option value="Q">Quartile</option>
                        <option value="H">High</option>
                    </select>
                </div>
            </div>
            <div class="btn-row">
                <button class="btn-generate" onclick="generateQR()">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    Generate
                </button>
            </div>
            <div class="qr-container" id="qrContainer">
                <div id="qrcode"></div>
                <div class="qr-content" id="qrContent"></div>
                <div class="btn-row" style="margin-top:20px;">
                    <button class="btn-download" onclick="downloadQR()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        Download PNG
                    </button>
                    <button class="btn-copy" onclick="copyQR()">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        Copy
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast">Copied to clipboard!</div>
    <script>
        let currentQR = null;

        function setPreset(type) {
            const textarea = document.getElementById('content');
            if (type === 'mailto:') {
                textarea.value = 'mailto:example@email.com?subject=Hello&body=Message';
            } else {
                textarea.value = type;
            }
        }

        function generateQR() {
            const content = document.getElementById('content').value.trim();
            if (!content) {
                alert('Please enter some content');
                return;
            }
            const size = parseInt(document.getElementById('size').value);
            const colorDark = document.getElementById('colorDark').value;
            const colorLight = document.getElementById('colorLight').value;
            const correctLevel = document.getElementById('correctLevel').value;

            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('qrContent').textContent = content.substring(0, 50) + (content.length > 50 ? '...' : '');
            document.getElementById('qrContainer').classList.add('show');

            currentQR = new QRCode(document.getElementById('qrcode'), {
                text: content,
                width: size,
                height: size,
                colorDark: colorDark,
                colorLight: colorLight,
                correctLevel: QRCode.CorrectLevel[correctLevel]
            });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            if (img) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = img.src;
                link.click();
                showToast('QR code downloaded!');
            }
        }

        function copyQR() {
            const img = document.querySelector('#qrcode img');
            if (img) {
                fetch(img.src).then(r => r.blob()).then(blob => {
                    navigator.clipboard.writeText(img.src);
                    showToast('Image URL copied!');
                });
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Auto-generate on Enter
        document.getElementById('content').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) generateQR();
        });
    </script>
</body>
</html>
