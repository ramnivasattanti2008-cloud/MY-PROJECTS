<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .currency {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.2rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 35px;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid transparent;
            border-radius: 12px;
            color: #fff;
            outline: none;
            transition: all 0.3s;
            font-variant-numeric: tabular-nums;
        }

        .input-wrapper input:focus {
            border-color: #fda085;
            background: rgba(255, 255, 255, 0.12);
        }

        .tip-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .tip-btn {
            padding: 12px 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tip-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .tip-btn.active {
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            color: #0f0f1a;
            font-weight: 600;
        }

        .custom-tip {
            margin-bottom: 25px;
        }

        .custom-tip input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid transparent;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            text-align: center;
            transition: all 0.3s;
        }

        .custom-tip input:focus {
            border-color: #fda085;
        }

        .custom-tip input::placeholder {
            color: #555;
        }

        .split-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .split-buttons {
            display: flex;
            gap: 10px;
        }

        .split-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .split-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .split-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .split-count {
            font-size: 1.5rem;
            min-width: 50px;
            text-align: center;
        }

        .results {
            background: linear-gradient(135deg, rgba(246, 211, 101, 0.15) 0%, rgba(253, 160, 133, 0.15) 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-row.total {
            padding-top: 20px;
            margin-top: 10px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            border-bottom: none;
        }

        .result-label {
            color: #aaa;
            font-size: 0.95rem;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .result-row.total .result-label {
            color: #fff;
            font-size: 1.1rem;
        }

        .result-row.total .result-value {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .per-person {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        @media (max-width: 400px) {
            .tip-options {
                grid-template-columns: repeat(2, 1fr);
            }
            .card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tip Calculator</h1>

        <div class="card">
            <div class="input-group">
                <label>Bill Amount</label>
                <div class="input-wrapper">
                    <span class="currency">$</span>
                    <input type="number" id="billAmount" placeholder="0.00" min="0" step="0.01" oninput="calculate()">
                </div>
            </div>

            <div class="input-group">
                <label>Tip Percentage</label>
                <div class="tip-options">
                    <button class="tip-btn" onclick="setTip(10)">10%</button>
                    <button class="tip-btn" onclick="setTip(15)">15%</button>
                    <button class="tip-btn active" onclick="setTip(18)">18%</button>
                    <button class="tip-btn" onclick="setTip(20)">20%</button>
                    <button class="tip-btn" onclick="setTip(22)">22%</button>
                    <button class="tip-btn" onclick="setTip(25)">25%</button>
                    <button class="tip-btn" onclick="setTip(30)">30%</button>
                    <button class="tip-btn" onclick="setTip(0)">Other</button>
                </div>
            </div>

            <div class="custom-tip">
                <input type="number" id="customTip" placeholder="Custom tip %" min="0" max="100" oninput="setTipFromCustom()">
            </div>

            <div class="split-control">
                <label style="color: #888;">Split Bill</label>
                <div class="split-buttons">
                    <button class="split-btn" onclick="changeSplit(-1)">-</button>
                    <span class="split-count" id="splitCount">1</span>
                    <button class="split-btn" onclick="changeSplit(1)">+</button>
                </div>
            </div>

            <div class="results">
                <div class="result-row">
                    <span class="result-label">Bill Amount</span>
                    <span class="result-value" id="billDisplay">$0.00</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Tip (<span id="tipPercentDisplay">18</span>%)</span>
                    <span class="result-value" id="tipDisplay">$0.00</span>
                </div>
                <div class="result-row total">
                    <span class="result-label">Total</span>
                    <span>
                        <span class="result-value" id="totalDisplay">$0.00</span>
                        <div class="per-person" id="perPersonDisplay"></div>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let bill = 0;
        let tipPercent = 18;
        let splitCount = 1;

        const billInput = document.getElementById('billAmount');
        const customTipInput = document.getElementById('customTip');
        const splitCountEl = document.getElementById('splitCount');
        const billDisplay = document.getElementById('billDisplay');
        const tipDisplay = document.getElementById('tipDisplay');
        const tipPercentDisplay = document.getElementById('tipPercentDisplay');
        const totalDisplay = document.getElementById('totalDisplay');
        const perPersonDisplay = document.getElementById('perPersonDisplay');

        function formatCurrency(amount) {
            return '$' + amount.toFixed(2);
        }

        function setTip(percent) {
            tipPercent = percent;
            tipPercentDisplay.textContent = percent;
            customTipInput.value = percent > 0 && ![10, 15, 18, 20, 22, 25, 30].includes(percent) ? percent : '';

            document.querySelectorAll('.tip-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === percent + '%') {
                    btn.classList.add('active');
                }
            });

            calculate();
        }

        function setTipFromCustom() {
            const value = parseFloat(customTipInput.value) || 0;
            if (value > 0) {
                tipPercent = value;
                tipPercentDisplay.textContent = value;
                document.querySelectorAll('.tip-btn').forEach(btn => btn.classList.remove('active'));
            }
            calculate();
        }

        function changeSplit(delta) {
            splitCount = Math.max(1, splitCount + delta);
            splitCountEl.textContent = splitCount;
            updateSplitButtons();
            calculate();
        }

        function updateSplitButtons() {
            document.querySelectorAll('.split-btn')[0].disabled = splitCount <= 1;
        }

        function calculate() {
            bill = parseFloat(billInput.value) || 0;
            const tip = bill * (tipPercent / 100);
            const total = bill + tip;
            const perPerson = total / splitCount;

            billDisplay.textContent = formatCurrency(bill);
            tipDisplay.textContent = formatCurrency(tip);
            totalDisplay.textContent = formatCurrency(total);

            if (splitCount > 1) {
                perPersonDisplay.textContent = formatCurrency(perPerson) + ' each';
                perPersonDisplay.style.display = 'block';
            } else {
                perPersonDisplay.style.display = 'none';
            }
        }

        // Initialize
        calculate();
    </script>
</body>
</html>
