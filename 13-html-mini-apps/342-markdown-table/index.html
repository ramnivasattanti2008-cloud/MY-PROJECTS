<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Table Generator</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --border: #333;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --radius: 8px;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #fff;
      --surface2: #f0f0f0;
      --border: #ddd;
      --text: #1a1a1a;
      --text-dim: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--accent); }
    .controls {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .control-group { display: flex; align-items: center; gap: 0.5rem; }
    label { color: var(--text-dim); font-size: 0.875rem; }
    input[type="number"], input[type="text"] {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
    }
    input[type="number"] { width: 60px; }
    input[type="text"] { width: 150px; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--surface2); color: var(--text); }
    button.secondary:hover { background: var(--border); }
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 1rem;
      border-radius: var(--radius);
      font-family: 'Consolas', monospace;
      font-size: 0.875rem;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid var(--accent); }
    .preview {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: var(--radius);
      overflow-x: auto;
      margin: 1rem 0;
    }
    .preview table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }
    .preview th, .preview td {
      border: 1px solid var(--border);
      padding: 0.5rem;
      text-align: left;
    }
    .preview th { background: var(--surface2); font-weight: 600; }
    .output-section { margin-top: 1.5rem; }
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1.2rem;
    }
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.4rem; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">&#9728;</button>
  <div class="container">
    <h1>Markdown Table Generator</h1>

    <div class="controls">
      <div class="control-group">
        <label>Rows:</label>
        <input type="number" id="rows" value="3" min="1" max="20">
      </div>
      <div class="control-group">
        <label>Columns:</label>
        <input type="number" id="cols" value="3" min="1" max="10">
      </div>
      <div class="control-group">
        <label>Header:</label>
        <input type="text" id="headers" placeholder="Name, Role, Status">
      </div>
      <button onclick="generateTable()">Generate</button>
    </div>

    <label style="display:block; margin-bottom:0.5rem; color:var(--text-dim);">Edit Data (CSV format):</label>
    <textarea id="inputData" rows="6" placeholder="Enter data, one row per line, comma-separated"></textarea>

    <div class="preview" id="preview"></div>

    <div class="output-section">
      <div class="controls">
        <button onclick="copyOutput()">Copy Markdown</button>
        <button class="secondary" onclick="clearAll()">Clear</button>
      </div>
      <textarea id="output" rows="6" readonly style="margin-top:1rem;"></textarea>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const root = document.documentElement;
    let isDark = true;

    function toggleTheme() {
      isDark = !isDark;
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.querySelector('.theme-toggle').innerHTML = isDark ? '&#9728;' : '&#9790;';
    }

    function generateTable() {
      const rows = parseInt(document.getElementById('rows').value) || 3;
      const cols = parseInt(document.getElementById('cols').value) || 3;
      const headersInput = document.getElementById('headers').value;

      let headers = headersInput ? headersInput.split(',').map(h => h.trim()) : [];
      while (headers.length < cols) headers.push(`Column ${headers.length + 1}`);
      headers = headers.slice(0, cols);

      let data = [];
      const textarea = document.getElementById('inputData');
      if (textarea.value.trim()) {
        data = textarea.value.trim().split('\n').map(line => line.split(',').map(c => c.trim()));
      } else {
        for (let i = 0; i < rows; i++) {
          data.push(Array.from({length: cols}, (_, j) => `Row ${i + 1}, Col ${j + 1}`));
        }
      }
      while (data.length < rows) data.push(Array(cols).fill(''));

      const preview = document.getElementById('preview');
      let html = '<table><thead><tr>';
      headers.forEach(h => html += `<th>${h}</th>`);
      html += '</tr></thead><tbody>';
      data.slice(0, rows).forEach(row => {
        html += '<tr>';
        row.slice(0, cols).forEach(cell => {
          html += `<td>${cell}</td>`;
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      preview.innerHTML = html;

      let md = '| ' + headers.join(' | ') + ' |\n';
      md += '| ' + headers.map(() => '---').join(' | ') + ' |\n';
      data.slice(0, rows).forEach(row => {
        md += '| ' + row.slice(0, cols).map(c => c || '').join(' | ') + ' |\n';
      });
      document.getElementById('output').value = md;
    }

    function copyOutput() {
      const output = document.getElementById('output');
      navigator.clipboard.writeText(output.value).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    function clearAll() {
      document.getElementById('inputData').value = '';
      document.getElementById('output').value = '';
      document.getElementById('preview').innerHTML = '';
    }

    generateTable();
  </script>
</body>
</html>
