<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Themer</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        h1 { font-size: 1.5rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .color-input-group { display: flex; align-items: center; gap: 12px; }
        .color-preview { width: 48px; height: 48px; border-radius: 8px; border: 2px solid var(--border); cursor: pointer; overflow: hidden; }
        .color-preview input { width: 60px; height: 60px; border: none; cursor: pointer; transform: translate(-6px, -6px); }
        input[type="color"] { -webkit-appearance: none; background: none; border: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
        .color-text { font-family: 'Cascadia Code', monospace; font-size: 1.1rem; background: var(--bg-secondary); border: 1px solid var(--border); padding: 10px 16px; border-radius: 6px; color: var(--text-primary); width: 140px; text-transform: uppercase; }
        .main-grid { display: grid; grid-template-columns: 300px 1fr; gap: 30px; }
        .scheme-panel { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .scheme-title { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
        .scheme-list { display: flex; flex-direction: column; gap: 8px; }
        .scheme-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--bg-tertiary); border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .scheme-item:hover { background: var(--border); }
        .scheme-item.active { border: 2px solid var(--accent); }
        .scheme-swatch { width: 32px; height: 32px; border-radius: 4px; }
        .scheme-name { font-size: 0.9rem; }
        .colors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .color-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: all 0.2s; }
        .color-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .color-display { height: 100px; display: flex; align-items: center; justify-content: center; font-family: 'Cascadia Code', monospace; font-size: 0.9rem; font-weight: 500; }
        .color-info { padding: 12px; }
        .color-name { font-size: 0.85rem; font-weight: 500; margin-bottom: 4px; }
        .color-hex { font-family: 'Cascadia Code', monospace; font-size: 0.8rem; color: var(--text-secondary); }
        .copy-btn { width: 100%; padding: 8px; background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-top: 8px; transition: all 0.2s; }
        .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
        .copy-btn.copied { background: var(--accent); color: #fff; border-color: var(--accent); }
        .css-output { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .css-header { padding: 12px 16px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .css-title { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .copy-all-btn { padding: 6px 12px; background: var(--accent); border: none; color: #fff; border-radius: 4px; cursor: pointer; font-size: 0.8rem; transition: all 0.2s; }
        .copy-all-btn:hover { filter: brightness(1.1); }
        .css-content { padding: 16px; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; color: var(--text-secondary); max-height: 300px; overflow: auto; }
        .preview-section { margin-top: 30px; }
        .preview-title { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
        .preview-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; display: flex; gap: 24px; }
        .preview-button { padding: 10px 20px; border-radius: 6px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .preview-input { padding: 10px 14px; border-radius: 6px; border: 1px solid; font-size: 0.9rem; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><circle cx="12" cy="12" r="4"/></svg> Color Themer</h1>
            <div class="color-input-group">
                <div class="color-preview" id="colorPreview">
                    <input type="color" id="colorPicker" value="#6366f1">
                </div>
                <input type="text" class="color-text" id="hexInput" value="#6366f1" maxlength="7">
            </div>
        </header>

        <div class="main-grid">
            <div class="scheme-panel">
                <div class="scheme-title">Color Scheme</div>
                <div class="scheme-list">
                    <div class="scheme-item active" data-scheme="complementary">
                        <div class="scheme-swatch" style="background: linear-gradient(135deg, #6366f1 50%, #f093fb 50%)"></div>
                        <span class="scheme-name">Complementary</span>
                    </div>
                    <div class="scheme-item" data-scheme="analogous">
                        <div class="scheme-swatch" style="background: linear-gradient(135deg, #6366f1, #06b6d4, #84cc16)"></div>
                        <span class="scheme-name">Analogous</span>
                    </div>
                    <div class="scheme-item" data-scheme="triadic">
                        <div class="scheme-swatch" style="background: linear-gradient(135deg, #6366f1, #22c55e, #f97316)"></div>
                        <span class="scheme-name">Triadic</span>
                    </div>
                    <div class="scheme-item" data-scheme="split">
                        <div class="scheme-swatch" style="background: linear-gradient(135deg, #6366f1, #ec4899, #06b6d4)"></div>
                        <span class="scheme-name">Split Complementary</span>
                    </div>
                    <div class="scheme-item" data-scheme="monochromatic">
                        <div class="scheme-swatch" style="background: linear-gradient(135deg, #6366f1, #a5b4fc, #312e81)"></div>
                        <span class="scheme-name">Monochromatic</span>
                    </div>
                </div>
            </div>

            <div>
                <div class="colors-grid" id="colorsGrid"></div>

                <div class="css-output">
                    <div class="css-header">
                        <span class="css-title">CSS Variables</span>
                        <button class="copy-all-btn" id="copyAllBtn">Copy All</button>
                    </div>
                    <div class="css-content" id="cssOutput"></div>
                </div>

                <div class="preview-section">
                    <div class="preview-title">Preview</div>
                    <div class="preview-card" id="previewCard"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        const colorPicker = document.getElementById('colorPicker');
        const colorPreview = document.getElementById('colorPreview');
        const hexInput = document.getElementById('hexInput');
        const colorsGrid = document.getElementById('colorsGrid');
        const cssOutput = document.getElementById('cssOutput');
        const previewCard = document.getElementById('previewCard');
        const toast = document.getElementById('toast');
        const schemeItems = document.querySelectorAll('.scheme-item');
        const copyAllBtn = document.getElementById('copyAllBtn');

        let currentScheme = 'complementary';
        let generatedColors = {};

        function hexToHSL(hex) {
            let r = parseInt(hex.slice(1, 3), 16) / 255;
            let g = parseInt(hex.slice(3, 5), 16) / 255;
            let b = parseInt(hex.slice(5, 7), 16) / 255;

            let max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;

            if (max === min) {
                h = s = 0;
            } else {
                let d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        function hslToHex(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function adjustLightness(hex, amount) {
            const hsl = hexToHSL(hex);
            hsl.l = Math.max(0, Math.min(100, hsl.l + amount));
            return hslToHex(hsl.h, hsl.s, hsl.l);
        }

        function generateScheme(baseColor, scheme) {
            const hsl = hexToHSL(baseColor);
            const colors = { base: baseColor };

            switch (scheme) {
                case 'complementary':
                    colors.secondary = hslToHex((hsl.h + 180) % 360, hsl.s, hsl.l);
                    colors.tertiary = adjustLightness(baseColor, 20);
                    colors.accent = adjustLightness(baseColor, -20);
                    colors.background = adjustLightness(baseColor, -40);
                    colors.surface = adjustLightness(baseColor, -30);
                    colors.text = adjustLightness(baseColor, -50);
                    break;
                case 'analogous':
                    colors.secondary = hslToHex((hsl.h + 30) % 360, hsl.s, hsl.l);
                    colors.tertiary = hslToHex((hsl.h + 60) % 360, hsl.s, hsl.l);
                    colors.accent = hslToHex((hsl.h - 30 + 360) % 360, hsl.s, hsl.l);
                    colors.background = adjustLightness(baseColor, -45);
                    colors.surface = adjustLightness(baseColor, -35);
                    colors.text = adjustLightness(baseColor, -55);
                    break;
                case 'triadic':
                    colors.secondary = hslToHex((hsl.h + 120) % 360, hsl.s, hsl.l);
                    colors.tertiary = hslToHex((hsl.h + 240) % 360, hsl.s, hsl.l);
                    colors.accent = adjustLightness(baseColor, 15);
                    colors.background = adjustLightness(baseColor, -45);
                    colors.surface = adjustLightness(baseColor, -35);
                    colors.text = adjustLightness(baseColor, -55);
                    break;
                case 'split':
                    colors.secondary = hslToHex((hsl.h + 150) % 360, hsl.s, hsl.l);
                    colors.tertiary = hslToHex((hsl.h + 210) % 360, hsl.s, hsl.l);
                    colors.accent = hslToHex((hsl.h + 180) % 360, hsl.s, hsl.l);
                    colors.background = adjustLightness(baseColor, -45);
                    colors.surface = adjustLightness(baseColor, -35);
                    colors.text = adjustLightness(baseColor, -55);
                    break;
                case 'monochromatic':
                    colors.secondary = adjustLightness(baseColor, 15);
                    colors.tertiary = adjustLightness(baseColor, 30);
                    colors.accent = adjustLightness(baseColor, -15);
                    colors.background = adjustLightness(baseColor, -35);
                    colors.surface = adjustLightness(baseColor, -25);
                    colors.text = adjustLightness(baseColor, -50);
                    break;
            }
            return colors;
        }

        function getContrastColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.5 ? '#000000' : '#ffffff';
        }

        function renderColors(colors) {
            const colorNames = [
                { key: 'base', name: 'Primary' },
                { key: 'secondary', name: 'Secondary' },
                { key: 'tertiary', name: 'Tertiary' },
                { key: 'accent', name: 'Accent' },
                { key: 'background', name: 'Background' },
                { key: 'surface', name: 'Surface' },
                { key: 'text', name: 'Text' }
            ];

            colorsGrid.innerHTML = colorNames.map(({ key, name }) => {
                const color = colors[key];
                if (!color) return '';
                return `
                    <div class="color-card">
                        <div class="color-display" style="background: ${color}; color: ${getContrastColor(color)}">${color}</div>
                        <div class="color-info">
                            <div class="color-name">${name}</div>
                            <div class="color-hex">${color}</div>
                            <button class="copy-btn" data-color="${color}">Copy</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(btn.dataset.color);
                    showToast('Copied: ' + btn.dataset.color);
                    btn.classList.add('copied');
                    btn.textContent = 'Copied!';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.textContent = 'Copy';
                    }, 1500);
                });
            });
        }

        function renderCSS(colors) {
            const css = `:root {
  --color-primary: ${colors.base};
  --color-secondary: ${colors.secondary};
  --color-tertiary: ${colors.tertiary};
  --color-accent: ${colors.accent};
  --color-background: ${colors.background};
  --color-surface: ${colors.surface};
  --color-text: ${colors.text};
  --color-primary-text: ${getContrastColor(colors.base)};
  --color-secondary-text: ${getContrastColor(colors.secondary)};
  --color-accent-text: ${getContrastColor(colors.accent)};
}`;
            cssOutput.textContent = css;
        }

        function renderPreview(colors) {
            previewCard.innerHTML = `
                <button class="preview-button" style="background: ${colors.base}; color: ${getContrastColor(colors.base)}; border: none;">
                    Primary Button
                </button>
                <button class="preview-button" style="background: transparent; color: ${colors.base}; border: 2px solid ${colors.base};">
                    Secondary Button
                </button>
                <button class="preview-button" style="background: ${colors.accent}; color: ${getContrastColor(colors.accent)}; border: none;">
                    Accent Button
                </button>
                <input class="preview-input" style="background: ${colors.surface}; border-color: ${colors.base}; color: ${colors.text};" placeholder="Input field">
            `;
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateColors() {
            const baseColor = colorPicker.value;
            colorPreview.style.background = baseColor;
            hexInput.value = baseColor.toUpperCase();
            generatedColors = generateScheme(baseColor, currentScheme);
            renderColors(generatedColors);
            renderCSS(generatedColors);
            renderPreview(generatedColors);
        }

        colorPicker.addEventListener('input', updateColors);

        hexInput.addEventListener('input', (e) => {
            let value = e.target.value;
            if (!value.startsWith('#')) value = '#' + value;
            if (/^#[0-9A-Fa-f]{6}$/.test(value)) {
                colorPicker.value = value;
                updateColors();
            }
        });

        schemeItems.forEach(item => {
            item.addEventListener('click', () => {
                schemeItems.forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentScheme = item.dataset.scheme;
                updateColors();
            });
        });

        copyAllBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(cssOutput.textContent);
            showToast('CSS variables copied!');
        });

        updateColors();
    </script>
</body>
</html>
