<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities Encoder/Decoder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0c0c10;
            --bg-secondary: #14141c;
            --bg-tertiary: #1e1e2a;
            --accent: #5c9dff;
            --accent-secondary: #7b68ee;
            --accent-glow: rgba(92, 157, 255, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #9090a0;
            --text-muted: #505060;
            --border: #2a2a3a;
            --success: #00d68f;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 12px;
            animation: fadeInUp 0.6s ease-out;
        }

        .tab {
            flex: 1;
            padding: 0.85rem 1.5rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab:hover {
            color: var(--text-primary);
            background: var(--bg-tertiary);
        }

        .tab.active {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.3s; }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .char-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 1rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: 'Consolas', 'Monaco', monospace;
            resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .result-box {
            background: var(--bg-primary);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 1rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.95rem;
            min-height: 100px;
            max-height: 300px;
            overflow-y: auto;
            word-break: break-all;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .result-box:empty::before {
            content: 'Result will appear here...';
            color: var(--text-muted);
            font-style: italic;
        }

        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .option-group {
            flex: 1;
            min-width: 200px;
        }

        select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .checkbox-row input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-row span {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .quick-chars {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .quick-char {
            padding: 0.4rem 0.75rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-char:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--bg-primary);
        }

        .reference-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.75rem;
        }

        .reference-item {
            padding: 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            text-align: center;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            transition: background 0.2s, transform 0.2s;
        }

        .reference-item:hover {
            background: var(--border);
            transform: scale(1.02);
        }

        .reference-char {
            color: var(--accent);
            font-size: 1.2rem;
            margin-bottom: 0.25rem;
        }

        .reference-name {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .copy-feedback {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: var(--bg-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 100;
        }

        .copy-feedback.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.8rem; }
            .card { padding: 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
            .tabs { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HTML Entities Tool</h1>
            <p class="subtitle">Escape and unescape HTML entities instantly</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="escape">Encode / Escape</button>
            <button class="tab" data-tab="unescape">Decode / Unescape</button>
            <button class="tab" data-tab="reference">Reference</button>
        </div>

        <div id="escapePanel" class="card panel active">
            <div class="input-group">
                <div class="label-row">
                    <label for="escapeInput">HTML to Encode</label>
                    <span class="char-count" id="escapeCount">0 characters</span>
                </div>
                <textarea id="escapeInput" placeholder="Enter HTML with special characters like <div> & &quot;quotes&quot;..."></textarea>
                <div class="quick-chars">
                    <span style="color: var(--text-muted); font-size: 0.85rem; align-self: center;">Quick insert:</span>
                    <button class="quick-char" data-char="<">&lt;</button>
                    <button class="quick-char" data-char=">">&gt;</button>
                    <button class="quick-char" data-char="&">&amp;</button>
                    <button class="quick-char" data-char='"'>"</button>
                    <button class="quick-char" data-char="'">'</button>
                    <button class="quick-char" data-char="  ">Spaces</button>
                </div>
            </div>
            <div class="input-group">
                <div class="label-row">
                    <label>Encoded Output</label>
                </div>
                <div class="result-box" id="escapeOutput"></div>
            </div>
            <div class="btn-group">
                <button class="btn" id="escapeBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    Encode
                </button>
                <button class="btn btn-secondary" id="escapeCopyBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Copy
                </button>
                <button class="btn btn-secondary" id="escapeClearBtn">Clear</button>
            </div>
        </div>

        <div id="unescapePanel" class="card panel">
            <div class="input-group">
                <div class="label-row">
                    <label for="unescapeInput">Encoded HTML</label>
                    <span class="char-count" id="unescapeCount">0 characters</span>
                </div>
                <textarea id="unescapeInput" placeholder="Enter encoded HTML like &lt;div&gt; &amp; &quot;quotes&quot;..."></textarea>
            </div>
            <div class="input-group">
                <div class="label-row">
                    <label>Decoded Output</label>
                </div>
                <div class="result-box" id="unescapeOutput"></div>
            </div>
            <div class="btn-group">
                <button class="btn" id="unescapeBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    Decode
                </button>
                <button class="btn btn-secondary" id="unescapeCopyBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Copy
                </button>
                <button class="btn btn-secondary" id="unescapeClearBtn">Clear</button>
            </div>
        </div>

        <div id="referencePanel" class="card panel">
            <h3 style="color: var(--text-secondary); margin-bottom: 1.5rem;">Common HTML Entities</h3>
            <div class="reference-grid">
                <div class="reference-item">
                    <div class="reference-char">&lt;</div>
                    <div class="reference-name">&lt;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&gt;</div>
                    <div class="reference-name">&gt;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&amp;</div>
                    <div class="reference-name">&amp;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">"</div>
                    <div class="reference-name">&quot;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">'</div>
                    <div class="reference-name">&apos;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&nbsp;</div>
                    <div class="reference-name">space</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&copy;</div>
                    <div class="reference-name">&copy;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&reg;</div>
                    <div class="reference-name">&reg;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&trade;</div>
                    <div class="reference-name">&trade;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&mdash;</div>
                    <div class="reference-name">&mdash;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&ndash;</div>
                    <div class="reference-name">&ndash;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&lsquo;</div>
                    <div class="reference-name">&lsquo;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&rsquo;</div>
                    <div class="reference-name">&rsquo;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&ldquo;</div>
                    <div class="reference-name">&ldquo;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&rdquo;</div>
                    <div class="reference-name">&rdquo;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&euro;</div>
                    <div class="reference-name">&euro;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&pound;</div>
                    <div class="reference-name">&pound;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&yen;</div>
                    <div class="reference-name">&yen;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&cent;</div>
                    <div class="reference-name">&cent;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&sect;</div>
                    <div class="reference-name">&sect;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&para;</div>
                    <div class="reference-name">&para;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&bull;</div>
                    <div class="reference-name">&bull;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&deg;</div>
                    <div class="reference-name">&deg;</div>
                </div>
                <div class="reference-item">
                    <div class="reference-char">&frac12;</div>
                    <div class="reference-name">&frac12;</div>
                </div>
            </div>
        </div>
    </div>

    <div id="copyFeedback" class="copy-feedback">Copied to clipboard!</div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const panels = document.querySelectorAll('.panel');

        const escapeInput = document.getElementById('escapeInput');
        const escapeOutput = document.getElementById('escapeOutput');
        const escapeCount = document.getElementById('escapeCount');
        const escapeBtn = document.getElementById('escapeBtn');
        const escapeCopyBtn = document.getElementById('escapeCopyBtn');
        const escapeClearBtn = document.getElementById('escapeClearBtn');

        const unescapeInput = document.getElementById('unescapeInput');
        const unescapeOutput = document.getElementById('unescapeOutput');
        const unescapeCount = document.getElementById('unescapeCount');
        const unescapeBtn = document.getElementById('unescapeBtn');
        const unescapeCopyBtn = document.getElementById('unescapeCopyBtn');
        const unescapeClearBtn = document.getElementById('unescapeClearBtn');

        const copyFeedback = document.getElementById('copyFeedback');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function unescapeHtml(text) {
            const div = document.createElement('div');
            div.innerHTML = text;
            return div.textContent;
        }

        function showFeedback() {
            copyFeedback.classList.add('show');
            setTimeout(() => copyFeedback.classList.remove('show'), 2000);
        }

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                panels.forEach(p => p.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Panel').classList.add('active');
            });
        });

        escapeInput.addEventListener('input', () => {
            escapeCount.textContent = escapeInput.value.length + ' characters';
        });

        unescapeInput.addEventListener('input', () => {
            unescapeCount.textContent = unescapeInput.value.length + ' characters';
        });

        document.querySelectorAll('.quick-char').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.char === '  ') {
                    escapeInput.value += '        ';
                } else {
                    escapeInput.value += btn.dataset.char;
                }
                escapeInput.dispatchEvent(new Event('input'));
                escapeInput.focus();
            });
        });

        escapeBtn.addEventListener('click', () => {
            if (escapeInput.value) {
                escapeOutput.textContent = escapeHtml(escapeInput.value);
            }
        });

        escapeCopyBtn.addEventListener('click', () => {
            if (escapeOutput.textContent) {
                navigator.clipboard.writeText(escapeOutput.textContent);
                showFeedback();
            }
        });

        escapeClearBtn.addEventListener('click', () => {
            escapeInput.value = '';
            escapeOutput.textContent = '';
            escapeCount.textContent = '0 characters';
        });

        unescapeBtn.addEventListener('click', () => {
            if (unescapeInput.value) {
                unescapeOutput.textContent = unescapeHtml(unescapeInput.value);
            }
        });

        unescapeCopyBtn.addEventListener('click', () => {
            if (unescapeOutput.textContent) {
                navigator.clipboard.writeText(unescapeOutput.textContent);
                showFeedback();
            }
        });

        unescapeClearBtn.addEventListener('click', () => {
            unescapeInput.value = '';
            unescapeOutput.textContent = '';
            unescapeCount.textContent = '0 characters';
        });
    </script>
</body>
</html>
