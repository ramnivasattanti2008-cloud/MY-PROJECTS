<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0d0d12;
            --bg-secondary: #16161f;
            --bg-tertiary: #1e1e2a;
            --bg-card: #1a1a24;
            --border: #2a2a3a;
            --text-primary: #e4e4eb;
            --text-secondary: #9090a0;
            --text-muted: #606070;
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --accent-secondary: #06b6d4;
            --success: #10b981;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        header { text-align: center; margin-bottom: 2rem; padding: 2rem 0; }
        h1 {
            font-size: 2.5rem; font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6 0%, #06b6d4 50%, #10b981 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 0.5rem;
        }
        .subtitle { color: var(--text-secondary); font-size: 1.1rem; }
        .preview-section {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            overflow: hidden; margin-bottom: 1.5rem; min-height: 280px; position: relative;
        }
        .preview-area {
            width: 100%; height: 250px; transition: background 0.4s ease;
        }
        .preview-overlay {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 1rem 1.5rem; background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex; justify-content: space-between; align-items: center;
        }
        .preview-info { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--text-secondary); }
        .preview-actions { display: flex; gap: 0.5rem; }
        .controls-section { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .control-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
            padding: 1.5rem;
        }
        .control-title {
            font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-secondary); margin-bottom: 1rem;
        }
        .type-selector { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .type-btn {
            flex: 1; min-width: 100px; padding: 0.75rem; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary);
            font-family: inherit; font-size: 0.85rem; font-weight: 500; cursor: pointer;
            transition: all 0.2s ease;
        }
        .type-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .type-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
        .color-stops { display: flex; flex-direction: column; gap: 1rem; }
        .color-stop { display: flex; gap: 0.75rem; align-items: center; }
        .color-input-wrap { position: relative; flex: 1; }
        .color-preview {
            width: 100%; height: 44px; border-radius: 8px; border: 1px solid var(--border);
            cursor: pointer; transition: transform 0.2s ease;
        }
        .color-preview:hover { transform: scale(1.02); }
        .color-input {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }
        .position-input {
            width: 60px; padding: 0.5rem; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-primary); font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem; text-align: center;
        }
        .remove-btn {
            width: 32px; height: 32px; background: var(--bg-tertiary); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s ease;
        }
        .remove-btn:hover { background: #ef4444; border-color: #ef4444; color: white; }
        .add-stop-btn {
            width: 100%; padding: 0.75rem; background: var(--bg-secondary); border: 1px dashed var(--border);
            border-radius: 8px; color: var(--text-secondary); font-family: inherit; font-size: 0.85rem;
            cursor: pointer; transition: all 0.2s ease;
        }
        .add-stop-btn:hover { border-color: var(--accent); color: var(--accent); }
        .angle-control { margin-top: 1rem; }
        .angle-slider-wrap { display: flex; align-items: center; gap: 1rem; margin-top: 0.75rem; }
        .angle-slider {
            flex: 1; -webkit-appearance: none; height: 8px; background: var(--bg-secondary);
            border-radius: 4px; outline: none;
        }
        .angle-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; background: var(--accent);
            border-radius: 50%; cursor: pointer; transition: transform 0.2s ease;
        }
        .angle-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
        .angle-value {
            min-width: 60px; padding: 0.5rem; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
            text-align: center;
        }
        .preset-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem;
        }
        .preset-card {
            aspect-ratio: 16/9; border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
            position: relative; overflow: hidden; border: 2px solid transparent;
        }
        .preset-card:hover { transform: scale(1.05); border-color: var(--accent); }
        .preset-card.selected { border-color: var(--accent); }
        .preset-label {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 0.5rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); font-size: 0.75rem;
        }
        .code-output {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
        }
        .code-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem; background: var(--bg-secondary); border-bottom: 1px solid var(--border);
        }
        .code-title { font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
        .code-block {
            padding: 1.5rem; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
            line-height: 1.7; word-break: break-all; color: var(--text-primary);
        }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem;
            border: none; border-radius: 8px; font-family: inherit; font-size: 0.85rem;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--bg-secondary); border-color: var(--accent); }
        .btn-icon { padding: 0.5rem; min-width: auto; }
        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); border: 1px solid var(--success); color: var(--text-primary);
            padding: 1rem 2rem; border-radius: 12px; font-weight: 500; opacity: 0;
            transition: all 0.3s ease; z-index: 1000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease forwards; }
        @media (max-width: 800px) {
            .controls-section { grid-template-columns: 1fr; }
            h1 { font-size: 1.8rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="animate-in">
            <h1>CSS Gradient Generator</h1>
            <p class="subtitle">Create beautiful CSS gradients with live preview</p>
        </header>

        <div class="preview-section animate-in">
            <div class="preview-area" id="previewArea"></div>
            <div class="preview-overlay">
                <span class="preview-info" id="previewInfo">linear-gradient(90deg, #667eea, #764ba2)</span>
                <div class="preview-actions">
                    <button class="btn btn-secondary btn-icon" onclick="randomizeGradient()" title="Randomize">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                    </button>
                    <button class="btn btn-primary" onclick="copyCSS()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                        Copy CSS
                    </button>
                </div>
            </div>
        </div>

        <div class="controls-section">
            <div class="control-card animate-in">
                <div class="control-title">Gradient Type & Direction</div>
                <div class="type-selector">
                    <button class="type-btn active" onclick="setType('linear')">Linear</button>
                    <button class="type-btn" onclick="setType('radial')">Radial</button>
                    <button class="type-btn" onclick="setType('conic')">Conic</button>
                </div>
                <div id="angleControl" class="angle-control">
                    <div class="field-label" style="font-size: 0.8rem; color: var(--text-secondary);">Direction (degrees)</div>
                    <div class="angle-slider-wrap">
                        <input type="range" class="angle-slider" id="angleSlider" min="0" max="360" value="90" oninput="updateAngle()">
                        <input type="number" class="angle-value" id="angleValue" value="90" oninput="updateFromInput()">
                    </div>
                </div>
            </div>

            <div class="control-card animate-in">
                <div class="control-title">Color Stops</div>
                <div class="color-stops" id="colorStops">
                    <!-- Generated by JS -->
                </div>
                <button class="add-stop-btn" onclick="addColorStop()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 0.5rem;"><path d="M12 5v14M5 12h14"/></svg>
                    Add Color Stop
                </button>
            </div>
        </div>

        <div class="control-card animate-in" style="margin-bottom: 1.5rem;">
            <div class="control-title">Preset Gradients</div>
            <div class="preset-grid" id="presetGrid">
                <!-- Generated by JS -->
            </div>
        </div>

        <div class="code-output animate-in">
            <div class="code-header">
                <span class="code-title">CSS Code</span>
                <button class="btn btn-secondary" onclick="copyCSS()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                    Copy
                </button>
            </div>
            <div class="code-block" id="codeOutput">background: linear-gradient(90deg, #667eea, #764ba2);</div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        let gradientType = 'linear';
        let angle = 90;
        let colorStops = [
            { color: '#667eea', position: 0 },
            { color: '#764ba2', position: 100 }
        ];
        let presets = [
            { colors: ['#667eea', '#764ba2'], type: 'linear', angle: 90 },
            { colors: ['#f093fb', '#f5576c'], type: 'linear', angle: 135 },
            { colors: ['#4facfe', '#00f2fe'], type: 'linear', angle: 180 },
            { colors: ['#43e97b', '#38f9d7'], type: 'linear', angle: 160 },
            { colors: ['#fa709a', '#fee140'], type: 'linear', angle: 45 },
            { colors: ['#a18cd1', '#fbc2eb'], type: 'linear', angle: 90 },
            { colors: ['#ff9a9e', '#fecfef', '#fecfef'], type: 'linear', angle: 90 },
            { colors: ['#ffecd2', '#fcb69f'], type: 'linear', angle: 120 },
            { colors: ['#a1c4fd', '#c2e9fb'], type: 'linear', angle: 135 },
            { colors: ['#d4fc79', '#96e6a1'], type: 'linear', angle: 90 },
            { colors: ['#84fab0', '#8fd3f4'], type: 'linear', angle: 180 },
            { colors: ['#cfd9df', '#e2ebf0'], type: 'linear', angle: 90 },
            { colors: ['#f5f7fa', '#c3cfe2'], type: 'linear', angle: 180 },
            { colors: ['#667eea', '#764ba2', '#f093fb'], type: 'linear', angle: 135 },
            { colors: ['#0c3483', '#a2b6df', '#0c3483'], type: 'linear', angle: 90 },
            { colors: ['#ff0844', '#ffb199'], type: 'linear', angle: 135 },
        ];

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function generateGradient() {
            const stops = colorStops
                .map(s => `${s.color}${s.position !== undefined ? ` ${s.position}%` : ''}`)
                .join(', ');

            let gradient;
            if (gradientType === 'linear') {
                gradient = `linear-gradient(${angle}deg, ${stops})`;
            } else if (gradientType === 'radial') {
                gradient = `radial-gradient(circle, ${stops})`;
            } else {
                gradient = `conic-gradient(from ${angle}deg at 50% 50%, ${stops})`;
            }
            return gradient;
        }

        function renderGradient() {
            const gradient = generateGradient();
            document.getElementById('previewArea').style.background = gradient;
            document.getElementById('previewInfo').textContent = gradient;
            document.getElementById('codeOutput').textContent = `background: ${gradient};`;
        }

        function renderColorStops() {
            const container = document.getElementById('colorStops');
            container.innerHTML = colorStops.map((stop, i) => `
                <div class="color-stop">
                    <div class="color-input-wrap">
                        <div class="color-preview" style="background: ${stop.color};" onclick="document.getElementById('color-${i}').click()"></div>
                        <input type="color" class="color-input" id="color-${i}" value="${stop.color}" onchange="updateColor(${i}, this.value)">
                    </div>
                    <input type="number" class="position-input" value="${stop.position}" min="0" max="100"
                        onchange="updatePosition(${i}, this.value)" title="Position (%)">
                    ${colorStops.length > 2 ? `
                        <button class="remove-btn" onclick="removeStop(${i})">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                        </button>
                    ` : '<div style="width: 32px;"></div>'}
                </div>
            `).join('');
        }

        function updateColor(index, color) {
            colorStops[index].color = color;
            renderColorStops();
            renderGradient();
        }

        function updatePosition(index, position) {
            colorStops[index].position = parseInt(position) || 0;
            renderGradient();
        }

        function addColorStop() {
            const lastColor = colorStops[colorStops.length - 1].color;
            const r = parseInt(lastColor.slice(1, 3), 16);
            const g = parseInt(lastColor.slice(3, 5), 16);
            const b = parseInt(lastColor.slice(5, 7), 16);
            const newColor = `#${Math.min(255, r + 20).toString(16).padStart(2, '0')}${Math.min(255, g + 20).toString(16).padStart(2, '0')}${Math.min(255, b + 20).toString(16).padStart(2, '0')}`;
            colorStops.push({ color: newColor, position: 100 });
            renderColorStops();
            renderGradient();
        }

        function removeStop(index) {
            colorStops.splice(index, 1);
            renderColorStops();
            renderGradient();
        }

        function setType(type) {
            gradientType = type;
            document.querySelectorAll('.type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('angleControl').style.display = type === 'radial' ? 'none' : 'block';
            if (type === 'conic') {
                document.querySelector('.angle-slider-wrap .field-label, .angle-control .field-label').textContent = 'Starting Angle (degrees)';
            } else {
                document.querySelector('.angle-control .field-label').textContent = 'Direction (degrees)';
            }
            renderGradient();
        }

        function updateAngle() {
            angle = parseInt(document.getElementById('angleSlider').value);
            document.getElementById('angleValue').value = angle;
            renderGradient();
        }

        function updateFromInput() {
            angle = parseInt(document.getElementById('angleValue').value) || 0;
            document.getElementById('angleSlider').value = angle;
            renderGradient();
        }

        function renderPresets() {
            const grid = document.getElementById('presetGrid');
            grid.innerHTML = presets.map((p, i) => {
                const stops = p.colors.map((c, j) => `${c} ${Math.round(j / (p.colors.length - 1) * 100)}%`).join(', ');
                const bg = p.type === 'linear' ? `linear-gradient(${p.angle}deg, ${stops})` :
                           p.type === 'radial' ? `radial-gradient(circle, ${stops})` :
                           `conic-gradient(from ${p.angle}deg, ${stops})`;
                return `<div class="preset-card" style="background: ${bg};" onclick="applyPreset(${i})">
                    <div class="preset-label">${p.colors.length} colors</div>
                </div>`;
            }).join('');
        }

        function applyPreset(index) {
            const preset = presets[index];
            gradientType = preset.type;
            angle = preset.angle;
            colorStops = preset.colors.map((c, i) => ({
                color: c,
                position: Math.round(i / (preset.colors.length - 1) * 100)
            }));

            document.getElementById('angleSlider').value = angle;
            document.getElementById('angleValue').value = angle;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase() === gradientType);
            });
            document.getElementById('angleControl').style.display = gradientType === 'radial' ? 'none' : 'block';

            renderColorStops();
            renderGradient();
        }

        function randomizeGradient() {
            const randomColor = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
            const numStops = Math.floor(Math.random() * 3) + 2;
            colorStops = [];
            for (let i = 0; i < numStops; i++) {
                colorStops.push({ color: randomColor(), position: Math.round(i / (numStops - 1) * 100) });
            }
            angle = Math.floor(Math.random() * 360);
            document.getElementById('angleSlider').value = angle;
            document.getElementById('angleValue').value = angle;
            renderColorStops();
            renderGradient();
        }

        function copyCSS() {
            const css = `background: ${generateGradient()};`;
            navigator.clipboard.writeText(css).then(() => showToast('Copied to clipboard!'));
        }

        renderColorStops();
        renderPresets();
        renderGradient();
    </script>
</body>
</html>
