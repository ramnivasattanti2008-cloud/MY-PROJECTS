<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slug Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f14;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #24243a;
            --accent: #7c5cff;
            --accent-glow: rgba(124, 92, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #606070;
            --border: #2a2a3e;
            --success: #00d68f;
            --error: #ff6b6b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        textarea, input {
            width: 100%;
            padding: 1rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        textarea {
            min-height: 120px;
        }

        .result-display {
            background: var(--bg-primary);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 1.25rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 1.1rem;
            word-break: break-all;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .result-text {
            flex: 1;
            color: var(--accent);
        }

        .result-text.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .history-section h3 {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-item span {
            color: var(--accent);
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 1rem;
        }

        .history-item button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .history-item button:hover {
            color: var(--text-primary);
            background: var(--border);
        }

        .empty-history {
            color: var(--text-muted);
            text-align: center;
            padding: 2rem;
            font-style: italic;
        }

        .copy-feedback {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: var(--bg-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 100;
        }

        .copy-feedback.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 1.5rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Slug Generator</h1>
            <p class="subtitle">Convert any text into URL-friendly slugs</p>
        </header>

        <div class="card">
            <div class="input-group">
                <label for="inputText">Enter Text</label>
                <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
            </div>
            <div class="input-group">
                <label>Generated Slug</label>
                <div class="result-display">
                    <span id="slugOutput" class="result-text empty">Your slug will appear here...</span>
                    <button class="btn btn-secondary" id="copyBtn" title="Copy to clipboard">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn" id="generateBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    Generate Slug
                </button>
                <button class="btn btn-secondary" id="clearBtn">Clear</button>
            </div>
        </div>

        <div class="card history-section">
            <h3>History</h3>
            <div id="historyList" class="history-list">
                <div class="empty-history">No slugs generated yet</div>
            </div>
        </div>
    </div>

    <div id="copyFeedback" class="copy-feedback">Copied to clipboard!</div>

    <script>
        const inputText = document.getElementById('inputText');
        const slugOutput = document.getElementById('slugOutput');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const historyList = document.getElementById('historyList');
        const copyFeedback = document.getElementById('copyFeedback');

        let history = JSON.parse(localStorage.getItem('slugHistory') || '[]');

        function generateSlug(text) {
            return text
                .toLowerCase()
                .normalize('NFD')
                .replace(/[̀-ͯ]/g, '')
                .replace(/[^\w\s-]/g, '')
                .replace(/[\s_]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function updateOutput() {
            const slug = generateSlug(inputText.value);
            if (slug) {
                slugOutput.textContent = slug;
                slugOutput.classList.remove('empty');
            } else {
                slugOutput.textContent = 'Your slug will appear here...';
                slugOutput.classList.add('empty');
            }
        }

        function addToHistory(slug) {
            if (!slug || history.includes(slug)) return;
            history.unshift(slug);
            if (history.length > 20) history.pop();
            localStorage.setItem('slugHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-history">No slugs generated yet</div>';
                return;
            }
            historyList.innerHTML = history.map((slug, i) => `
                <div class="history-item">
                    <span>${slug}</span>
                    <button onclick="copyFromHistory(${i})" title="Copy">
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
        }

        function showCopyFeedback() {
            copyFeedback.classList.add('show');
            setTimeout(() => copyFeedback.classList.remove('show'), 2000);
        }

        function copyFromHistory(index) {
            navigator.clipboard.writeText(history[index]);
            showCopyFeedback();
        }

        inputText.addEventListener('input', updateOutput);

        generateBtn.addEventListener('click', () => {
            const slug = generateSlug(inputText.value);
            if (slug) addToHistory(slug);
        });

        copyBtn.addEventListener('click', () => {
            const slug = slugOutput.textContent;
            if (!slugOutput.classList.contains('empty')) {
                navigator.clipboard.writeText(slug);
                showCopyFeedback();
            }
        });

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            updateOutput();
        });

        renderHistory();
    </script>
</body>
</html>
