<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random String Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0e0e14;
            --bg-secondary: #17171f;
            --bg-tertiary: #23232f;
            --accent: #ffd93d;
            --accent-secondary: #ff8c42;
            --accent-glow: rgba(255, 217, 61, 0.2);
            --text-primary: #ffffff;
            --text-secondary: #9090a0;
            --text-muted: #505060;
            --border: #2a2a3a;
            --success: #00d68f;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            animation: fadeInUp 0.6s ease-out;
            animation-fill-mode: both;
        }

        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .presets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .preset-btn {
            padding: 1rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .preset-btn:hover {
            border-color: var(--accent);
            background: var(--bg-primary);
        }

        .preset-btn.active {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .preset-btn span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-weight: 400;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .option-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .custom-chars {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Consolas', monospace;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .custom-chars:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .checkbox-item input {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .checkbox-item span {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .result-display {
            background: var(--bg-primary);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 1.5rem;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 1.1rem;
            word-break: break-all;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 0 25px var(--accent-glow);
            margin-bottom: 1.5rem;
        }

        .result-text {
            flex: 1;
            color: var(--accent);
            letter-spacing: 1px;
        }

        .result-text.empty {
            color: var(--text-muted);
            font-style: italic;
        }

        .strength-meter {
            margin-top: 1rem;
        }

        .strength-bar {
            height: 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }

        .strength-fill.weak { background: var(--accent-secondary); width: 25%; }
        .strength-fill.fair { background: #ffd93d; width: 50%; }
        .strength-fill.good { background: #9be564; width: 75%; }
        .strength-fill.strong { background: var(--success); width: 100%; }

        .strength-label {
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.75rem;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .copy-feedback {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: var(--bg-primary);
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            z-index: 100;
        }

        .copy-feedback.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.8rem; }
            .card { padding: 1.5rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Random String Generator</h1>
            <p class="subtitle">Create passwords, random text, and custom strings</p>
        </header>

        <div class="card">
            <label style="color: var(--text-secondary); font-size: 0.9rem; font-weight: 500; display: block; margin-bottom: 1rem;">Quick Presets</label>
            <div class="presets">
                <button class="preset-btn active" data-preset="password">
                    Strong Password
                    <span>16 chars, all types</span>
                </button>
                <button class="preset-btn" data-preset="uuid">
                    UUID v4
                    <span>Standard format</span>
                </button>
                <button class="preset-btn" data-preset="pin">
                    PIN Code
                    <span>4-6 digits</span>
                </button>
                <button class="preset-btn" data-preset="hex">
                    Hex Color
                    <span># + 6 chars</span>
                </button>
                <button class="preset-btn" data-preset="alphanumeric">
                    Alphanumeric
                    <span>Letters + numbers</span>
                </button>
                <button class="preset-btn" data-preset="custom">
                    Custom
                    <span>Your own rules</span>
                </button>
            </div>
        </div>

        <div class="card">
            <div class="options">
                <div class="option-group">
                    <label for="length">Length</label>
                    <input type="number" id="length" value="16" min="1" max="256">
                </div>
                <div class="option-group" id="customCharsGroup" style="display: none;">
                    <label for="customChars">Custom Characters</label>
                    <input type="text" id="customChars" class="custom-chars" placeholder="abcdef123456">
                </div>
            </div>

            <div class="checkboxes" id="charOptions">
                <label class="checkbox-item">
                    <input type="checkbox" id="uppercase" checked>
                    <span>Uppercase (A-Z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="lowercase" checked>
                    <span>Lowercase (a-z)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="numbers" checked>
                    <span>Numbers (0-9)</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" id="symbols" checked>
                    <span>Symbols (!@#$...)</span>
                </label>
            </div>
        </div>

        <div class="card">
            <div class="result-display">
                <span id="resultText" class="result-text empty">Click Generate to create a string</span>
                <button class="btn btn-secondary" id="copyBtn" title="Copy to clipboard">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </button>
            </div>

            <div class="strength-meter">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-label">
                    <span>Weak</span>
                    <span id="strengthText">Generate a string</span>
                    <span>Strong</span>
                </div>
            </div>

            <div class="btn-group" style="margin-top: 1.5rem;">
                <button class="btn" id="generateBtn">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Generate
                </button>
                <button class="btn btn-secondary" id="clearBtn">Clear</button>
            </div>
        </div>
    </div>

    <div id="copyFeedback" class="copy-feedback">Copied to clipboard!</div>

    <script>
        const presets = document.querySelectorAll('.preset-btn');
        const lengthInput = document.getElementById('length');
        const customCharsInput = document.getElementById('customChars');
        const customCharsGroup = document.getElementById('customCharsGroup');
        const charOptions = document.getElementById('charOptions');
        const uppercase = document.getElementById('uppercase');
        const lowercase = document.getElementById('lowercase');
        const numbers = document.getElementById('numbers');
        const symbols = document.getElementById('symbols');
        const resultText = document.getElementById('resultText');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const copyFeedback = document.getElementById('copyFeedback');

        const presetConfigs = {
            password: { length: 16, uppercase: true, lowercase: true, numbers: true, symbols: true },
            uuid: { length: 36, uppercase: false, lowercase: false, numbers: false, symbols: false, custom: 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx' },
            pin: { length: 6, uppercase: false, lowercase: false, numbers: true, symbols: false },
            hex: { length: 7, uppercase: false, lowercase: false, numbers: false, symbols: false, custom: '#0123456789abcdef' },
            alphanumeric: { length: 16, uppercase: true, lowercase: true, numbers: true, symbols: false },
            custom: { length: 16, uppercase: true, lowercase: true, numbers: true, symbols: false }
        };

        function applyPreset(preset) {
            presets.forEach(p => p.classList.remove('active'));
            document.querySelector(`[data-preset="${preset}"]`).classList.add('active');

            const config = presetConfigs[preset];
            lengthInput.value = config.length;

            uppercase.checked = config.uppercase;
            lowercase.checked = config.lowercase;
            numbers.checked = config.numbers;
            symbols.checked = config.symbols;

            if (config.custom) {
                customCharsInput.value = config.custom;
                customCharsGroup.style.display = 'block';
                charOptions.style.display = 'none';
            } else {
                customCharsInput.value = '';
                customCharsGroup.style.display = 'none';
                charOptions.style.display = 'flex';
            }
        }

        function getCharSet() {
            let chars = '';
            if (customCharsInput.value) return customCharsInput.value;
            if (uppercase.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (lowercase.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (numbers.checked) chars += '0123456789';
            if (symbols.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            return chars;
        }

        function generateRandomString() {
            const custom = customCharsInput.value;
            if (custom) return custom.split('').map(c => c === 'x' || c === 'X' || c === 'y' ? '0123456789abcdef'[Math.floor(Math.random() * 16)] : c === 'n' ? '0123456789'[Math.floor(Math.random() * 10)] : c).join('');

            const charSet = getCharSet();
            if (!charSet) return '';

            const length = parseInt(lengthInput.value) || 16;
            let result = '';
            for (let i = 0; i < length; i++) {
                result += charSet[Math.floor(Math.random() * charSet.length)];
            }
            return result;
        }

        function calculateStrength(str) {
            let score = 0;
            if (str.length >= 8) score++;
            if (str.length >= 12) score++;
            if (str.length >= 16) score++;
            if (/[a-z]/.test(str) && /[A-Z]/.test(str)) score++;
            if (/\d/.test(str)) score++;
            if (/[^a-zA-Z0-9]/.test(str)) score++;

            if (score <= 2) return { class: 'weak', text: 'Weak' };
            if (score <= 3) return { class: 'fair', text: 'Fair' };
            if (score <= 4) return { class: 'good', text: 'Good' };
            return { class: 'strong', text: 'Strong' };
        }

        function generate() {
            const result = generateRandomString();
            if (result) {
                resultText.textContent = result;
                resultText.classList.remove('empty');

                const strength = calculateStrength(result);
                strengthFill.className = 'strength-fill ' + strength.class;
                strengthText.textContent = strength.text;
            }
        }

        function showFeedback() {
            copyFeedback.classList.add('show');
            setTimeout(() => copyFeedback.classList.remove('show'), 2000);
        }

        presets.forEach(btn => {
            btn.addEventListener('click', () => applyPreset(btn.dataset.preset));
        });

        generateBtn.addEventListener('click', generate);

        copyBtn.addEventListener('click', () => {
            if (!resultText.classList.contains('empty')) {
                navigator.clipboard.writeText(resultText.textContent);
                showFeedback();
            }
        });

        clearBtn.addEventListener('click', () => {
            resultText.textContent = 'Click Generate to create a string';
            resultText.classList.add('empty');
            strengthFill.className = 'strength-fill';
            strengthText.textContent = 'Generate a string';
        });

        applyPreset('password');
    </script>
</body>
</html>
