<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter & Validator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0d0d12;
            --bg-secondary: #16161f;
            --bg-tertiary: #1e1e2a;
            --bg-card: #1a1a24;
            --border: #2a2a3a;
            --text-primary: #e4e4eb;
            --text-secondary: #9090a0;
            --text-muted: #606070;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 2rem 0;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        .tool-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }
        .panel:hover {
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.1);
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .panel-title {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }
        .panel-actions {
            display: flex;
            gap: 0.5rem;
        }
        textarea {
            width: 100%;
            min-height: 400px;
            padding: 1.5rem;
            background: var(--bg-primary);
            border: none;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            resize: vertical;
            outline: none;
        }
        textarea::placeholder {
            color: var(--text-muted);
        }
        pre {
            width: 100%;
            min-height: 400px;
            padding: 1.5rem;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.7;
            overflow: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }
        .btn-icon {
            padding: 0.5rem;
            min-width: auto;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .status-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.3s ease;
        }
        .status-dot.valid { background: var(--success); }
        .status-dot.invalid { background: var(--error); }
        .status-dot.warning { background: var(--warning); }
        .stats {
            color: var(--text-secondary);
        }
        .json-key { color: #a78bfa; }
        .json-string { color: #34d399; }
        .json-number { color: #fbbf24; }
        .json-boolean { color: #f472b6; }
        .json-null { color: #6b7280; }
        .json-bracket { color: var(--text-secondary); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in {
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .copied {
            animation: pulse 0.3s ease;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            border: 1px solid var(--success);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        @media (max-width: 900px) {
            .tool-container {
                grid-template-columns: 1fr;
            }
            h1 { font-size: 1.8rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="animate-in">
            <h1>JSON Formatter & Validator</h1>
            <p class="subtitle">Paste, validate, format, and minify JSON with syntax highlighting</p>
        </header>

        <div class="controls animate-in">
            <button class="btn btn-primary" onclick="formatJSON()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                Format
            </button>
            <button class="btn btn-primary" onclick="minifyJSON()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
                Minify
            </button>
            <button class="btn btn-secondary" onclick="validateJSON()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
                Validate
            </button>
            <button class="btn btn-secondary" onclick="clearAll()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                Clear
            </button>
        </div>

        <div class="tool-container">
            <div class="panel animate-in">
                <div class="panel-header">
                    <span class="panel-title">Input JSON</span>
                    <div class="panel-actions">
                        <button class="btn btn-secondary btn-icon" onclick="pasteFromClipboard()" title="Paste from clipboard">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>
                        </button>
                    </div>
                </div>
                <textarea id="inputJSON" placeholder='Paste your JSON here...

Example:
{
  "name": "VOJAS",
  "version": "1.0.0",
  "features": ["satellite", "analytics", "risk"]
}'></textarea>
                <div class="status-bar">
                    <div class="status-message">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Waiting for input...</span>
                    </div>
                    <div class="stats" id="statsText"></div>
                </div>
            </div>

            <div class="panel animate-in">
                <div class="panel-header">
                    <span class="panel-title">Output</span>
                    <div class="panel-actions">
                        <button class="btn btn-secondary btn-icon" onclick="copyOutput()" title="Copy to clipboard">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                        </button>
                    </div>
                </div>
                <pre id="outputJSON"></pre>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        const inputEl = document.getElementById('inputJSON');
        const outputEl = document.getElementById('outputJSON');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statsText = document.getElementById('statsText');
        const toast = document.getElementById('toast');

        function showToast(message = 'Copied to clipboard!') {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function updateStatus(type, message) {
            statusDot.className = 'status-dot ' + type;
            statusText.textContent = message;
        }

        function highlightJSON(json) {
            if (typeof json !== 'string') {
                json = JSON.stringify(json, null, 2);
            }
            return json
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, (match) => {
                    if (/:$/.test(match)) {
                        return `<span class="json-key">${match.slice(0, -1)}</span>:`;
                    }
                    return `<span class="json-string">${match}</span>`;
                })
                .replace(/\b(true|false)\b/g, '<span class="json-boolean">$1</span>')
                .replace(/\bnull\b/g, '<span class="json-null">null</span>')
                .replace(/\b(-?\d+\.?\d*([eE][+-]?\d+)?)\b/g, '<span class="json-number">$1</span>')
                .replace(/([{}\[\]])/g, '<span class="json-bracket">$1</span>');
        }

        function updateStats(text) {
            if (!text.trim()) {
                statsText.textContent = '';
                return;
            }
            const lines = text.split('\n').length;
            const chars = text.length;
            statsText.textContent = `${lines} lines | ${chars.toLocaleString()} characters`;
        }

        function formatJSON() {
            const input = inputEl.value.trim();
            if (!input) {
                updateStatus('warning', 'Please enter JSON first');
                return;
            }
            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, 2);
                outputEl.innerHTML = highlightJSON(formatted);
                updateStatus('valid', 'Valid JSON - Formatted successfully');
                updateStats(formatted);
            } catch (e) {
                outputEl.textContent = '';
                updateStatus('invalid', `Invalid JSON: ${e.message}`);
            }
        }

        function minifyJSON() {
            const input = inputEl.value.trim();
            if (!input) {
                updateStatus('warning', 'Please enter JSON first');
                return;
            }
            try {
                const parsed = JSON.parse(input);
                const minified = JSON.stringify(parsed);
                outputEl.textContent = minified;
                updateStatus('valid', 'Valid JSON - Minified successfully');
                updateStats(minified);
            } catch (e) {
                outputEl.textContent = '';
                updateStatus('invalid', `Invalid JSON: ${e.message}`);
            }
        }

        function validateJSON() {
            const input = inputEl.value.trim();
            if (!input) {
                updateStatus('warning', 'Please enter JSON to validate');
                return;
            }
            try {
                const parsed = JSON.parse(input);
                const keys = Object.keys(parsed).length;
                updateStatus('valid', `Valid JSON with ${keys} root key${keys !== 1 ? 's' : ''}`);
                outputEl.innerHTML = highlightJSON(JSON.stringify(parsed, null, 2));
                updateStats(input);
            } catch (e) {
                outputEl.textContent = '';
                updateStatus('invalid', `Invalid JSON: ${e.message}`);
            }
        }

        function clearAll() {
            inputEl.value = '';
            outputEl.innerHTML = '';
            updateStatus('', 'Waiting for input...');
            statsText.textContent = '';
            inputEl.focus();
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                inputEl.value = text;
                updateStats(text);
            } catch (e) {
                showToast('Could not paste from clipboard');
            }
        }

        function copyOutput() {
            const text = outputEl.textContent;
            if (!text) {
                showToast('Nothing to copy');
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard!');
            });
        }

        inputEl.addEventListener('input', () => {
            updateStats(inputEl.value);
            const val = inputEl.value.trim();
            if (!val) {
                updateStatus('', 'Waiting for input...');
            }
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = inputEl.selectionStart;
                const end = inputEl.selectionEnd;
                inputEl.value = inputEl.value.substring(0, start) + '  ' + inputEl.value.substring(end);
                inputEl.selectionStart = inputEl.selectionEnd = start + 2;
            }
        });
    </script>
</body>
</html>
