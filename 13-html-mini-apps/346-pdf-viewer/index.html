<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #f85149;
            --accent-hover: #ff6b61;
            --success: #3fb950;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            animation: slideDown 0.4s ease;
        }

        .toolbar-section {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
        }

        .btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover:not(:disabled) {
            background: var(--border);
            color: var(--text);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .btn-icon {
            padding: 0.5rem;
        }

        .page-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .page-input {
            width: 50px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.3rem;
            color: var(--text);
            font-size: 0.85rem;
            text-align: center;
        }

        .page-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .zoom-select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.3rem 0.5rem;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .zoom-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .file-info {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 0.85rem;
            max-width: 300px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .viewer-area {
            flex: 1;
            overflow: auto;
            padding: 2rem;
            display: flex;
            justify-content: center;
            background: #1a1f25;
        }

        .pdf-canvas {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            background: white;
        }

        .upload-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.5s ease;
        }

        .upload-overlay.hidden {
            display: none;
        }

        .upload-box {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 4rem 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            max-width: 500px;
        }

        .upload-box:hover, .upload-box.dragover {
            border-color: var(--accent);
            background: rgba(248, 81, 73, 0.05);
            transform: scale(1.02);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        .upload-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .upload-text {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .upload-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        #fileInput {
            display: none;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(13, 17, 23, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        .loading-text {
            color: var(--text-muted);
        }

        .error-message {
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            margin: 1rem 0;
            color: var(--accent);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: var(--bg);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .thumbnail-nav {
            position: fixed;
            left: 0;
            top: 60px;
            bottom: 0;
            width: 180px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 1rem;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 50;
        }

        .thumbnail-nav.open {
            transform: translateX(0);
        }

        .thumbnail-nav h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .thumbnail-item {
            margin-bottom: 0.75rem;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .thumbnail-item:hover {
            border-color: var(--border);
        }

        .thumbnail-item.active {
            border-color: var(--accent);
        }

        .thumbnail-item canvas {
            width: 100%;
            display: block;
            background: white;
        }

        .thumbnail-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-align: center;
            padding: 0.25rem;
        }

        @media (max-width: 700px) {
            .toolbar {
                padding: 0.5rem 1rem;
            }
            .viewer-area {
                padding: 1rem;
            }
            .file-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="upload-overlay" id="uploadOverlay">
        <div class="upload-box" id="uploadBox">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
            <h2 class="upload-title">Open a PDF File</h2>
            <p class="upload-text">Select a PDF to view or drag and drop here</p>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                Choose File
            </button>
            <p class="upload-hint">PDF files only, max 50MB</p>
        </div>
        <input type="file" id="fileInput" accept="application/pdf">
    </div>

    <div class="loading-overlay hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <p class="loading-text">Loading PDF...</p>
    </div>

    <div class="toolbar" id="toolbar" style="display: none;">
        <div class="toolbar-section">
            <button class="btn btn-icon" id="thumbnailsBtn" title="Toggle thumbnails">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/>
                    <rect x="14" y="3" width="7" height="7"/>
                    <rect x="3" y="14" width="7" height="7"/>
                    <rect x="14" y="14" width="7" height="7"/>
                </svg>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section">
            <button class="btn btn-icon" id="prevBtn" title="Previous page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <div class="page-info">
                <input type="number" class="page-input" id="pageInput" min="1" value="1">
                <span>/</span>
                <span id="totalPages">0</span>
            </div>
            <button class="btn btn-icon" id="nextBtn" title="Next page">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-section zoom-controls">
            <button class="btn btn-icon" id="zoomOutBtn" title="Zoom out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
            </button>
            <select class="zoom-select" id="zoomSelect">
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1" selected>100%</option>
                <option value="1.25">125%</option>
                <option value="1.5">150%</option>
                <option value="2">200%</option>
                <option value="fit-page">Fit Page</option>
            </select>
            <button class="btn btn-icon" id="zoomInBtn" title="Zoom in">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    <line x1="11" y1="8" x2="11" y2="14"/>
                    <line x1="8" y1="11" x2="14" y2="11"/>
                </svg>
            </button>
        </div>
        <div class="toolbar-divider"></div>
        <button class="btn btn-icon" id="rotateBtn" title="Rotate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"/>
                <path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
            </svg>
        </button>
        <button class="btn btn-icon" id="downloadBtn" title="Download">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
        </button>
        <span class="file-info" id="fileName"></span>
    </div>

    <div class="thumbnail-nav" id="thumbnailNav">
        <h3>Pages</h3>
        <div id="thumbnailList"></div>
    </div>

    <div class="main-content">
        <div class="viewer-area" id="viewerArea">
            <canvas class="pdf-canvas" id="pdfCanvas"></canvas>
        </div>
    </div>

    <div class="toast" id="toast">PDF loaded successfully!</div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const uploadOverlay = document.getElementById('uploadOverlay');
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const toolbar = document.getElementById('toolbar');
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const viewerArea = document.getElementById('viewerArea');
        const toast = document.getElementById('toast');
        const thumbnailNav = document.getElementById('thumbnailNav');
        const thumbnailList = document.getElementById('thumbnailList');

        let pdfDoc = null;
        let currentPage = 1;
        let currentScale = 1;
        let currentRotation = 0;
        let pdfData = null;

        uploadBox.addEventListener('click', () => fileInput.click());

        uploadBox.addEventListener('dragover', e => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', e => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                loadPDF(file);
            }
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) {
                loadPDF(e.target.files[0]);
            }
        });

        document.getElementById('thumbnailsBtn').addEventListener('click', () => {
            thumbnailNav.classList.toggle('open');
        });

        document.getElementById('prevBtn').addEventListener('click', goToPrevPage);
        document.getElementById('nextBtn').addEventListener('click', goToNextPage);
        document.getElementById('zoomInBtn').addEventListener('click', () => changeZoom(0.25));
        document.getElementById('zoomOutBtn').addEventListener('click', () => changeZoom(-0.25));
        document.getElementById('rotateBtn').addEventListener('click', rotatePage);
        document.getElementById('downloadBtn').addEventListener('click', downloadPDF);

        document.getElementById('zoomSelect').addEventListener('change', e => {
            if (e.target.value === 'fit-page') {
                fitToPage();
            } else {
                currentScale = parseFloat(e.target.value);
                renderPage(currentPage);
            }
        });

        document.getElementById('pageInput').addEventListener('change', e => {
            const page = parseInt(e.target.value);
            if (page >= 1 && page <= pdfDoc.numPages) {
                currentPage = page;
                renderPage(currentPage);
                updateActiveThumbnail();
            }
        });

        function loadPDF(file) {
            if (file.size > 50 * 1024 * 1024) {
                showToast('File too large (max 50MB)');
                return;
            }

            loadingOverlay.classList.remove('hidden');
            pdfData = file;

            const reader = new FileReader();
            reader.onload = async e => {
                try {
                    const loadingTask = pdfjsLib.getDocument({ data: e.target.result });
                    pdfDoc = await loadingTask.promise;

                    document.getElementById('totalPages').textContent = pdfDoc.numPages;
                    document.getElementById('fileName').textContent = file.name;

                    uploadOverlay.classList.add('hidden');
                    toolbar.style.display = 'flex';

                    await generateThumbnails();
                    await renderPage(1);

                    loadingOverlay.classList.add('hidden');
                    showToast(`Loaded ${pdfDoc.numPages} pages`);
                } catch (err) {
                    loadingOverlay.classList.add('hidden');
                    showToast('Error loading PDF: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function generateThumbnails() {
            thumbnailList.innerHTML = '';
            for (let i = 1; i <= pdfDoc.numPages; i++) {
                const page = await pdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 0.2 });

                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const pageCanvas = await page.render({
                    canvasContext: canvas.getContext('2d'),
                    viewport: viewport
                }).promise;

                const item = document.createElement('div');
                item.className = 'thumbnail-item' + (i === 1 ? ' active' : '');
                item.innerHTML = `<canvas width="${viewport.width}" height="${viewport.height}"></canvas><div class="thumbnail-label">Page ${i}</div>`;

                const thumbCtx = item.querySelector('canvas').getContext('2d');
                thumbCtx.drawImage(canvas, 0, 0);

                item.addEventListener('click', () => {
                    currentPage = i;
                    document.getElementById('pageInput').value = i;
                    renderPage(i);
                    updateActiveThumbnail();
                });

                thumbnailList.appendChild(item);
            }
        }

        function updateActiveThumbnail() {
            document.querySelectorAll('.thumbnail-item').forEach((item, idx) => {
                item.classList.toggle('active', idx + 1 === currentPage);
            });
        }

        async function renderPage(pageNum) {
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: currentScale, rotation: currentRotation });

            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({
                canvasContext: ctx,
                viewport: viewport
            }).promise;
        }

        function goToPrevPage() {
            if (currentPage > 1) {
                currentPage--;
                document.getElementById('pageInput').value = currentPage;
                renderPage(currentPage);
                updateActiveThumbnail();
            }
        }

        function goToNextPage() {
            if (currentPage < pdfDoc.numPages) {
                currentPage++;
                document.getElementById('pageInput').value = currentPage;
                renderPage(currentPage);
                updateActiveThumbnail();
            }
        }

        function changeZoom(delta) {
            const newScale = Math.max(0.25, Math.min(4, currentScale + delta));
            currentScale = newScale;
            document.getElementById('zoomSelect').value = newScale;
            renderPage(currentPage);
        }

        function fitToPage() {
            if (!pdfDoc) return;
            pdfDoc.getPage(currentPage).then(page => {
                const viewport = page.getViewport({ scale: 1 });
                const containerWidth = viewerArea.clientWidth - 64;
                const containerHeight = viewerArea.clientHeight - 64;
                currentScale = Math.min(containerWidth / viewport.width, containerHeight / viewport.height);
                document.getElementById('zoomSelect').value = currentScale.toFixed(2);
                renderPage(currentPage);
            });
        }

        function rotatePage() {
            currentRotation = (currentRotation + 90) % 360;
            renderPage(currentPage);
        }

        function downloadPDF() {
            if (pdfData) {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(pdfData);
                link.download = pdfData.name;
                link.click();
            }
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') goToPrevPage();
            if (e.key === 'ArrowRight' || e.key === 'PageDown') goToNextPage();
            if (e.key === '+' || e.key === '=') changeZoom(0.25);
            if (e.key === '-') changeZoom(-0.25);
            if (e.key === 'Home') { currentPage = 1; renderPage(1); }
            if (e.key === 'End' && pdfDoc) { currentPage = pdfDoc.numPages; renderPage(currentPage); }
        });

        window.addEventListener('resize', () => {
            if (document.getElementById('zoomSelect').value === 'fit-page') {
                fitToPage();
            }
        });
    </script>
</body>
</html>
