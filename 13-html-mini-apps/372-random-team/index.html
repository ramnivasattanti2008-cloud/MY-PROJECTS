<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Team Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            color: #fff;
        }

        .container {
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-header label {
            font-weight: 600;
        }

        .team-count-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-count-control button {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .team-count-control button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .team-count-control span {
            font-size: 1.2rem;
            min-width: 30px;
        }

        .name-input-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .name-input-container input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input-container input:focus {
            border-color: #38ef7d;
        }

        .name-input-container input::placeholder {
            color: #555;
        }

        .btn-add {
            padding: 12px 25px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 10px;
            color: #0f0f1a;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56, 239, 125, 0.3);
        }

        .name-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 50px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .name-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .name-tag .remove {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .name-tag .remove:hover {
            background: #eb3349;
        }

        .no-names {
            color: #555;
            font-style: italic;
            width: 100%;
        }

        .btn-generate {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-generate:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .shuffling {
            animation: pulse 0.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .results {
            margin-top: 30px;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            animation: fadeSlideIn 0.5s ease-out;
            animation-fill-mode: both;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .team-card h3 {
            color: #38ef7d;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .team-card ul {
            list-style: none;
            text-align: left;
        }

        .team-card li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeSlideIn 0.3s ease-out;
            animation-fill-mode: both;
        }

        .team-card li:last-child {
            border-bottom: none;
        }

        .btn-export {
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-export:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 500px) {
            h1 { font-size: 1.8rem; }
            .input-header { flex-direction: column; gap: 15px; }
            .name-input-container { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Random Team Generator</h1>
        <p class="subtitle">Enter names, set team count, and generate random groups</p>

        <div class="input-section">
            <div class="input-header">
                <label>Participants</label>
                <div class="team-count-control">
                    <label style="font-size: 0.9rem; color: #888;">Teams:</label>
                    <button onclick="changeTeamCount(-1)">-</button>
                    <span id="teamCount">3</span>
                    <button onclick="changeTeamCount(1)">+</button>
                </div>
            </div>

            <div class="name-input-container">
                <input type="text" id="nameInput" placeholder="Enter a name..." onkeypress="handleKeyPress(event)">
                <button class="btn-add" onclick="addName()">Add</button>
            </div>

            <div class="name-tags" id="nameTags">
                <span class="no-names">No participants added yet</span>
            </div>
        </div>

        <button class="btn-generate" id="generateBtn" onclick="generateTeams()" disabled>
            Generate Teams
        </button>

        <div class="results" id="results"></div>
    </div>

    <script>
        let names = [];
        let teamCount = 3;

        const nameInput = document.getElementById('nameInput');
        const nameTags = document.getElementById('nameTags');
        const generateBtn = document.getElementById('generateBtn');
        const teamCountEl = document.getElementById('teamCount');

        function addName() {
            const name = nameInput.value.trim();
            if (name && !names.includes(name)) {
                names.push(name);
                renderNames();
                nameInput.value = '';
                nameInput.focus();
            }
        }

        function removeName(index) {
            names.splice(index, 1);
            renderNames();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addName();
            }
        }

        function renderNames() {
            if (names.length === 0) {
                nameTags.innerHTML = '<span class="no-names">No participants added yet</span>';
                generateBtn.disabled = true;
            } else {
                nameTags.innerHTML = names.map((name, i) => `
                    <span class="name-tag">
                        ${escapeHtml(name)}
                        <button class="remove" onclick="removeName(${i})">&times;</button>
                    </span>
                `).join('');
                generateBtn.disabled = false;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function changeTeamCount(delta) {
            teamCount = Math.max(1, Math.min(names.length, teamCount + delta));
            teamCountEl.textContent = teamCount;
        }

        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        async function generateTeams() {
            if (names.length < 2) return;

            const btn = generateBtn;
            btn.classList.add('shuffling');
            btn.textContent = 'Shuffling...';
            btn.disabled = true;

            // Animation delay
            await new Promise(r => setTimeout(r, 1500));

            const shuffled = shuffle(names);
            const teams = [];

            // Distribute names to teams
            for (let i = 0; i < teamCount; i++) {
                teams.push([]);
            }

            shuffled.forEach((name, i) => {
                teams[i % teamCount].push(name);
            });

            btn.classList.remove('shuffling');
            btn.textContent = 'Generate Teams';
            btn.disabled = false;

            renderTeams(teams);
        }

        function renderTeams(teams) {
            const results = document.getElementById('results');
            const teamColors = ['#667eea', '#11998e', '#f5576c', '#f093fb', '#38ef7d', '#eb3349'];

            results.innerHTML = `
                <h2 style="margin-bottom: 20px; color: #38ef7d;">Generated Teams</h2>
                <div class="teams-grid">
                    ${teams.map((team, i) => `
                        <div class="team-card" style="animation-delay: ${i * 0.1}s; border-top: 3px solid ${teamColors[i % teamColors.length]};">
                            <h3>Team ${i + 1} (${team.length} ${team.length === 1 ? 'member' : 'members'})</h3>
                            <ul>
                                ${team.map((name, j) => `<li style="animation-delay: ${(i * 0.1) + (j * 0.05)}s">${escapeHtml(name)}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('')}
                </div>
                <button class="btn-export" onclick="exportResults()">Export Results</button>
            `;

            results.teamData = teams; // Store for export
        }

        function exportResults() {
            const teams = document.getElementById('results').teamData;
            if (!teams) return;

            let content = 'RANDOM TEAM GENERATOR RESULTS\n';
            content += 'Generated on: ' + new Date().toLocaleString() + '\n\n';

            teams.forEach((team, i) => {
                content += `Team ${i + 1}:\n`;
                team.forEach(name => content += `  - ${name}\n`);
                content += '\n';
            });

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'teams.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Allow paste multiple names (one per line)
        nameInput.addEventListener('paste', (e) => {
            setTimeout(() => {
                const pasted = nameInput.value.split(/[\n,]/).filter(n => n.trim());
                if (pasted.length > 1) {
                    e.preventDefault();
                    pasted.forEach(name => {
                        const trimmed = name.trim();
                        if (trimmed && !names.includes(trimmed)) {
                            names.push(trimmed);
                        }
                    });
                    nameInput.value = '';
                    renderNames();
                }
            }, 0);
        });
    </script>
</body>
</html>
