<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Picker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d0d0d; --card: #1a1a1a; --border: #2a2a2a;
            --text: #e0e0e0; --text-dim: #888; --accent: #6366f1;
            --success: #22c55e; --warning: #f59e0b;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 700px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0 20px; }
        h1 { font-size: 2rem; margin-bottom: 8px; background: linear-gradient(135deg, #f472b6, #fb923c, #facc15); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-dim); }
        .wheel-section { position: relative; margin: 30px 0; display: flex; flex-direction: column; align-items: center; }
        .wheel-container { position: relative; width: 320px; height: 320px; }
        @media (min-width: 500px) { .wheel-container { width: 400px; height: 400px; } }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); box-shadow: 0 0 40px rgba(99, 102, 241, 0.3), inset 0 0 20px rgba(0,0,0,0.3); }
        .wheel-segment { position: absolute; width: 50%; height: 50%; left: 50%; top: 0; transform-origin: 0% 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .wheel-segment-inner { position: absolute; left: 0; width: 200%; height: 200%; transform: rotate(18deg) skewY(-70deg); display: flex; align-items: center; justify-content: center; }
        .wheel-segment:nth-child(odd) .wheel-segment-inner { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
        .wheel-segment:nth-child(even) .wheel-segment-inner { background: linear-gradient(135deg, #7c3aed, #db2777); }
        .wheel-text { position: absolute; left: 15%; top: 30%; transform: rotate(72deg); font-weight: 700; font-size: 0.75rem; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); white-space: nowrap; text-overflow: ellipsis; max-width: 80px; overflow: hidden; }
        .wheel-center { position: absolute; width: 60px; height: 60px; background: var(--card); border: 4px solid var(--accent); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .wheel-center span { font-size: 1.5rem; }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--accent); z-index: 5; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)); }
        .spinning .wheel { animation: pulse 0.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.3); } 50% { box-shadow: 0 0 60px rgba(99, 102, 241, 0.6); } }
        .winner-display { text-align: center; margin: 20px 0; padding: 20px; background: var(--card); border-radius: 16px; border: 2px solid var(--accent); display: none; }
        .winner-display.show { display: block; animation: popIn 0.5s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .winner-display h2 { color: var(--success); margin-bottom: 8px; }
        .winner-name { font-size: 2rem; font-weight: 700; color: var(--accent); }
        .input-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin: 20px 0; }
        .input-section h2 { margin-bottom: 16px; font-size: 1.2rem; }
        .input-section textarea { width: 100%; min-height: 150px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 1rem; resize: vertical; font-family: inherit; }
        .input-section textarea:focus { outline: none; border-color: var(--accent); }
        .input-section textarea::placeholder { color: var(--text-dim); }
        .btn-row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
        .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; flex: 1; }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-secondary:hover { background: #333; }
        .btn-danger { background: #dc2626; color: #fff; }
        .btn-danger:hover { opacity: 0.9; }
        .history-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin: 20px 0; }
        .history-section h2 { margin-bottom: 16px; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .history-list { max-height: 300px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; }
        .history-item .rank { font-weight: 700; color: var(--accent); min-width: 40px; }
        .history-item .name { flex: 1; }
        .history-item .time { color: var(--text-dim); font-size: 0.8rem; }
        .history-item .remove-btn { padding: 4px 8px; border: none; border-radius: 4px; background: transparent; color: var(--text-dim); cursor: pointer; }
        .history-item .remove-btn:hover { color: #dc2626; }
        .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1000; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: #000; padding: 12px 24px; border-radius: 8px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 1001; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-dim); }
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .wheel-container { width: 280px; height: 280px; }
            .btn { padding: 10px 16px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Random Picker</h1>
            <p class="subtitle">Spin the wheel or pick a random winner</p>
        </header>
        <div class="wheel-section">
            <div class="wheel-pointer"></div>
            <div class="wheel-container">
                <div class="wheel" id="wheel"></div>
                <div class="wheel-center"><span>🎯</span></div>
            </div>
        </div>
        <div class="winner-display" id="winnerDisplay">
            <h2>Winner!</h2>
            <div class="winner-name" id="winnerName"></div>
        </div>
        <div class="input-section">
            <h2>Enter Names/Options</h2>
            <textarea id="entries" placeholder="Enter each name or option on a new line...&#10;&#10;Example:&#10;John&#10;Sarah&#10;Mike&#10;Emma"></textarea>
            <div class="btn-row">
                <button class="btn btn-primary" id="spinBtn" disabled>Spin the Wheel</button>
                <button class="btn btn-secondary" id="pickBtn" disabled>Pick Random</button>
            </div>
            <div class="btn-row">
                <button class="btn btn-danger" id="clearBtn">Clear All</button>
                <button class="btn btn-secondary" id="shuffleBtn">Shuffle List</button>
            </div>
        </div>
        <div class="history-section">
            <h2>
                Pick History
                <button class="btn btn-secondary" style="padding:6px 12px;font-size:0.8rem" id="exportBtn">Export</button>
            </h2>
            <div class="history-list" id="historyList">
                <div class="empty-state">No picks yet</div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast">Copied!</div>
    <script>
        let entries = [];
        let history = [];
        let isSpinning = false;
        let currentRotation = 0;
        const wheel = document.getElementById('wheel');
        const entriesInput = document.getElementById('entries');
        const spinBtn = document.getElementById('spinBtn');
        const pickBtn = document.getElementById('pickBtn');
        const clearBtn = document.getElementById('clearBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const exportBtn = document.getElementById('exportBtn');
        const winnerDisplay = document.getElementById('winnerDisplay');
        const winnerName = document.getElementById('winnerName');
        const historyList = document.getElementById('historyList');
        const colors = ['#4f46e5', '#7c3aed', '#db2777', '#ec4899', '#f43f5e', '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', '#22c55e', '#10b981', '#14b8a6', '#06b6d4', '#0ea5e9', '#3b82f6'];
        function getEntries() {
            return entriesInput.value.split('\n').map(e => e.trim()).filter(e => e.length > 0);
        }
        function updateWheel() {
            entries = getEntries();
            spinBtn.disabled = entries.length < 2;
            pickBtn.disabled = entries.length < 1;
            if (entries.length < 2) {
                wheel.innerHTML = '<div class="wheel-segment" style="width:100%;height:100%;left:0;top:0;transform:none;"><div class="wheel-segment-inner" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);width:100%;height:100%;transform:none;border-radius:50%;"><span style="color:#fff;font-size:1rem;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">Add 2+ entries</span></div></div>';
                return;
            }
            wheel.innerHTML = '';
            const segmentAngle = 360 / entries.length;
            entries.forEach((entry, i) => {
                const segment = document.createElement('div');
                segment.className = 'wheel-segment';
                segment.style.transform = `rotate(${i * segmentAngle}deg) skewY(-${90 - segmentAngle}deg)`;
                segment.innerHTML = `<div class="wheel-segment-inner" style="background:${colors[i % colors.length]};transform:skewY(${90 - segmentAngle}deg);"><span class="wheel-text">${entry}</span></div>`;
                wheel.appendChild(segment);
            });
        }
        function showWinner(name, useAnimation = false) {
            winnerName.textContent = name;
            winnerDisplay.classList.add('show');
            if (useAnimation) createConfetti();
            const timestamp = new Date().toLocaleTimeString();
            history.unshift({ name, time: timestamp, id: Date.now() });
            renderHistory();
        }
        function createConfetti() {
            const canvas = document.createElement('canvas');
            canvas.className = 'confetti';
            document.body.appendChild(canvas);
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const particles = [];
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: -20 - Math.random() * 100,
                    vx: (Math.random() - 0.5) * 8,
                    vy: Math.random() * 5 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 10
                });
            }
            let frame = 0;
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.1;
                    p.rotation += p.rotationSpeed;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });
                frame++;
                if (frame < 180) requestAnimationFrame(animate);
                else { document.body.removeChild(canvas); }
            }
            animate();
        }
        function spinWheel() {
            if (isSpinning || entries.length < 2) return;
            isSpinning = true;
            spinBtn.disabled = true;
            pickBtn.disabled = true;
            winnerDisplay.classList.remove('show');
            const randomAngle = Math.random() * 360 + 1440;
            currentRotation += randomAngle;
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            setTimeout(() => {
                const segmentAngle = 360 / entries.length;
                const pointerAngle = 270;
                const effectiveAngle = (currentRotation % 360 + pointerAngle) % 360;
                const winnerIndex = Math.floor((360 - effectiveAngle + segmentAngle / 2) / segmentAngle) % entries.length;
                isSpinning = false;
                spinBtn.disabled = false;
                pickBtn.disabled = false;
                showWinner(entries[winnerIndex], true);
            }, 4000);
        }
        function pickRandom() {
            if (entries.length === 0) return;
            const winner = entries[Math.floor(Math.random() * entries.length)];
            showWinner(winner, true);
        }
        function renderHistory() {
            if (history.length === 0) {
                historyList.innerHTML = '<div class="empty-state">No picks yet</div>';
                return;
            }
            historyList.innerHTML = history.map((h, i) => `
                <div class="history-item" data-id="${h.id}">
                    <span class="rank">#${i + 1}</span>
                    <span class="name">${h.name}</span>
                    <span class="time">${h.time}</span>
                    <button class="remove-btn" onclick="removeHistoryItem(${h.id})">×</button>
                </div>
            `).join('');
        }
        function removeHistoryItem(id) {
            history = history.filter(h => h.id !== id);
            renderHistory();
        }
        function exportHistory() {
            if (history.length === 0) return;
            const text = history.map((h, i) => `${i + 1}. ${h.name} (${h.time})`).join('\n');
            navigator.clipboard.writeText(text).then(() => showToast('History copied to clipboard!'));
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        entriesInput.addEventListener('input', updateWheel);
        spinBtn.addEventListener('click', spinWheel);
        pickBtn.addEventListener('click', pickRandom);
        clearBtn.addEventListener('click', () => {
            entriesInput.value = '';
            updateWheel();
            winnerDisplay.classList.remove('show');
        });
        shuffleBtn.addEventListener('click', () => {
            entries = getEntries();
            if (entries.length > 1) {
                for (let i = entries.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [entries[i], entries[j]] = [entries[j], entries[i]];
                }
                entriesInput.value = entries.join('\n');
                updateWheel();
                showToast('List shuffled!');
            }
        });
        exportBtn.addEventListener('click', exportHistory);
        updateWheel();
    </script>
</body>
</html>
