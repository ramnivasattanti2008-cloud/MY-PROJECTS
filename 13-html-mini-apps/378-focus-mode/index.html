<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            min-height: 100vh;
            transition: background 1s ease;
            overflow: hidden;
        }

        body.theme-midnight {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
        }

        body.theme-forest {
            background: linear-gradient(135deg, #0a2f1f, #1a4d3a, #0d3b28);
            color: #c8e6c9;
        }

        body.theme-ocean {
            background: linear-gradient(135deg, #0a1628, #1a3a5c, #0d2137);
            color: #90caf9;
        }

        body.theme-sunset {
            background: linear-gradient(135deg, #2d1b3d, #5c3d6e, #3d1f4a);
            color: #f3e5f5;
        }

        body.theme-fire {
            background: linear-gradient(135deg, #1a0a0a, #3d1a1a, #2a0f0f);
            color: #ffcdd2;
        }

        .focus-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .toolbar,
        .toolbar:hover {
            opacity: 1;
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .word-count {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .word-count span {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .tool-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.7);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Segoe UI', system-ui, sans-serif;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .tool-btn.active {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .editor-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .editor {
            width: 100%;
            max-width: 700px;
            min-height: 400px;
            background: transparent;
            border: none;
            outline: none;
            color: inherit;
            font-size: 1.3rem;
            line-height: 1.8;
            resize: none;
            font-family: inherit;
        }

        .editor::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .editor.typewriter .cursor-line {
            position: relative;
        }

        .typewriter .editor {
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Segoe UI', system-ui, sans-serif;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .status-bar,
        .status-bar:hover {
            opacity: 1;
        }

        .theme-selector {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .theme-selector {
            opacity: 1;
        }

        .theme-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .theme-btn:hover {
            transform: scale(1.2);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .theme-btn.active {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .theme-midnight { background: linear-gradient(135deg, #0f0c29, #302b63); }
        .theme-forest { background: linear-gradient(135deg, #0a2f1f, #1a4d3a); }
        .theme-ocean { background: linear-gradient(135deg, #0a1628, #1a3a5c); }
        .theme-sunset { background: linear-gradient(135deg, #2d1b3d, #5c3d6e); }
        .theme-fire { background: linear-gradient(135deg, #1a0a0a, #3d1a1a); }

        .fullscreen-btn {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.6);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            opacity: 0;
        }

        body:hover .fullscreen-btn {
            opacity: 1;
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .focus-hint {
            position: fixed;
            bottom: 50%;
            left: 50%;
            transform: translate(-50%, 50%);
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.9rem;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        body:has(.editor:not(:placeholder-shown)) .focus-hint {
            opacity: 0;
        }

        .floating-actions {
            position: fixed;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        body:hover .floating-actions {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .focus-container {
                padding: 1rem;
            }

            .editor {
                font-size: 1.1rem;
                min-height: 300px;
            }

            .toolbar {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .theme-selector {
                bottom: 1rem;
                right: 1rem;
            }

            .fullscreen-btn {
                bottom: 1rem;
                left: 1rem;
            }
        }
    </style>
</head>
<body class="theme-midnight">
    <div class="floating-actions">
        <button class="tool-btn" onclick="saveDocument()" title="Save to localStorage">
            💾 Save
        </button>
        <button class="tool-btn" onclick="clearDocument()" title="Clear editor">
            🗑️ Clear
        </button>
    </div>

    <div class="focus-container">
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="word-count">
                    <span id="wordCount">0</span> words · <span id="charCount">0</span> characters
                </div>
                <div class="word-count" id="readingTime"></div>
            </div>
            <div class="toolbar-right">
                <button class="tool-btn" id="typewriterBtn" onclick="toggleTypewriter()">
                    ⌨️ Typewriter
                </button>
                <button class="tool-btn" id="zenBtn" onclick="toggleZenMode()">
                    🧘 Zen Mode
                </button>
            </div>
        </div>

        <div class="editor-wrapper">
            <textarea
                class="editor"
                id="editor"
                placeholder="Start writing... Let your thoughts flow freely."
                spellcheck="false"
            ></textarea>
        </div>

        <div class="status-bar">
            <div id="saveStatus">Ready</div>
            <div id="timeDisplay"></div>
        </div>
    </div>

    <p class="focus-hint">Move your mouse to reveal controls</p>

    <div class="theme-selector">
        <button class="theme-btn theme-midnight active" onclick="setTheme('midnight')" title="Midnight"></button>
        <button class="theme-btn theme-forest" onclick="setTheme('forest')" title="Forest"></button>
        <button class="theme-btn theme-ocean" onclick="setTheme('ocean')" title="Ocean"></button>
        <button class="theme-btn theme-sunset" onclick="setTheme('sunset')" title="Sunset"></button>
        <button class="theme-btn theme-fire" onclick="setTheme('fire')" title="Fire"></button>
    </div>

    <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen">
        ⛶
    </button>

    <script>
        const editor = document.getElementById('editor');
        let isTypewriterMode = false;
        let isZenMode = false;
        let saveTimeout = null;

        function updateCounts() {
            const text = editor.value;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            const readingTime = Math.ceil(words / 200);

            document.getElementById('wordCount').textContent = words;
            document.getElementById('charCount').textContent = chars;
            document.getElementById('readingTime').textContent =
                words > 0 ? `~${readingTime} min read` : '';
        }

        function saveDocument() {
            const content = editor.value;
            const timestamp = new Date().toISOString();
            const docs = JSON.parse(localStorage.getItem('focusDocs') || '[]');

            docs.unshift({ content, timestamp });
            if (docs.length > 10) docs.pop();

            localStorage.setItem('focusDocs', JSON.stringify(docs));
            localStorage.setItem('focusLastContent', content);

            document.getElementById('saveStatus').textContent = 'Saved!';
            setTimeout(() => {
                document.getElementById('saveStatus').textContent = 'Auto-saved';
            }, 2000);
        }

        function loadDocument() {
            const lastContent = localStorage.getItem('focusLastContent');
            if (lastContent) {
                editor.value = lastContent;
                updateCounts();
            }
        }

        function clearDocument() {
            if (editor.value && confirm('Clear all content? This cannot be undone.')) {
                editor.value = '';
                updateCounts();
                saveDocument();
            }
        }

        function toggleTypewriter() {
            isTypewriterMode = !isTypewriterMode;
            document.body.classList.toggle('typewriter', isTypewriterMode);
            document.getElementById('typewriterBtn').classList.toggle('active', isTypewriterMode);

            if (isTypewriterMode) {
                editor.style.paddingTop = '40vh';
            } else {
                editor.style.paddingTop = '0';
            }
        }

        function toggleZenMode() {
            isZenMode = !isZenMode;
            document.querySelector('.toolbar').style.opacity = isZenMode ? '0' : '';
            document.querySelector('.status-bar').style.opacity = isZenMode ? '0' : '';
            document.querySelector('.theme-selector').style.opacity = isZenMode ? '0' : '';
            document.querySelector('.fullscreen-btn').style.opacity = isZenMode ? '0' : '';
            document.querySelector('.floating-actions').style.opacity = isZenMode ? '0' : '';
            document.querySelector('.focus-hint').style.display = isZenMode ? 'none' : '';
            document.getElementById('zenBtn').classList.toggle('active', isZenMode);

            if (isZenMode) {
                document.body.style.cursor = 'none';
            } else {
                document.body.style.cursor = '';
            }
        }

        function setTheme(theme) {
            document.body.className = `theme-${theme}`;
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.classList.contains(`theme-${theme}`));
            });
            localStorage.setItem('focusTheme', theme);
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('focusTheme');
            if (savedTheme) {
                setTheme(savedTheme);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function updateTime() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit' };
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('en-US', options);
        }

        // Event listeners
        editor.addEventListener('input', () => {
            updateCounts();

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveDocument, 1500);
        });

        document.addEventListener('mousemove', (e) => {
            if (isZenMode) {
                document.body.style.cursor = '';
                setTimeout(() => {
                    if (!e.buttons) document.body.style.cursor = 'none';
                }, 1000);
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveDocument();
            }
            if (e.key === 'Escape' && isZenMode) {
                toggleZenMode();
            }
        });

        // Initialize
        loadTheme();
        loadDocument();
        updateTime();
        setInterval(updateTime, 1000);

        // Focus editor on load
        setTimeout(() => editor.focus(), 100);
    </script>
</body>
</html>
