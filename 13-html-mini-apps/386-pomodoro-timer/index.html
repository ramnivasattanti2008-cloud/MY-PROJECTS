<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #8892b0;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .timer-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 2rem;
        }

        .timer-circle {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .timer-circle svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .timer-circle .bg-circle {
            fill: none;
            stroke: #233554;
            stroke-width: 8;
        }

        .timer-circle .progress-circle {
            fill: none;
            stroke: url(#gradient);
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .timer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .time {
            font-size: 4rem;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .session-type {
            font-size: 1rem;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 0.5rem;
        }

        .mode-selector {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .mode-btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid #233554;
            background: transparent;
            color: #8892b0;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .mode-btn:hover {
            border-color: #e94560;
            color: #e94560;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: #fff;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(233, 69, 96, 0.5);
        }

        .btn-secondary {
            background: #233554;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #2d4a6f;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .stat-card {
            background: rgba(35, 53, 84, 0.5);
            padding: 1rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #e94560;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(233, 69, 96, 0.5);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 480px) {
            .timer-wrapper {
                width: 260px;
                height: 260px;
            }

            .time {
                font-size: 3rem;
            }

            .mode-selector {
                flex-direction: column;
                gap: 0.5rem;
            }

            .controls {
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="notification" id="notification">Time's up!</div>

    <div class="container">
        <h1>Pomodoro Timer</h1>
        <p class="subtitle">Focus. Work. Achieve.</p>

        <div class="mode-selector">
            <button class="mode-btn active" data-mode="work" onclick="setMode('work')">Work (25m)</button>
            <button class="mode-btn" data-mode="short" onclick="setMode('short')">Short (5m)</button>
            <button class="mode-btn" data-mode="long" onclick="setMode('long')">Long (15m)</button>
        </div>

        <div class="timer-wrapper">
            <div class="timer-circle">
                <svg viewBox="0 0 320 320">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#e94560"/>
                            <stop offset="100%" stop-color="#ff6b6b"/>
                        </linearGradient>
                    </defs>
                    <circle class="bg-circle" cx="160" cy="160" r="150"/>
                    <circle class="progress-circle" cx="160" cy="160" r="150"
                            stroke-dasharray="942.48" stroke-dashoffset="0" id="progress"/>
                </svg>
            </div>
            <div class="timer-display">
                <div class="time" id="time">25:00</div>
                <div class="session-type" id="sessionType">Work Session</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" id="startBtn" onclick="toggleTimer()">
                <span id="startIcon">▶</span>
                <span id="startText">Start</span>
            </button>
            <button class="btn btn-secondary" onclick="resetTimer()">
                ↺ Reset
            </button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="sessions">0</div>
                <div class="stat-label">Sessions</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalMinutes">0</div>
                <div class="stat-label">Minutes</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="streak">0</div>
                <div class="stat-label">Streak</div>
            </div>
        </div>
    </div>

    <script>
        const modes = {
            work: { duration: 25 * 60, label: 'Work Session' },
            short: { duration: 5 * 60, label: 'Short Break' },
            long: { duration: 15 * 60, label: 'Long Break' }
        };

        let currentMode = 'work';
        let timeRemaining = modes.work.duration;
        let isRunning = false;
        let interval = null;
        let sessions = 0;
        let totalMinutes = 0;
        let streak = parseInt(localStorage.getItem('pomodoroStreak')) || 0;
        let lastDate = localStorage.getItem('pomodoroLastDate') || null;

        const circumference = 2 * Math.PI * 150;

        function updateDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('time').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const progress = timeRemaining / modes[currentMode].duration;
            document.getElementById('progress').style.strokeDashoffset =
                circumference * (1 - progress);

            document.getElementById('sessionType').textContent = modes[currentMode].label;
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(interval);
                isRunning = false;
                document.getElementById('startIcon').textContent = '▶';
                document.getElementById('startText').textContent = 'Resume';
            } else {
                isRunning = true;
                document.getElementById('startIcon').textContent = '⏸';
                document.getElementById('startText').textContent = 'Pause';
                interval = setInterval(tick, 1000);
            }
        }

        function tick() {
            timeRemaining--;
            updateDisplay();

            if (timeRemaining <= 0) {
                clearInterval(interval);
                isRunning = false;
                playSound();
                showNotification();

                if (currentMode === 'work') {
                    sessions++;
                    totalMinutes += 25;
                    updateStats();
                    streak++;
                    saveStreak();
                } else {
                    if (streak > 0) streak--;
                }

                setMode('work');
                document.getElementById('startIcon').textContent = '▶';
                document.getElementById('startText').textContent = 'Start';
            }
        }

        function resetTimer() {
            clearInterval(interval);
            isRunning = false;
            timeRemaining = modes[currentMode].duration;
            updateDisplay();
            document.getElementById('startIcon').textContent = '▶';
            document.getElementById('startText').textContent = 'Start';
        }

        function setMode(mode) {
            clearInterval(interval);
            isRunning = false;
            currentMode = mode;
            timeRemaining = modes[mode].duration;
            updateDisplay();

            document.querySelectorAll('.mode-btn').forEach(btn =>
                btn.classList.remove('active'));
            document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

            document.getElementById('startIcon').textContent = '▶';
            document.getElementById('startText').textContent = 'Start';
        }

        function updateStats() {
            document.getElementById('sessions').textContent = sessions;
            document.getElementById('totalMinutes').textContent = totalMinutes;
            document.getElementById('streak').textContent = streak;
        }

        function saveStreak() {
            const today = new Date().toDateString();
            localStorage.setItem('pomodoroStreak', streak);
            localStorage.setItem('pomodoroLastDate', today);
        }

        function checkStreak() {
            const today = new Date().toDateString();
            if (lastDate !== today) {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                if (lastDate !== yesterday.toDateString()) {
                    streak = 0;
                    saveStreak();
                }
            }
            updateStats();
        }

        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);

            setTimeout(() => {
                const osc2 = audioContext.createOscillator();
                osc2.connect(gainNode);
                osc2.frequency.value = 1000;
                osc2.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                osc2.start(audioContext.currentTime);
                osc2.stop(audioContext.currentTime + 0.5);
            }, 200);
        }

        function showNotification() {
            const notif = document.getElementById('notification');
            notif.textContent = currentMode === 'work' ?
                'Session complete! Take a break.' :
                'Break over! Ready to focus?';
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 4000);
        }

        checkStreak();
        updateDisplay();
    </script>
</body>
</html>
