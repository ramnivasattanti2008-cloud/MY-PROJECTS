<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Meter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d12;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #fff;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .input-wrapper {
      position: relative;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      background: #1e1e2a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 16px 50px 16px 18px;
      color: #fff;
      font-size: 16px;
      font-family: monospace;
      letter-spacing: 2px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #6366f1; }
    .toggle-visibility {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 20px;
      padding: 4px;
    }
    .toggle-visibility:hover { color: #fff; }
    .strength-bar {
      height: 6px;
      background: #252530;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      transition: width 0.3s, background 0.3s;
    }
    .strength-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .score-text {
      font-size: 18px;
      font-weight: 600;
    }
    .score-number {
      font-size: 14px;
      color: #888;
    }
    .crack-times {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }
    .crack-card {
      background: #1a1a24;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .crack-label {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .crack-value {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }
    .suggestions {
      background: #1a1a24;
      border-radius: 12px;
      padding: 20px;
    }
    .suggestions h3 {
      font-size: 14px;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      font-size: 14px;
      color: #aaa;
    }
    .suggestion-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .suggestion-icon.good { background: #22c55e33; color: #22c55e; }
    .suggestion-icon.bad { background: #ef444433; color: #ef4444; }
    .criteria {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }
    .criteria-tag {
      background: #252530;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      color: #888;
      transition: all 0.2s;
    }
    .criteria-tag.met {
      background: #22c55e33;
      color: #22c55e;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Password Strength Meter</h1>
    <p class="subtitle">Check password security and get improvement tips</p>

    <div class="input-wrapper">
      <input type="password" id="password" placeholder="Enter your password" autocomplete="off">
      <button class="toggle-visibility" onclick="toggleVisibility()">👁</button>
    </div>

    <div class="strength-bar">
      <div class="strength-fill" id="strengthFill"></div>
    </div>

    <div class="strength-info">
      <span class="score-text" id="scoreText">Enter a password</span>
      <span class="score-number" id="scoreNumber"></span>
    </div>

    <div class="criteria" id="criteria"></div>

    <div class="crack-times">
      <div class="crack-card">
        <div class="crack-label">Online Attack</div>
        <div class="crack-value" id="onlineTime">-</div>
      </div>
      <div class="crack-card">
        <div class="crack-label">Offline Attack</div>
        <div class="crack-value" id="offlineTime">-</div>
      </div>
    </div>

    <div class="suggestions">
      <h3>Suggestions</h3>
      <div id="suggestionsList"></div>
    </div>
  </div>

  <script>
    const criteriaTags = [
      { id: 'length', label: '12+ chars', check: p => p.length >= 12 },
      { id: 'upper', label: 'Uppercase', check: p => /[A-Z]/.test(p) },
      { id: 'lower', label: 'Lowercase', check: p => /[a-z]/.test(p) },
      { id: 'number', label: 'Numbers', check: p => /[0-9]/.test(p) },
      { id: 'symbol', label: 'Symbols', check: p => /[!@#$%^&*(),.?":{}|<>]/.test(p) },
      { id: 'no-common', label: 'No common', check: p => !/^(password|123456|qwerty|admin)/i.test(p) }
    ];

    function initCriteria() {
      const container = document.getElementById('criteria');
      criteriaTags.forEach(c => {
        const tag = document.createElement('span');
        tag.className = 'criteria-tag';
        tag.id = 'tag-' + c.id;
        tag.textContent = c.label;
        container.appendChild(tag);
      });
    }

    function toggleVisibility() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function estimateCrackTime(charsetSize, length) {
      const combinations = Math.pow(charsetSize, length);
      const guessesPerSecond = { online: 0.001, offline: 1e10 };
      const seconds = combinations / (2 * guessesPerSecond.offline);
      return formatTime(seconds);
    }

    function formatTime(seconds) {
      if (seconds < 1) return 'Instant';
      if (seconds < 60) return `${Math.round(seconds)} sec`;
      if (seconds < 3600) return `${Math.round(seconds/60)} min`;
      if (seconds < 86400) return `${Math.round(seconds/3600)} hours`;
      if (seconds < 31536000) return `${Math.round(seconds/86400)} days`;
      if (seconds < 31536000 * 100) return `${Math.round(seconds/31536000)} years`;
      if (seconds < 31536000 * 1000000) return `${(seconds/31536000/1000).toFixed(0)}K years`;
      if (seconds < 31536000 * 1e9) return `${(seconds/31536000/1e6).toFixed(0)}M years`;
      if (seconds < 31536000 * 1e12) return `${(seconds/31536000/1e9).toFixed(0)}B years`;
      return 'Heat death';
    }

    function analyzePassword(password) {
      let score = 0;
      let charsetSize = 0;
      const checks = [];
      const suggestions = [];

      criteriaTags.forEach(c => {
        const met = c.check(password);
        if (met) score++;
        checks.push({ ...c, met });
      });

      if (password.length < 8) {
        suggestions.push('Use at least 8 characters');
        charsetSize = 26;
      } else if (password.length < 12) {
        charsetSize = 26 + (/[A-Z]/.test(password) ? 26 : 0) + (/[0-9]/.test(password) ? 10 : 0) + (/[!@#$%^&*]/.test(password) ? 32 : 0);
      } else {
        const hasUpper = /[A-Z]/.test(password);
        const hasLower = /[a-z]/.test(password);
        const hasNum = /[0-9]/.test(password);
        const hasSym = /[!@#$%^&*(),.?":{}|<>]/.test(password);
        charsetSize = (hasLower ? 26 : 0) + (hasUpper ? 26 : 0) + (hasNum ? 10 : 0) + (hasSym ? 32 : 0);
      }

      if (/^[a-z]+$/i.test(password)) {
        suggestions.push('Add numbers or symbols');
      }
      if (!/[!@#$%^&*(),.?":{}|<>]/.test(password) && password.length > 8) {
        suggestions.push('Add special characters');
      }
      if (/(.)\1{2,}/.test(password)) {
        suggestions.push('Avoid repeated characters');
      }
      if (/^(password|123456|qwerty|admin|letmein)/i.test(password)) {
        suggestions.push('Avoid common passwords');
      }
      if (password.length >= 16 && charsetSize > 50) {
        suggestions.push('Excellent password length');
      }

      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
      const labels = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
      const normalizedScore = Math.min(4, Math.floor(score * 4 / criteriaTags.length));

      return {
        score: normalizedScore,
        color: colors[normalizedScore] || colors[0],
        label: labels[normalizedScore] || labels[0],
        checks,
        suggestions,
        charsetSize: charsetSize || 26,
        length: password.length
      };
    }

    function updateUI(result) {
      const fill = document.getElementById('strengthFill');
      fill.style.width = `${(result.score + 1) * 20}%`;
      fill.style.background = result.color;

      document.getElementById('scoreText').textContent = result.label;
      document.getElementById('scoreText').style.color = result.color;
      document.getElementById('scoreNumber').textContent = `${result.score + 1}/5`;

      result.checks.forEach(c => {
        const tag = document.getElementById('tag-' + c.id);
        if (tag) tag.className = 'criteria-tag' + (c.met ? ' met' : '');
      });

      const onlineTime = result.length > 0 ? estimateCrackTime(10, Math.min(result.length, 10)) : '-';
      const offlineTime = result.length > 0 ? estimateCrackTime(result.charsetSize, result.length) : '-';

      document.getElementById('onlineTime').textContent = onlineTime;
      document.getElementById('offlineTime').textContent = offlineTime;

      const list = document.getElementById('suggestionsList');
      list.innerHTML = '';

      if (result.suggestions.length === 0 && result.score >= 3) {
        list.innerHTML = '<div class="suggestion-item"><span class="suggestion-icon good">✓</span><span>Great password!</span></div>';
      } else {
        result.suggestions.forEach(s => {
          const isPositive = s.includes('Excellent') || s.includes('Great');
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerHTML = `<span class="suggestion-icon ${isPositive ? 'good' : 'bad'}">${isPositive ? '✓' : '!'}</span><span>${s}</span>`;
          list.appendChild(div);
        });
      }
    }

    document.getElementById('password').addEventListener('input', (e) => {
      const pwd = e.target.value;
      if (pwd) {
        updateUI(analyzePassword(pwd));
      } else {
        document.getElementById('strengthFill').style.width = '0%';
        document.getElementById('scoreText').textContent = 'Enter a password';
        document.getElementById('scoreText').style.color = '#888';
        document.getElementById('scoreNumber').textContent = '';
        document.getElementById('onlineTime').textContent = '-';
        document.getElementById('offlineTime').textContent = '-';
        criteriaTags.forEach(c => {
          const tag = document.getElementById('tag-' + c.id);
          if (tag) tag.className = 'criteria-tag';
        });
        document.getElementById('suggestionsList').innerHTML = '';
      }
    });

    initCriteria();
  </script>
</body>
</html>
