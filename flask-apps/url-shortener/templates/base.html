<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}URL Shortener{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        nav {
            background: #16161d;
            border-bottom: 1px solid #27272a;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #22d3ee;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        nav .logo svg {
            width: 28px;
            height: 28px;
        }
        nav .nav-links {
            display: flex;
            gap: 24px;
        }
        nav .nav-links a {
            color: #a1a1aa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav .nav-links a:hover {
            color: #22d3ee;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-size: 14px;
        }
        .btn-primary {
            background: #22d3ee;
            color: #0a0a0f;
        }
        .btn-primary:hover {
            background: #06b6d4;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #27272a;
            color: #e4e4e7;
        }
        .btn-secondary:hover {
            background: #3f3f46;
        }
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        .flash {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .flash.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .flash.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
        }
        .card {
            background: #16161d;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 24px;
        }
        .input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0f;
            border: 1px solid #27272a;
            border-radius: 8px;
            color: #e4e4e7;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .input:focus {
            outline: none;
            border-color: #22d3ee;
        }
        .input::placeholder {
            color: #71717a;
        }
        .label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #a1a1aa;
        }
        .form-group {
            margin-bottom: 20px;
        }
        footer {
            text-align: center;
            padding: 40px 0;
            color: #71717a;
            font-size: 14px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
                URL Shortener
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/dashboard">Dashboard</a>
            </div>
        </div>
    </nav>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="container" style="padding-top: 20px;">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            URL Shortener &copy; 2024
        </div>
    </footer>
</body>
</html>
