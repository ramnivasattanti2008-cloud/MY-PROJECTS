<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - URL Shortener</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 40px;
        }
        h1 { color: #58a6ff; font-size: 2rem; }
        .nav a {
            color: #58a6ff;
            text-decoration: none;
            margin-left: 20px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
            text-align: center;
        }
        .stat-card .value { font-size: 2.5rem; color: #58a6ff; font-weight: bold; }
        .stat-card .label { color: #8b949e; margin-top: 8px; }
        .table-container { background: #161b22; border: 1px solid #30363d; border-radius: 6px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background: #0d1117; color: #8b949e; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #1c2128; }
        .short-code { color: #58a6ff; font-weight: bold; }
        .url-original { color: #8b949e; font-size: 0.9rem; max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .clicks { color: #238636; font-weight: bold; }
        .delete-btn {
            background: #da3633;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover { background: #f85149; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>URL Shortener</h1>
            <nav class="nav">
                <a href="/">Shorten</a>
                <a href="/analytics">Analytics</a>
            </nav>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="value">{{ total_clicks }}</div>
                <div class="label">Total Clicks</div>
            </div>
            <div class="stat-card">
                <div class="value">{{ urls|length }}</div>
                <div class="label">Total URLs</div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Short Code</th>
                        <th>Original URL</th>
                        <th>Clicks</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for url in urls %}
                    <tr>
                        <td class="short-code">{{ url.short_code }}</td>
                        <td class="url-original" title="{{ url.original_url }}">{{ url.original_url }}</td>
                        <td class="clicks">{{ url.click_count }}</td>
                        <td>{{ url.created_at.strftime('%Y-%m-%d') }}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteUrl('{{ url.short_code }}')">Delete</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function deleteUrl(shortCode) {
            if (!confirm('Delete this URL?')) return;
            await fetch(`/api/urls/${shortCode}`, { method: 'DELETE' });
            location.reload();
        }
    </script>
</body>
</html>
