<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error }} - URL Shortener</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-page { text-align: center; padding: 2rem; }
        .error-code { font-size: 6rem; font-weight: bold; color: #f85149; }
        h1 { color: #f0f6fc; margin: 1rem 0; }
        p { color: #8b949e; margin-bottom: 2rem; }
        a { color: #58a6ff; text-decoration: none; padding: 0.75rem 1.5rem; background: #238636; border-radius: 6px; }
        a:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1>{{ error }}</h1>
        <p>{{ message }}</p>
        <a href="/">Go Home</a>
    </div>
</body>
</html>
