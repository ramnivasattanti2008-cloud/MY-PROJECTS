<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
        }
        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 1rem 0;
        }
        nav {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h1 {
            color: #58a6ff;
            font-size: 1.5rem;
        }
        nav a {
            color: #c9d1d9;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: background 0.2s;
        }
        nav a:hover {
            background: #21262d;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        h2 {
            color: #f0f6fc;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #8b949e;
        }
        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #2ea043;
        }
        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
        }
        .btn-secondary:hover {
            background: #30363d;
        }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #0d1117;
            border: 1px solid #238636;
            border-radius: 6px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-url {
            font-size: 1.25rem;
            color: #58a6ff;
            word-break: break-all;
        }
        .error {
            color: #f85149;
            margin-top: 1rem;
            display: none;
        }
        .error.show {
            display: block;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #8b949e;
            border-top: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <h1>URL Shortener</h1>
            <div>
                <a href="/">Shorten</a>
                <a href="/dashboard">Dashboard</a>
            </div>
        </nav>
    </header>
    <div class="container">
        <div class="card">
            <h2>Create Short URL</h2>
            <form id="shortenForm">
                <div class="form-group">
                    <label for="url">Original URL</label>
                    <input type="url" id="url" name="url" placeholder="https://example.com/long/url" required>
                </div>
                <div class="form-group">
                    <label for="custom_code">Custom Short Code (optional)</label>
                    <input type="text" id="custom_code" name="custom_code" placeholder="my-custom-code">
                </div>
                <button type="submit" class="btn">Shorten URL</button>
            </form>
            <div id="error" class="error"></div>
            <div id="result" class="result">
                <p>Your shortened URL:</p>
                <div class="result-url" id="shortUrl"></div>
                <p style="margin-top: 0.5rem; font-size: 0.9rem; color: #8b949e;">
                    <a href="#" onclick="copyToClipboard()" style="color: #58a6ff;">Copy to clipboard</a>
                </p>
            </div>
        </div>
    </div>
    <footer>
        <p>URL Shortener - Flask Application</p>
    </footer>
    <script>
        const form = document.getElementById('shortenForm');
        const result = document.getElementById('result');
        const error = document.getElementById('error');
        const shortUrl = document.getElementById('shortUrl');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            result.classList.remove('show');
            error.classList.remove('show');

            const formData = new FormData(form);

            try {
                const response = await fetch('/create', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    shortUrl.textContent = data.short_url;
                    shortUrl.href = data.short_url;
                    result.classList.add('show');
                    form.reset();
                } else {
                    error.textContent = data.error;
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = 'An error occurred. Please try again.';
                error.classList.add('show');
            }
        });

        function copyToClipboard() {
            navigator.clipboard.writeText(shortUrl.textContent);
        }
    </script>
</body>
</html>
