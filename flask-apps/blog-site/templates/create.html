<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Blog</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 40px;
        }
        h1 { color: #58a6ff; font-size: 2rem; }
        .nav a { color: #58a6ff; text-decoration: none; }
        .form-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #8b949e; }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1rem;
        }
        input:focus, textarea:focus { outline: none; border-color: #58a6ff; }
        textarea { min-height: 300px; resize: vertical; font-family: 'Consolas', monospace; }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn:hover { background: #2ea043; }
        .error { color: #f85149; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Create Post</h1>
            <nav class="nav">
                <a href="/">Back to Blog</a>
            </nav>
        </header>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" class="form-card">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" placeholder="Post title" required>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" name="author" id="author" placeholder="Your name" value="Anonymous">
            </div>
            <div class="form-group">
                <label for="tags">Tags (comma-separated)</label>
                <input type="text" name="tags" id="tags" placeholder="python, flask, tutorial">
            </div>
            <div class="form-group">
                <label for="content">Content (Markdown supported)</label>
                <textarea name="content" id="content" placeholder="Write your post content here..." required></textarea>
            </div>
            <button type="submit" class="btn">Publish Post</button>
        </form>
    </div>
</body>
</html>
