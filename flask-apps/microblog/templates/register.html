{% extends "base.html" %}

{% block title %}Sign Up - Microblog{% endblock %}

{% block content %}
<div class="container" style="padding: 60px 20px;">
    <div style="max-width: 400px; margin: 0 auto;">
        <h1 style="font-size: 2rem; font-weight: 700; margin-bottom: 8px; text-align: center;">Create Account</h1>
        <p style="color: #71717a; text-align: center; margin-bottom: 32px;">Join Microblog and share your thoughts</p>

        <div class="card">
            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <label class="label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="input" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label class="label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="input" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label class="label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="input" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label class="label" for="bio">Bio (optional)</label>
                    <textarea id="bio" name="bio" class="input" placeholder="Tell us about yourself" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;">Create Account</button>
            </form>

            <p style="text-align: center; margin-top: 24px; color: #71717a; font-size: 14px;">
                Already have an account? <a href="{{ url_for('login') }}" style="color: #ec4899;">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
