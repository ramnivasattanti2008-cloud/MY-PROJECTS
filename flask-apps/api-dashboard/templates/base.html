<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}API Dashboard{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e4e4e7; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        nav {
            background: #12121a; border-bottom: 1px solid #1f1f2e;
            padding: 1rem 0; position: sticky; top: 0; z-index: 100;
        }
        nav .container { display: flex; justify-content: space-between; align-items: center; }
        nav .logo { font-size: 1.25rem; font-weight: 700; color: #10b981; text-decoration: none; font-family: 'JetBrains Mono', monospace; }
        nav .nav-links { display: flex; gap: 8px; }
        nav .nav-links a {
            padding: 8px 16px; border-radius: 6px; color: #71717a; text-decoration: none;
            font-weight: 500; font-size: 14px; transition: all 0.2s;
        }
        nav .nav-links a:hover { color: #10b981; background: rgba(16, 185, 129, 0.1); }
        nav .nav-links a.active { color: #10b981; background: rgba(16, 185, 129, 0.15); }
        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 20px; border-radius: 8px; font-weight: 500;
            text-decoration: none; transition: all 0.2s; cursor: pointer;
            border: none; font-size: 14px;
        }
        .btn-primary { background: #10b981; color: white; }
        .btn-primary:hover { background: #059669; }
        .btn-secondary { background: #1f1f2e; color: #e4e4e7; }
        .btn-secondary:hover { background: #2a2a3e; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-xs { padding: 4px 8px; font-size: 11px; }
        .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
        .flash.error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; }
        .flash.success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981; }
        .card { background: #12121a; border: 1px solid #1f1f2e; border-radius: 12px; padding: 24px; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: #12121a; border: 1px solid #1f1f2e; border-radius: 12px; padding: 24px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: #10b981; }
        .stat-label { color: #71717a; font-size: 14px; margin-top: 4px; }
        .stat-icon { font-size: 1.5rem; margin-bottom: 8px; }
        .table { width: 100%; border-collapse: collapse; }
        .table th {
            text-align: left; padding: 12px 16px; color: #71717a; font-weight: 500;
            border-bottom: 1px solid #1f1f2e; font-size: 12px; text-transform: uppercase;
        }
        .table td { padding: 14px 16px; border-bottom: 1px solid #1f1f2e; font-size: 14px; }
        .table tr:hover { background: rgba(255,255,255,0.02); }
        .code { font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .badge {
            display: inline-block; padding: 4px 10px; border-radius: 4px;
            font-size: 12px; font-weight: 500;
        }
        .badge-green { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .badge-red { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .badge-yellow { background: rgba(234, 179, 8, 0.15); color: #eab308; }
        .badge-blue { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .input, select {
            width: 100%; padding: 12px 16px; background: #0a0a0f;
            border: 1px solid #1f1f2e; border-radius: 8px; color: #e4e4e7;
            font-size: 14px; font-family: inherit; transition: border-color 0.2s;
        }
        select { cursor: pointer; }
        .input:focus, select:focus { outline: none; border-color: #10b981; }
        .input::placeholder { color: #52525b; }
        .label { display: block; margin-bottom: 8px; font-weight: 500; color: #a1a1aa; }
        .form-group { margin-bottom: 20px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .page-title { font-size: 1.75rem; font-weight: 600; }
        .chart-bar {
            height: 8px; background: #1f1f2e; border-radius: 4px; overflow: hidden;
        }
        .chart-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
        .method-badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace;
        }
        .method-get { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .method-post { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .method-put { background: rgba(234, 179, 8, 0.15); color: #eab308; }
        .method-delete { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">&lt;/&gt; API Dashboard</a>
            <div class="nav-links">
                <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
                <a href="{{ url_for('manage_keys') }}" {% if request.endpoint == 'manage_keys' or request.endpoint == 'create_key' %}class="active"{% endif %}>Keys</a>
                <a href="{{ url_for('logs') }}" {% if request.endpoint == 'logs' %}class="active"{% endif %}>Logs</a>
                <a href="{{ url_for('stats') }}" {% if request.endpoint == 'stats' %}class="active"{% endif %}>Stats</a>
            </div>
        </div>
    </nav>

    <main style="padding: 40px 20px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="container">
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
