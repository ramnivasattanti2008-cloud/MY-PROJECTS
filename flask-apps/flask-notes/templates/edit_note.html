{% extends "base.html" %}

{% block title %}Edit Note{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4"><i class="bi bi-pencil me-2"></i>Edit Note</h2>

        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-semibold">Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ note['title'] }}" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label fw-semibold">Content</label>
                        <textarea class="form-control" id="content" name="content" rows="10" required>{{ note['content'] }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Tags</label>
                        <div class="border rounded p-3">
                            <div class="mb-3">
                                <label for="new-tags" class="form-label small text-muted">Add new tags (comma separated)</label>
                                <input type="text" class="form-control" id="new-tags" name="tags" placeholder="work, personal, ideas">
                            </div>
                            {% if tags %}
                            <div>
                                <label class="form-label small text-muted">Select tags:</label>
                                <div class="d-flex flex-wrap gap-2">
                                    {% for tag in tags %}
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="tags" value="{{ tag['name'] }}" id="tag-{{ tag['id'] }}" {% if tag['id'] in note_tag_ids %}checked{% endif %}>
                                        <label class="form-check-label" for="tag-{{ tag['id'] }}">{{ tag['name'] }}</label>
                                    </div>
                                    {% endfor %}
                                </div>
                            </div>
                            {% endif %}
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-accent text-white"><i class="bi bi-check-lg me-2"></i>Save Changes</button>
                        <a href="/note/{{ note['id'] }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
