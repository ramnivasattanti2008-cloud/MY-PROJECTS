<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Note</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f0f9ff; color: #1e293b; }
        .container { max-width: 700px; margin: 40px auto; padding: 20px; }
        h1 { color: #0369a1; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; color: #475569; }
        input[type="text"], textarea, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { min-height: 200px; resize: vertical; }
        .btn { padding: 10px 20px; background: #0369a1; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #0284c7; }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        a { color: #0369a1; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Note</h1>
        <form method="POST">
            <div class="form-group">
                <label for="title">Title *</label>
                <input type="text" id="title" name="title" value="{{ note.title }}" required>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ note.category or '' }}" list="categories">
                <datalist id="categories">
                    {% for cat in categories %}
                        <option value="{{ cat }}">
                    {% endfor %}
                </datalist>
            </div>
            <div class="form-group">
                <label for="content">Content *</label>
                <textarea id="content" name="content" required>{{ note.content }}</textarea>
            </div>
            <div class="actions">
                <button type="submit" class="btn">Update Note</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
