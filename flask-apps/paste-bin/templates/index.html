<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastebin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 40px;
        }
        h1 { color: #58a6ff; font-size: 2rem; }
        .nav a {
            color: #58a6ff;
            text-decoration: none;
            margin-left: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #8b949e; }
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1rem;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        textarea { min-height: 300px; resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #58a6ff; }
        select { cursor: pointer; }
        .row { display: flex; gap: 16px; }
        .row .form-group { flex: 1; }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .result {
            background: #0d1117;
            border: 1px solid #238636;
            padding: 16px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .result.show { display: block; }
        .result a { color: #58a6ff; word-break: break-all; }
        .recent { margin-top: 40px; }
        .recent h2 { margin-bottom: 20px; color: #fff; }
        .paste-item {
            background: #161b22;
            border: 1px solid #30363d;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        .paste-item .title { color: #58a6ff; font-weight: bold; }
        .paste-item .meta { color: #8b949e; font-size: 0.9rem; margin-top: 4px; }
        .paste-item a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pastebin</h1>
            <nav class="nav">
                <a href="/">New Paste</a>
            </nav>
        </header>

        <div class="card">
            <form id="pasteForm">
                <div class="form-group">
                    <label for="title">Title (optional)</label>
                    <input type="text" id="title" placeholder="Untitled">
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="language">Language</label>
                        <select id="language">
                            <option value="plaintext">Plain Text</option>
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="typescript">TypeScript</option>
                            <option value="java">Java</option>
                            <option value="cpp">C++</option>
                            <option value="csharp">C#</option>
                            <option value="go">Go</option>
                            <option value="rust">Rust</option>
                            <option value="html">HTML</option>
                            <option value="css">CSS</option>
                            <option value="sql">SQL</option>
                            <option value="json">JSON</option>
                            <option value="bash">Bash</option>
                            <option value="markdown">Markdown</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="expiration">Expiration</label>
                        <select id="expiration">
                            <option value="never">Never</option>
                            <option value="1h">1 Hour</option>
                            <option value="24h">24 Hours</option>
                            <option value="7d">7 Days</option>
                            <option value="30d">30 Days</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password (optional)</label>
                    <input type="password" id="password" placeholder="Leave empty for no password">
                </div>
                <div class="form-group">
                    <label for="content">Content</label>
                    <textarea id="content" placeholder="Paste your code here..." required></textarea>
                </div>
                <button type="submit" class="btn">Create Paste</button>
            </form>
            <div class="result" id="result">
                <p style="color: #8b949e;">Your paste:</p>
                <a href="#" id="pasteUrl"></a>
            </div>
        </div>

        <div class="recent" id="recentPastes">
            <h2>Recent Pastes</h2>
        </div>
    </div>

    <script>
        const form = document.getElementById('pasteForm');
        const result = document.getElementById('result');
        const pasteUrl = document.getElementById('pasteUrl');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            result.classList.remove('show');

            const data = {
                title: document.getElementById('title').value,
                content: document.getElementById('content').value,
                language: document.getElementById('language').value,
                expiration: document.getElementById('expiration').value,
                password: document.getElementById('password').value
            };

            const res = await fetch('/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const json = await res.json();

            pasteUrl.href = json.view_url;
            pasteUrl.textContent = json.view_url;
            result.classList.add('show');
            loadRecentPastes();
        });

        async function loadRecentPastes() {
            const res = await fetch('/api/pastes');
            const pastes = await res.json();
            const container = document.getElementById('recentPastes');
            container.innerHTML = '<h2>Recent Pastes</h2>';

            pastes.slice(0, 5).forEach(paste => {
                container.innerHTML += `
                    <div class="paste-item">
                        <div class="title">${paste.title || 'Untitled'}</div>
                        <div class="meta">${paste.language} - ${new Date(paste.created_at).toLocaleDateString()}</div>
                        <a href="/p/${paste.paste_id}">View paste</a>
                    </div>
                `;
            });
        }

        loadRecentPastes();
    </script>
</body>
</html>
