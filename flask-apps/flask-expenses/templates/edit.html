<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0fdf4; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 2rem; }
        header { background: #10b981; color: white; padding: 1.5rem 0; margin-bottom: 2rem; }
        header h1 { text-align: center; }
        .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; color: #374151; margin-bottom: 0.5rem; }
        input[type="number"], input[type="date"], select, textarea { width: 100%; padding: 0.75rem; border: 2px solid #d1d5db; border-radius: 8px; font-size: 1rem; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #10b981; }
        .amount-input { display: flex; align-items: center; }
        .amount-input span { padding: 0.75rem; background: #f3f4f6; border: 2px solid #d1d5db; border-right: none; border-radius: 8px 0 0 8px; color: #6b7280; }
        .amount-input input { border-radius: 0 8px 8px 0; }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #10b981; color: white; }
        .btn-secondary { background: #6b7280; color: white; text-decoration: none; display: inline-block; }
        .actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #10b981; text-decoration: none; }
    </style>
</head>
<body>
    <header><h1>Edit Expense</h1></header>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back-link">Back to Expenses</a>
        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="amount-input">
                        <span>$</span>
                        <input type="number" id="amount" name="amount" step="0.01" min="0.01" value="{{ expense.amount }}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description">{{ expense.description or '' }}</textarea>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" value="{{ expense.date }}" required>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Update Expense</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
