{% extends 'base.html' %}

{% block title %}Edit Bookmark{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Bookmark</h2>
    <form method="post">
        <div class="form-group">
            <label for="title">Title *</label>
            <input type="text" id="title" name="title" value="{{ bookmark.title }}" required>
        </div>

        <div class="form-group">
            <label for="url">URL *</label>
            <input type="url" id="url" name="url" value="{{ bookmark.url }}" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" value="{{ bookmark.description or '' }}">
        </div>

        <div class="form-group">
            <label for="tags">Tags (comma-separated)</label>
            <input type="text" id="tags" name="tags" value="{{ bookmark.tags or '' }}">
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes">{{ bookmark.notes or '' }}</textarea>
        </div>

        <button type="submit" class="btn">Update Bookmark</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
