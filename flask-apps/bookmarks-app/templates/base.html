<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bookmark Manager{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        nav {
            background: #16213e;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0f3460;
        }
        nav h1 {
            color: #e94560;
            font-size: 1.5rem;
        }
        nav a {
            color: #eee;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: all 0.2s;
        }
        nav a:hover {
            background: #0f3460;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border: 1px solid #0f3460;
        }
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: #e94560;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .btn:hover {
            background: #d63850;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #0f3460;
        }
        .btn-secondary:hover {
            background: #1a4a80;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.85rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #aaa;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            font-size: 1rem;
            background: #1a1a2e;
            color: #eee;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .search-bar input,
        .search-bar select {
            padding: 0.75rem;
            border: 1px solid #0f3460;
            border-radius: 4px;
            font-size: 1rem;
            background: #16213e;
            color: #eee;
        }
        .search-bar input[type="text"] {
            flex: 1;
            min-width: 200px;
        }
        .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0.5rem 0;
        }
        .tag {
            background: #0f3460;
            color: #e94560;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .tag:hover {
            background: #1a4a80;
        }
        .tag-filter {
            margin-bottom: 1rem;
        }
        .bookmark-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .bookmark-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem;
            background: #16213e;
            border-radius: 8px;
            border: 1px solid #0f3460;
            transition: all 0.2s;
        }
        .bookmark-item:hover {
            border-color: #e94560;
            transform: translateX(4px);
        }
        .bookmark-info h3 {
            margin-bottom: 0.5rem;
        }
        .bookmark-info h3 a {
            color: #eee;
            text-decoration: none;
        }
        .bookmark-info h3 a:hover {
            color: #e94560;
        }
        .bookmark-url {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }
        .bookmark-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #888;
        }
        .bookmark-actions {
            display: flex;
            gap: 0.5rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
        .stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #16213e;
            border-radius: 8px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }
        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav>
        <h1>Bookmark Manager</h1>
        <div>
            <a href="{{ url_for('index') }}">All Bookmarks</a>
            <a href="{{ url_for('add_bookmark') }}">Add Bookmark</a>
            <a href="{{ url_for('export_bookmarks') }}">Export</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
