<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer - Quiz Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .container { max-width: 700px; margin: 0 auto; padding: 40px 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 40px;
            text-align: center;
            width: 100%;
        }
        .result-icon { font-size: 4rem; margin-bottom: 20px; }
        .result-text { font-size: 1.5rem; color: #fff; margin-bottom: 20px; }
        .correct-answer { color: #238636; margin-bottom: 30px; }
        .correct-answer span { color: #8b949e; }
        .btn {
            background: #238636;
            color: #fff;
            border: none;
            padding: 14px 28px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #2ea043; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="result-icon">{{ 'Correct!' if is_correct else 'Wrong!' }}</div>
            <div class="result-text">{{ 'Great job!' if is_correct else 'Not quite...' }}</div>
            <div class="correct-answer">
                <span>The correct answer was:</span><br>
                {{ question.correct_answer }}
            </div>
            <a href="/next" class="btn">Next Question</a>
        </div>
    </div>
</body>
</html>
