<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SaaS Product{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #1e293b;
            --accent: #818cf8;
            --light: #f8fafc;
        }
        body { font-family: 'Inter', system-ui, sans-serif; }
        .navbar { padding: 1rem 0; }
        .hero { background: linear-gradient(135deg, var(--secondary) 0%, #0f172a 100%); color: white; padding: 120px 0; }
        .hero h1 { font-weight: 800; font-size: 3.5rem; }
        .btn-primary { background-color: var(--primary); border: none; padding: 12px 32px; font-weight: 600; }
        .btn-primary:hover { background-color: var(--accent); }
        .btn-outline-light { padding: 12px 32px; font-weight: 600; }
        .feature-icon { font-size: 3rem; color: var(--primary); }
        .card { border: 1px solid #e2e8f0; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .popular-badge { background-color: var(--primary); }
        .pricing-header { background-color: var(--secondary); color: white; border-radius: 8px 8px 0 0; }
        .price { font-size: 3rem; font-weight: 700; }
        footer { background-color: var(--secondary); color: white; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="/">SaaSify</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link text-dark" href="/#features">Features</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="/#pricing">Pricing</a></li>
                    <li class="nav-item"><a class="nav-link text-dark" href="/contact">Contact</a></li>
                    <li class="nav-item ms-3"><a class="btn btn-primary" href="/">Get Started</a></li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <footer class="py-5 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-4 mb-4 mb-md-0">
                    <h5 class="fw-bold mb-3">SaaSify</h5>
                    <p class="text-white-50">Building the future of productivity tools.</p>
                </div>
                <div class="col-md-4 mb-4 mb-md-0">
                    <h6 class="fw-bold mb-3">Links</h6>
                    <ul class="list-unstyled">
                        <li><a href="/#features" class="text-white-50 text-decoration-none">Features</a></li>
                        <li><a href="/#pricing" class="text-white-50 text-decoration-none">Pricing</a></li>
                        <li><a href="/contact" class="text-white-50 text-decoration-none">Contact</a></li>
                    </ul>
                </div>
                <div class="col-md-4">
                    <h6 class="fw-bold mb-3">Connect</h6>
                    <div class="d-flex gap-3">
                        <a href="#" class="text-white-50 fs-5"><i class="bi bi-twitter"></i></a>
                        <a href="#" class="text-white-50 fs-5"><i class="bi bi-github"></i></a>
                        <a href="#" class="text-white-50 fs-5"><i class="bi bi-linkedin"></i></a>
                    </div>
                </div>
            </div>
            <hr class="my-4 border-secondary">
            <p class="text-center text-white-50 mb-0">&copy; 2026 SaaSify. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
