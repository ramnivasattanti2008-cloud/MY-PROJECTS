<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Bookmark</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        header { background: #0ea5e9; color: white; padding: 1.5rem 0; margin-bottom: 2rem; }
        header h1 { text-align: center; }
        .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; color: #374151; margin-bottom: 0.5rem; }
        input[type="url"], input[type="text"], textarea { width: 100%; padding: 0.75rem; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #0ea5e9; }
        textarea { resize: vertical; min-height: 100px; }
        .hint { font-size: 0.875rem; color: #64748b; margin-top: 0.25rem; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #0ea5e9; color: white; }
        .btn-secondary { background: #64748b; color: white; text-decoration: none; display: inline-block; }
        .actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #0ea5e9; text-decoration: none; }
    </style>
</head>
<body>
    <header><h1>Add Bookmark</h1></header>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back-link">Back to Bookmarks</a>
        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="url">URL</label>
                    <input type="url" id="url" name="url" placeholder="https://example.com" required>
                </div>

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" placeholder="Bookmark title" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" placeholder="Optional description..."></textarea>
                </div>

                <div class="form-group">
                    <label for="tags">Tags</label>
                    <input type="text" id="tags" name="tags" placeholder="work, tutorial, reference">
                    <p class="hint">Separate tags with commas</p>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Save Bookmark</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
