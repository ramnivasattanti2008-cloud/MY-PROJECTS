{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="w-full max-w-md">
    <div class="bg-gray-800 rounded-lg p-8 shadow-xl">
        <h1 class="text-2xl font-bold text-white mb-6 text-center">Create Account</h1>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-300 mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-300 mb-2">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-gray-300 mb-2">Password</label>
                <input type="password" name="password" required minlength="6" class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 font-semibold">Register</button>
        </form>
        <p class="text-gray-400 text-center mt-4">Already have an account? <a href="/login" class="text-blue-400 hover:underline">Login</a></p>
    </div>
</div>
{% endblock %}
