{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="w-full max-w-2xl">
    <div class="bg-gray-800 rounded-lg p-8 shadow-xl">
        <div class="text-center mb-8">
            <div class="w-24 h-24 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl font-bold text-white">{{ user.username[0]|upper }}</span>
            </div>
            <h1 class="text-2xl font-bold text-white">Welcome, {{ user.username }}!</h1>
            <p class="text-gray-400 mt-2">{{ user.email }}</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-gray-700 rounded-lg p-4 text-center">
                <p class="text-gray-400 text-sm">Account ID</p>
                <p class="text-xl font-bold text-white">#{{ user.id }}</p>
            </div>
            <div class="bg-gray-700 rounded-lg p-4 text-center">
                <p class="text-gray-400 text-sm">Status</p>
                <p class="text-xl font-bold text-green-400">Active</p>
            </div>
        </div>
        <div class="mt-8 space-y-3">
            <a href="#" class="block w-full bg-gray-700 text-white py-3 px-4 rounded-lg hover:bg-gray-600 text-center">Profile Settings</a>
            <a href="/logout" class="block w-full bg-red-600 text-white py-3 px-4 rounded-lg hover:bg-red-700 text-center">Logout</a>
        </div>
    </div>
</div>
{% endblock %}
