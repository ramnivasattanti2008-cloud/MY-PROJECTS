{% extends "base.html" %}
{% block title %}Users - Dashboard{% endblock %}
{% block content %}
<div class="header">
    <h1>Users</h1>
    <button style="background: #22c55e; color: #0a0a0f; padding: 0.7rem 1.5rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Add User</button>
</div>

<div style="background: #12121a; border-radius: 12px; border: 1px solid #1a1a2e; overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="background: #0f0f18; border-bottom: 1px solid #1a1a2e;">
                <th style="padding: 1rem; text-align: left; color: #888; font-weight: 500;">Name</th>
                <th style="padding: 1rem; text-align: left; color: #888; font-weight: 500;">Email</th>
                <th style="padding: 1rem; text-align: left; color: #888; font-weight: 500;">Status</th>
                <th style="padding: 1rem; text-align: left; color: #888; font-weight: 500;">Plan</th>
                <th style="padding: 1rem; text-align: left; color: #888; font-weight: 500;">Joined</th>
                <th style="padding: 1rem; text-align: right; color: #888; font-weight: 500;">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr style="border-bottom: 1px solid #1a1a2e;">
                <td style="padding: 1rem;">{{ user.name }}</td>
                <td style="padding: 1rem; color: #888;">{{ user.email }}</td>
                <td style="padding: 1rem;">
                    <span style="background: {% if user.status == 'Active' %}rgba(34, 197, 94, 0.2){% else %}rgba(239, 68, 68, 0.2){% endif %}; color: {% if user.status == 'Active' %}#4ade80{% else %}#f87171{% endif %}; padding: 0.25rem 0.75rem; border-radius: 15px; font-size: 0.85rem;">{{ user.status }}</span>
                </td>
                <td style="padding: 1rem;">{{ user.plan }}</td>
                <td style="padding: 1rem; color: #888;">{{ user.joined }}</td>
                <td style="padding: 1rem; text-align: right;">
                    <button style="background: transparent; border: 1px solid #22c55e; color: #22c55e; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; margin-right: 0.5rem;">Edit</button>
                    <button style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer;">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
