<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Poll</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        header { background: #6366f1; color: white; padding: 1.5rem 0; margin-bottom: 2rem; }
        header h1 { text-align: center; }
        .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; color: #374151; margin-bottom: 0.5rem; }
        input[type="text"] { width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1rem; }
        input[type="text"]:focus { outline: none; border-color: #6366f1; }
        .options-container { display: flex; flex-direction: column; gap: 0.75rem; }
        .option-row { display: flex; gap: 0.5rem; }
        .option-row input { flex: 1; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: #6366f1; color: white; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-add { background: #22c55e; color: white; padding: 0.5rem 1rem; font-size: 0.875rem; }
        .btn-remove { background: #ef4444; color: white; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
        .actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #6366f1; text-decoration: none; }
    </style>
</head>
<body>
    <header><h1>Create Poll</h1></header>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back-link">Back to Polls</a>
        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="question">Poll Question</label>
                    <input type="text" id="question" name="question" placeholder="What would you like to ask?" required>
                </div>

                <div class="form-group">
                    <label>Options</label>
                    <div class="options-container" id="options-container">
                        <div class="option-row">
                            <input type="text" name="options" placeholder="Option 1" required>
                        </div>
                        <div class="option-row">
                            <input type="text" name="options" placeholder="Option 2" required>
                        </div>
                    </div>
                    <button type="button" class="btn btn-add" onclick="addOption()">+ Add Option</button>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Create Poll</button>
                    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        let optionCount = 2;
        function addOption() {
            optionCount++;
            const container = document.getElementById('options-container');
            const div = document.createElement('div');
            div.className = 'option-row';
            div.innerHTML = `
                <input type="text" name="options" placeholder="Option ${optionCount}" required>
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }
    </script>
</body>
</html>
