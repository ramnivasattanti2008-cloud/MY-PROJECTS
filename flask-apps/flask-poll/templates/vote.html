<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; padding: 2rem; }
        header { background: #6366f1; color: white; padding: 1.5rem 0; margin-bottom: 2rem; }
        header h1 { text-align: center; }
        .poll-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .poll-question { font-size: 1.5rem; color: #1f2937; margin-bottom: 1.5rem; text-align: center; }
        .options-list { display: flex; flex-direction: column; gap: 1rem; }
        .option-label { display: flex; align-items: center; gap: 1rem; padding: 1rem;
                        border: 2px solid #e5e7eb; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
        .option-label:hover { border-color: #6366f1; background: #f0f0ff; }
        .option-label input[type="radio"] { width: 20px; height: 20px; accent-color: #6366f1; }
        .option-text { font-size: 1.125rem; color: #374151; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; width: 100%; margin-top: 1rem; }
        .btn-vote { background: #6366f1; color: white; }
        .btn-vote:hover { background: #4f46e5; }
        .btn-results { background: #f59e0b; color: white; text-decoration: none; display: inline-block; text-align: center; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #6366f1; text-decoration: none; }
    </style>
</head>
<body>
    <header><h1>Vote</h1></header>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back-link">Back to Polls</a>
        <div class="poll-card">
            <h2 class="poll-question">{{ poll.question }}</h2>

            <form method="POST">
                <div class="options-list">
                    {% for option in options %}
                    <label class="option-label">
                        <input type="radio" name="option" value="{{ option.id }}" required>
                        <span class="option-text">{{ option.option_text }}</span>
                    </label>
                    {% endfor %}
                </div>
                <button type="submit" class="btn btn-vote">Submit Vote</button>
            </form>

            <a href="{{ url_for('results', poll_id=poll.id) }}" class="btn btn-results">View Results</a>
        </div>
    </div>
</body>
</html>
