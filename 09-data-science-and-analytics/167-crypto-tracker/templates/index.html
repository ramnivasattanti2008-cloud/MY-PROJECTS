<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTracker - Live Prices</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 30px 0;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #f7931a, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header p {
            color: #888;
            margin-top: 10px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .controls select {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a2e;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        .controls button {
            padding: 10px 25px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #f7931a, #ff6b6b);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .controls button:hover {
            transform: scale(1.05);
        }
        .crypto-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .crypto-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .crypto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .crypto-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .crypto-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }
        .crypto-info h3 {
            font-size: 1.2rem;
        }
        .crypto-info span {
            color: #888;
            font-size: 0.9rem;
        }
        .crypto-price {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .price-change {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .price-change.positive {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }
        .price-change.negative {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }
        .sparkline {
            margin-top: 15px;
            height: 60px;
        }
        .sparkline svg {
            width: 100%;
            height: 100%;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
        }
        .stats div {
            flex: 1;
        }
        .stats span {
            display: block;
            margin-top: 3px;
        }
        .stats .value {
            color: #fff;
            font-weight: 500;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }
        .error {
            text-align: center;
            padding: 30px;
            background: rgba(255, 71, 87, 0.1);
            border-radius: 12px;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>CryptoTracker</h1>
            <p>Real-time cryptocurrency prices powered by CoinGecko</p>
        </header>

        <div class="controls">
            <select id="limitSelect">
                <option value="10">Top 10</option>
                <option value="20">Top 20</option>
                <option value="50">Top 50</option>
            </select>
            <button onclick="loadCryptos()">Refresh Prices</button>
        </div>

        <div id="cryptoContainer" class="crypto-grid">
            <div class="loading">Loading cryptocurrency data...</div>
        </div>
    </div>

    <script>
        function formatCurrency(value) {
            if (value >= 1e12) return '$' + (value / 1e12).toFixed(2) + 'T';
            if (value >= 1e9) return '$' + (value / 1e9).toFixed(2) + 'B';
            if (value >= 1e6) return '$' + (value / 1e6).toFixed(2) + 'M';
            return '$' + value.toLocaleString();
        }

        function formatPrice(value) {
            if (value >= 1) return '$' + value.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            return '$' + value.toFixed(6);
        }

        function formatPercent(value) {
            const sign = value >= 0 ? '+' : '';
            return sign + value.toFixed(2) + '%';
        }

        function createSparkline(prices, isPositive) {
            if (!prices || prices.length === 0) return '';

            const width = 280;
            const height = 60;
            const padding = 5;

            const min = Math.min(...prices);
            const max = Math.max(...prices);
            const range = max - min || 1;

            const points = prices.map((price, i) => {
                const x = padding + (i / (prices.length - 1)) * (width - 2 * padding);
                const y = height - padding - ((price - min) / range) * (height - 2 * padding);
                return `${x},${y}`;
            }).join(' ');

            const color = isPositive ? '#00ff88' : '#ff4757';

            return `
                <svg viewBox="0 0 ${width} ${height}">
                    <defs>
                        <linearGradient id="gradient-${isPositive ? 'up' : 'down'}" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:${color};stop-opacity:0.3"/>
                            <stop offset="100%" style="stop-color:${color};stop-opacity:0"/>
                        </linearGradient>
                    </defs>
                    <polygon points="${padding},${height - padding} ${points} ${width - padding},${height - padding}" fill="url(#gradient-${isPositive ? 'up' : 'down'})"/>
                    <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
        }

        function renderCryptoCard(crypto) {
            const is24hPositive = crypto.price_change_percentage_24h >= 0;
            const sparklineData = crypto.sparkline_in_7d?.price || [];

            return `
                <div class="crypto-card">
                    <div class="crypto-header">
                        <img src="${crypto.image}" alt="${crypto.name}" class="crypto-icon">
                        <div class="crypto-info">
                            <h3>${crypto.name}</h3>
                            <span>${crypto.symbol.toUpperCase()} &bull; Rank #${crypto.market_cap_rank}</span>
                        </div>
                    </div>
                    <div class="crypto-price">${formatPrice(crypto.current_price)}</div>
                    <span class="price-change ${is24hPositive ? 'positive' : 'negative'}">
                        ${formatPercent(crypto.price_change_percentage_24h)} (24h)
                    </span>
                    <div class="stats">
                        <div>
                            1h
                            <span class="value" style="color: ${crypto.price_change_percentage_1h_in_currency >= 0 ? '#00ff88' : '#ff4757'}">
                                ${formatPercent(crypto.price_change_percentage_1h_in_currency || 0)}
                            </span>
                        </div>
                        <div>
                            7d
                            <span class="value" style="color: ${crypto.price_change_percentage_7d_in_currency >= 0 ? '#00ff88' : '#ff4757'}">
                                ${formatPercent(crypto.price_change_percentage_7d_in_currency || 0)}
                            </span>
                        </div>
                        <div>
                            Market Cap
                            <span class="value">${formatCurrency(crypto.market_cap)}</span>
                        </div>
                    </div>
                    <div class="sparkline">
                        ${createSparkline(sparklineData.slice(-24), is24hPositive)}
                    </div>
                </div>
            `;
        }

        async function loadCryptos() {
            const container = document.getElementById('cryptoContainer');
            const limit = document.getElementById('limitSelect').value;

            container.innerHTML = '<div class="loading">Fetching latest prices...</div>';

            try {
                const response = await fetch(`/api/cryptos?limit=${limit}`);
                const cryptos = await response.json();

                if (cryptos.length === 0) {
                    container.innerHTML = '<div class="error">No data available. Please try again.</div>';
                    return;
                }

                container.innerHTML = cryptos.map(renderCryptoCard).join('');
            } catch (error) {
                container.innerHTML = '<div class="error">Failed to load data. Check your connection.</div>';
                console.error(error);
            }
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadCryptos);
    </script>
</body>
</html>
