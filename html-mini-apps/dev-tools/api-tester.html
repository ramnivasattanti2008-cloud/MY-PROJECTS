<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --success: #3fb950;
            --error: #f85149;
            --warning: #d29922;
            --get: #3fb950;
            --post: #58a6ff;
            --put: #d29922;
            --delete: #f85149;
            --patch: #d2a8ff;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 .icon {
            color: var(--accent);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        .panel-body {
            padding: 20px;
        }

        .request-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .method-select {
            width: 120px;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            padding: 12px;
            cursor: pointer;
            outline: none;
        }

        .method-select:focus {
            border-color: var(--accent);
        }

        .url-input {
            flex: 1;
            background: var(--bg-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            padding: 12px;
            outline: none;
        }

        .url-input:focus {
            border-color: var(--accent);
        }

        .send-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }

        .tab {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            padding: 10px 20px;
            border-radius: 8px 8px 0 0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--bg-primary);
            color: var(--accent);
        }

        .tab-content {
            display: none;
            background: var(--bg-primary);
            border-radius: 0 8px 8px 8px;
            padding: 16px;
            min-height: 200px;
        }

        .tab-content.active {
            display: block;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        .headers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .header-input {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            padding: 10px;
            outline: none;
        }

        .header-input:focus {
            border-color: var(--accent);
        }

        .header-remove {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }

        .header-remove:hover {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        .add-header-btn {
            background: transparent;
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 8px;
        }

        .add-header-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .response-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .meta-value {
            font-size: 14px;
            font-weight: 600;
        }

        .status-success { color: var(--success); }
        .status-redirect { color: var(--warning); }
        .status-error { color: var(--error); }

        .response-body {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            max-height: 400px;
            overflow: auto;
        }

        .response-body pre {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .json-key { color: #79c0ff; }
        .json-string { color: #a5d6ff; }
        .json-number { color: #f2cc60; }
        .json-boolean { color: #ff7b72; }
        .json-null { color: #8b949e; }

        .history-panel {
            max-height: 500px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-primary);
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .history-item:hover {
            background: var(--bg-tertiary);
        }

        .history-method {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            min-width: 60px;
            text-align: center;
        }

        .history-method.GET { background: rgba(63, 185, 80, 0.2); color: var(--get); }
        .history-method.POST { background: rgba(88, 166, 255, 0.2); color: var(--post); }
        .history-method.PUT { background: rgba(210, 153, 34, 0.2); color: var(--put); }
        .history-method.DELETE { background: rgba(248, 81, 73, 0.2); color: var(--delete); }
        .history-method.PATCH { background: rgba(210, 168, 255, 0.2); color: var(--patch); }

        .history-url {
            flex: 1;
            font-size: 13px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-status {
            font-size: 12px;
            font-weight: 600;
        }

        .history-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .empty-history {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-history .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .clear-history {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .clear-history:hover {
            background: var(--error);
            border-color: var(--error);
            color: white;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .params-grid {
            display: grid;
            gap: 8px;
        }

        .param-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 8px;
            align-items: center;
        }

        .param-input {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            padding: 10px;
            outline: none;
        }

        .param-input:focus {
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="icon">API</span> API Tester</h1>
        </header>

        <div class="main-grid">
            <div class="left-column">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">Request</span>
                    </div>
                    <div class="panel-body">
                        <div class="request-row">
                            <select class="method-select" id="method">
                                <option value="GET">GET</option>
                                <option value="POST">POST</option>
                                <option value="PUT">PUT</option>
                                <option value="DELETE">DELETE</option>
                                <option value="PATCH">PATCH</option>
                            </select>
                            <input type="text" class="url-input" id="url" placeholder="https://api.example.com/endpoint">
                            <button class="send-btn" id="sendBtn" onclick="sendRequest()">Send</button>
                        </div>

                        <div class="tabs">
                            <button class="tab active" onclick="switchTab('params')">Params</button>
                            <button class="tab" onclick="switchTab('headers')">Headers</button>
                            <button class="tab" onclick="switchTab('body')">Body</button>
                        </div>

                        <div class="tab-content active" id="params-tab">
                            <div class="params-grid" id="paramsGrid">
                                <div class="param-row">
                                    <input type="text" class="param-input" placeholder="Key" value="page">
                                    <input type="text" class="param-input" placeholder="Value" value="1">
                                    <button class="header-remove" onclick="removeParam(this)">x</button>
                                </div>
                            </div>
                            <button class="add-header-btn" onclick="addParam()">+ Add Parameter</button>
                        </div>

                        <div class="tab-content" id="headers-tab">
                            <div class="headers-list" id="headersList">
                                <div class="header-row">
                                    <input type="text" class="header-input" placeholder="Header name" value="Content-Type">
                                    <input type="text" class="header-input" placeholder="Value" value="application/json">
                                    <button class="header-remove" onclick="removeHeader(this)">x</button>
                                </div>
                            </div>
                            <button class="add-header-btn" onclick="addHeader()">+ Add Header</button>
                        </div>

                        <div class="tab-content" id="body-tab">
                            <textarea id="body" placeholder='{"key": "value"}'>{}</textarea>
                        </div>
                    </div>
                </div>

                <div class="panel" style="margin-top: 24px;">
                    <div class="panel-header">
                        <span class="panel-title">Response</span>
                        <span class="meta-value" id="responseTime" style="font-size: 12px; color: var(--text-secondary);"></span>
                    </div>
                    <div class="panel-body">
                        <div id="responseMeta" style="display: none;">
                            <div class="response-meta">
                                <div class="meta-item">
                                    <span class="meta-label">Status:</span>
                                    <span class="meta-value" id="statusCode"></span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Time:</span>
                                    <span class="meta-value" id="responseTimeValue"></span>
                                </div>
                                <div class="meta-item">
                                    <span class="meta-label">Size:</span>
                                    <span class="meta-value" id="responseSize"></span>
                                </div>
                            </div>
                        </div>
                        <div class="response-body" id="responseBody">
                            <div class="empty-history">
                                <div class="icon">API</div>
                                <p>Send a request to see the response</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-column">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">History</span>
                        <button class="clear-history" onclick="clearHistory()">Clear</button>
                    </div>
                    <div class="panel-body history-panel">
                        <div id="historyList">
                            <div class="empty-history">
                                <div class="icon">History</div>
                                <p>No requests yet</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let history = [];
        const STORAGE_KEY = 'api_tester_history';

        // Load history from localStorage
        function loadHistory() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    history = JSON.parse(saved);
                    renderHistory();
                }
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        // Save history to localStorage
        function saveHistory() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, 50)));
            } catch (e) {
                console.error('Failed to save history:', e);
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function addHeader() {
            const container = document.getElementById('headersList');
            const row = document.createElement('div');
            row.className = 'header-row';
            row.innerHTML = `
                <input type="text" class="header-input" placeholder="Header name">
                <input type="text" class="header-input" placeholder="Value">
                <button class="header-remove" onclick="removeHeader(this)">x</button>
            `;
            container.appendChild(row);
        }

        function removeHeader(btn) {
            const row = btn.closest('.header-row');
            if (document.querySelectorAll('.header-row').length > 1) {
                row.remove();
            } else {
                row.querySelectorAll('input').forEach(i => i.value = '');
            }
        }

        function addParam() {
            const container = document.getElementById('paramsGrid');
            const row = document.createElement('div');
            row.className = 'param-row';
            row.innerHTML = `
                <input type="text" class="param-input" placeholder="Key">
                <input type="text" class="param-input" placeholder="Value">
                <button class="header-remove" onclick="removeParam(this)">x</button>
            `;
            container.appendChild(row);
        }

        function removeParam(btn) {
            const row = btn.closest('.param-row');
            if (document.querySelectorAll('.param-row').length > 1) {
                row.remove();
            } else {
                row.querySelectorAll('input').forEach(i => i.value = '');
            }
        }

        function getMethodClass(method) {
            return method;
        }

        function getStatusClass(status) {
            if (status >= 200 && status < 300) return 'status-success';
            if (status >= 300 && status < 400) return 'status-redirect';
            return 'status-error';
        }

        function formatJson(text) {
            try {
                const json = JSON.parse(text);
                return syntaxHighlight(JSON.stringify(json, null, 2));
            } catch (e) {
                return escapeHtml(text);
            }
        }

        function syntaxHighlight(json) {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function formatTime(ms) {
            if (ms < 1000) return ms + ' ms';
            return (ms / 1000).toFixed(2) + ' s';
        }

        function getHeaders() {
            const headers = {};
            document.querySelectorAll('#headersList .header-row').forEach(row => {
                const inputs = row.querySelectorAll('input');
                const name = inputs[0].value.trim();
                const value = inputs[1].value.trim();
                if (name) {
                    headers[name] = value;
                }
            });
            return headers;
        }

        function getUrlWithParams() {
            const baseUrl = document.getElementById('url').value.trim();
            const params = [];

            document.querySelectorAll('#paramsGrid .param-row').forEach(row => {
                const inputs = row.querySelectorAll('input');
                const key = inputs[0].value.trim();
                const value = inputs[1].value.trim();
                if (key) {
                    params.push(`${encodeURIComponent(key)}=${encodeURIComponent(value)}`);
                }
            });

            if (params.length > 0) {
                const separator = baseUrl.includes('?') ? '&' : '?';
                return baseUrl + separator + params.join('&');
            }
            return baseUrl;
        }

        async function sendRequest() {
            const method = document.getElementById('method').value;
            const url = document.getElementById('url').value.trim();
            const sendBtn = document.getElementById('sendBtn');

            if (!url) {
                alert('Please enter a URL');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading"></span>';

            const startTime = performance.now();

            try {
                const options = {
                    method: method,
                    headers: getHeaders()
                };

                if (['POST', 'PUT', 'PATCH'].includes(method)) {
                    const body = document.getElementById('body').value.trim();
                    if (body) {
                        options.body = body;
                    }
                }

                const fullUrl = getUrlWithParams();
                const response = await fetch(fullUrl, options);
                const endTime = performance.now();
                const duration = endTime - startTime;

                const responseText = await response.text();
                const responseSize = new Blob([responseText]).size;

                // Update response display
                document.getElementById('responseMeta').style.display = 'block';
                document.getElementById('statusCode').textContent = `${response.status} ${response.statusText}`;
                document.getElementById('statusCode').className = `meta-value ${getStatusClass(response.status)}`;
                document.getElementById('responseTimeValue').textContent = formatTime(duration);
                document.getElementById('responseSize').textContent = formatSize(responseSize);
                document.getElementById('responseBody').innerHTML = `<pre>${formatJson(responseText)}</pre>`;

                // Add to history
                addToHistory({
                    method: method,
                    url: fullUrl,
                    status: response.status,
                    time: new Date().toLocaleTimeString()
                });

            } catch (error) {
                document.getElementById('responseMeta').style.display = 'block';
                document.getElementById('statusCode').textContent = 'Error';
                document.getElementById('statusCode').className = 'meta-value status-error';
                document.getElementById('responseTimeValue').textContent = formatTime(performance.now() - startTime);
                document.getElementById('responseSize').textContent = '-';
                document.getElementById('responseBody').innerHTML = `<pre style="color: var(--error);">${escapeHtml(error.message)}</pre>`;
            }

            sendBtn.disabled = false;
            sendBtn.textContent = 'Send';
        }

        function addToHistory(item) {
            history.unshift(item);
            if (history.length > 50) {
                history = history.slice(0, 50);
            }
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyList');

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-history">
                        <div class="icon">History</div>
                        <p>No requests yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = history.map((item, index) => `
                <div class="history-item" onclick="loadFromHistory(${index})">
                    <span class="history-method ${item.method}">${item.method}</span>
                    <span class="history-url">${item.url}</span>
                    <span class="history-status ${getStatusClass(item.status)}">${item.status || 'Error'}</span>
                    <span class="history-time">${item.time}</span>
                </div>
            `).join('');
        }

        function loadFromHistory(index) {
            const item = history[index];

            // Parse URL to extract base URL and params
            try {
                const urlObj = new URL(item.url);
                document.getElementById('url').value = urlObj.origin + urlObj.pathname;

                // Load query params
                const paramsGrid = document.getElementById('paramsGrid');
                paramsGrid.innerHTML = '';

                urlObj.searchParams.forEach((value, key) => {
                    const row = document.createElement('div');
                    row.className = 'param-row';
                    row.innerHTML = `
                        <input type="text" class="param-input" placeholder="Key" value="${key}">
                        <input type="text" class="param-input" placeholder="Value" value="${value}">
                        <button class="header-remove" onclick="removeParam(this)">x</button>
                    `;
                    paramsGrid.appendChild(row);
                });

                if (urlObj.searchParams.toString() === '') {
                    const row = document.createElement('div');
                    row.className = 'param-row';
                    row.innerHTML = `
                        <input type="text" class="param-input" placeholder="Key">
                        <input type="text" class="param-input" placeholder="Value">
                        <button class="header-remove" onclick="removeParam(this)">x</button>
                    `;
                    paramsGrid.appendChild(row);
                }
            } catch (e) {
                document.getElementById('url').value = item.url;
            }

            document.getElementById('method').value = item.method;
            switchTab('params');
        }

        function clearHistory() {
            history = [];
            saveHistory();
            renderHistory();
        }

        // Enter key to send request
        document.getElementById('url').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendRequest();
            }
        });

        // Load history on page load
        loadHistory();
    </script>
