<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cURL Generator</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79b8ff;
            --success: #3fb950;
            --method-get: #3fb950;
            --method-post: #f0883e;
            --method-put: #58a6ff;
            --method-delete: #f85149;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            animation: slideUp 0.5s ease;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .url-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .method-select {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 120px;
            transition: all 0.2s;
        }

        .method-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .method-select.get { color: var(--method-get); }
        .method-select.post { color: var(--method-post); }
        .method-select.put { color: var(--method-put); }
        .method-select.delete { color: var(--method-delete); }

        .url-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Consolas', monospace;
            transition: all 0.2s;
        }

        .url-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .url-input::placeholder {
            color: var(--text-muted);
        }

        .headers-section {
            margin-bottom: 1.5rem;
        }

        .header-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            animation: slideUp 0.3s ease;
        }

        .header-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            color: var(--text);
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .header-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg);
            color: var(--text);
            border-color: var(--accent);
        }

        .btn-small {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.4rem 0.75rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-small:hover {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .body-section textarea {
            width: 100%;
            min-height: 150px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            color: var(--text);
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            resize: vertical;
            transition: all 0.2s;
        }

        .body-section textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .output-section {
            position: relative;
        }

        .output-code {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 120px;
            color: var(--text);
        }

        .btn-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: var(--bg);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tab-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tab {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            background: var(--bg);
        }

        .tab.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .url-row { flex-direction: column; }
            .method-select { min-width: 100%; }
            .header-row { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>cURL Generator</h1>
            <p class="subtitle">Build curl commands with ease</p>
        </header>

        <div class="card">
            <div class="url-row">
                <select class="method-select get" id="method">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                    <option value="HEAD">HEAD</option>
                </select>
                <input type="text" class="url-input" id="url" placeholder="https://api.example.com/endpoint">
            </div>

            <div class="tab-row">
                <button class="tab active" data-tab="headers">Headers</button>
                <button class="tab" data-tab="body">Body</button>
            </div>

            <div class="tab-content active" id="headers">
                <div class="headers-section">
                    <div id="headers-list">
                        <div class="header-row">
                            <input type="text" class="header-input header-key" placeholder="Header name (e.g., Content-Type)">
                            <input type="text" class="header-input header-value" placeholder="Value">
                            <button class="btn-icon" onclick="addHeader()">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="body">
                <div class="body-section">
                    <label>Request Body (JSON)</label>
                    <textarea id="body-content" placeholder='{"key": "value"}'></textarea>
                </div>
            </div>
        </div>

        <div class="card output-section">
            <label>Generated cURL Command</label>
            <div class="output-code" id="output">curl -X GET 'https://api.example.com/endpoint'</div>
            <div class="btn-row">
                <button class="btn" onclick="copyToClipboard()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                    </svg>
                    Copy to Clipboard
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>

    <script>
        const methodSelect = document.getElementById('method');
        const urlInput = document.getElementById('url');
        const bodyContent = document.getElementById('body-content');
        const output = document.getElementById('output');
        const headersList = document.getElementById('headers-list');
        const toast = document.getElementById('toast');

        methodSelect.addEventListener('change', updateMethodColor);
        urlInput.addEventListener('input', generateCurl);
        bodyContent.addEventListener('input', generateCurl);

        function updateMethodColor() {
            methodSelect.className = 'method-select ' + methodSelect.value.toLowerCase();
        }

        function addHeader(key = '', value = '') {
            const row = document.createElement('div');
            row.className = 'header-row';
            row.innerHTML = `
                <input type="text" class="header-input header-key" placeholder="Header name" value="${key}">
                <input type="text" class="header-input header-value" placeholder="Value" value="${value}">
                <button class="btn-icon" onclick="removeHeader(this)">−</button>
            `;
            row.querySelectorAll('input').forEach(i => i.addEventListener('input', generateCurl));
            headersList.appendChild(row);
            generateCurl();
        }

        function removeHeader(btn) {
            const rows = headersList.querySelectorAll('.header-row');
            if (rows.length > 1) {
                btn.parentElement.remove();
                generateCurl();
            }
        }

        function escapeString(str) {
            if (!str) return "''";
            if (/^[a-zA-Z0-9_./?-]+$/.test(str)) return str;
            return "'" + str.replace(/'/g, "'\\''") + "'";
        }

        function generateCurl() {
            const method = methodSelect.value;
            const url = urlInput.value.trim() || 'https://api.example.com/endpoint';

            let curl = `curl -X ${method} ${escapeString(url)}`;

            const rows = headersList.querySelectorAll('.header-row');
            rows.forEach(row => {
                const key = row.querySelector('.header-key').value.trim();
                const value = row.querySelector('.header-value').value.trim();
                if (key && value) {
                    curl += ` \\\n  -H ${escapeString(key + ': ' + value)}`;
                }
            });

            const body = bodyContent.value.trim();
            if (body && ['POST', 'PUT', 'PATCH'].includes(method)) {
                curl += ` \\\n  -d ${escapeString(body)}`;
            }

            output.textContent = curl;
        }

        function copyToClipboard() {
            navigator.clipboard.writeText(output.textContent).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function clearAll() {
            urlInput.value = '';
            bodyContent.value = '';
            headersList.innerHTML = `
                <div class="header-row">
                    <input type="text" class="header-input header-key" placeholder="Header name (e.g., Content-Type)">
                    <input type="text" class="header-input header-value" placeholder="Value">
                    <button class="btn-icon" onclick="addHeader()">+</button>
                </div>
            `;
            headersList.querySelectorAll('input').forEach(i => i.addEventListener('input', generateCurl));
            generateCurl();
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
            });
        });

        generateCurl();
    </script>
</body>
</html>
