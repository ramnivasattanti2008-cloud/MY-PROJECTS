<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntax Highlighter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; font-size: 1.8rem; }
        .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        select, button { padding: 10px 16px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #c9d1d9; cursor: pointer; font-size: 14px; }
        select:hover, button:hover { border-color: #58a6ff; }
        button { background: #238636; border-color: #238636; }
        button:hover { background: #2ea043; }
        button.copy-btn { background: #1f6feb; border-color: #1f6feb; }
        button.copy-btn:hover { background: #388bfd; }
        textarea { width: 100%; height: 200px; padding: 16px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; resize: vertical; margin-bottom: 16px; }
        textarea:focus { outline: none; border-color: #58a6ff; }
        .output { position: relative; }
        pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; overflow-x: auto; max-height: 400px; }
        pre code { font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; }
        .copy-feedback { position: absolute; top: 8px; right: 8px; background: #238636; color: white; padding: 4px 12px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.3s; }
        .copy-feedback.show { opacity: 1; }
        .label { margin-bottom: 6px; color: #8b949e; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Syntax Highlighter</h1>
        <div class="controls">
            <select id="language">
                <option value="javascript">JavaScript</option>
                <option value="python">Python</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="json">JSON</option>
                <option value="typescript">TypeScript</option>
                <option value="java">Java</option>
                <option value="cpp">C++</option>
                <option value="csharp">C#</option>
                <option value="php">PHP</option>
                <option value="ruby">Ruby</option>
                <option value="go">Go</option>
                <option value="rust">Rust</option>
                <option value="sql">SQL</option>
                <option value="bash">Bash</option>
                <option value="xml">XML</option>
                <option value="yaml">YAML</option>
                <option value="markdown">Markdown</option>
            </select>
            <button onclick="highlightCode()">Highlight</button>
            <button class="copy-btn" onclick="copyOutput()">Copy Output</button>
        </div>
        <div class="label">Paste your code:</div>
        <textarea id="input" placeholder="Paste your code here..."></textarea>
        <div class="label">Highlighted output:</div>
        <div class="output">
            <pre><code id="output"></code></pre>
            <div class="copy-feedback" id="feedback">Copied!</div>
        </div>
    </div>
    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const language = document.getElementById('language');
        const feedback = document.getElementById('feedback');

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = input.selectionStart;
                const end = input.selectionEnd;
                input.value = input.value.substring(0, start) + '  ' + input.value.substring(end);
                input.selectionStart = input.selectionEnd = start + 2;
            }
        });

        function highlightCode() {
            const code = input.value;
            if (!code.trim()) {
                output.textContent = '';
                return;
            }
            output.textContent = code;
            output.className = 'hljs language-' + language.value;
            hljs.highlightElement(output);
        }

        function copyOutput() {
            const text = output.textContent;
            navigator.clipboard.writeText(text).then(() => {
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 1500);
            });
        }

        highlightCode();
    </script>
</body>
</html>
