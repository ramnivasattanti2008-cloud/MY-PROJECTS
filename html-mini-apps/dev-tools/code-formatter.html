<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Formatter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 24px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; font-size: 1.8rem; }
        .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
        select { padding: 10px 12px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #c9d1d9; font-size: 14px; cursor: pointer; }
        select:hover { border-color: #58a6ff; }
        button { padding: 10px 16px; border: 1px solid #30363d; border-radius: 6px; background: #238636; color: #fff; cursor: pointer; font-size: 14px; }
        button:hover { background: #2ea043; }
        button.copy-btn { background: #1f6feb; border-color: #1f6feb; }
        button.copy-btn:hover { background: #388bfd; }
        .label { color: #8b949e; font-size: 13px; margin-bottom: 6px; }
        textarea { width: 100%; height: 180px; padding: 14px; border: 1px solid #30363d; border-radius: 6px; background: #0d1117; color: #c9d1d9; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; resize: vertical; }
        textarea:focus { outline: none; border-color: #58a6ff; }
        .output-section { margin-top: 20px; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        pre { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; font-family: 'Consolas', 'Monaco', monospace; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-x: auto; max-height: 500px; overflow-y: auto; }
        .copy-feedback { display: inline-block; background: #238636; color: white; padding: 6px 12px; border-radius: 4px; font-size: 12px; opacity: 0; transition: opacity 0.3s; }
        .copy-feedback.show { opacity: 1; }
        .options { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
        .option-group { display: flex; align-items: center; gap: 8px; }
        .option-group label { color: #8b949e; font-size: 13px; }
        input[type="number"] { width: 60px; padding: 6px 8px; border: 1px solid #30363d; border-radius: 4px; background: #0d1117; color: #c9d1d9; font-size: 13px; }
        input:focus { outline: none; border-color: #58a6ff; }
        .error { color: #f85149; font-size: 13px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Code Formatter</h1>
        <div class="controls">
            <select id="language">
                <option value="js">JavaScript</option>
                <option value="py">Python</option>
                <option value="html">HTML</option>
                <option value="css">CSS</option>
            </select>
            <button onclick="formatCode()">Format Code</button>
            <button class="copy-btn" onclick="copyOutput()">Copy Formatted</button>
        </div>
        <div class="options">
            <div class="option-group">
                <label>Indent:</label>
                <select id="indentType">
                    <option value="spaces">Spaces</option>
                    <option value="tabs">Tabs</option>
                </select>
            </div>
            <div class="option-group">
                <label>Size:</label>
                <input type="number" id="indentSize" value="2" min="1" max="8">
            </div>
            <div class="option-group">
                <label>Line Width:</label>
                <input type="number" id="lineWidth" value="80" min="40" max="200">
            </div>
        </div>
        <div class="label">Input:</div>
        <textarea id="input" placeholder="Paste your code here..."></textarea>
        <div class="output-section">
            <div class="output-header">
                <span class="label">Formatted Output:</span>
                <span class="copy-feedback" id="feedback">Copied!</span>
            </div>
            <pre id="output"></pre>
            <div class="error" id="error"></div>
        </div>
    </div>
    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const language = document.getElementById('language');
        const indentType = document.getElementById('indentType');
        const indentSize = document.getElementById('indentSize');
        const lineWidth = document.getElementById('lineWidth');
        const feedback = document.getElementById('feedback');
        const errorEl = document.getElementById('error');

        function getIndent() {
            return indentType.value === 'tabs' ? '\t' : ' '.repeat(parseInt(indentSize.value) || 2);
        }

        function formatJS(code) {
            try {
                const formatted = code
                    .replace(/\{/g, '{\n')
                    .replace(/\}/g, '}\n')
                    .replace(/;/g, ';\n')
                    .replace(/,\s*/g, ',\n')
                    .replace(/\(\s*/g, '(\n')
                    .replace(/\)\s*\{/g, ')\n{')
                    .replace(/\}\s*else/g, '}\nelse')
                    .replace(/\}\s*catch/g, '}\ncatch')
                    .replace(/\}\s*finally/g, '}\nfinally');

                const lines = formatted.split('\n');
                let indent = 0;
                const result = [];

                for (let line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    if (trimmed.startsWith('}')) {
                        indent = Math.max(0, indent - 1);
                    }

                    result.push(getIndent().repeat(indent) + trimmed);

                    if (trimmed.endsWith('{') || trimmed.endsWith('}') && !trimmed.includes('{}')) {
                        if (trimmed.includes('{}')) continue;
                    }
                    if (trimmed.endsWith('{')) {
                        indent++;
                    }
                }

                return result.join('\n');
            } catch (e) {
                throw new Error('JS formatting error: ' + e.message);
            }
        }

        function formatPython(code) {
            try {
                const lines = code.split('\n');
                let indent = 0;
                const indentStr = getIndent();
                const result = [];

                const indentTokens = [':', 'def ', 'class ', 'if ', 'elif ', 'else:', 'for ', 'while ', 'try:', 'except', 'finally:', 'with '];

                for (let line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) {
                        result.push('');
                        continue;
                    }

                    if (trimmed.startsWith('#')) {
                        result.push(getIndent().repeat(indent) + trimmed);
                        continue;
                    }

                    if (trimmed.startsWith(')') || trimmed.startsWith('}') || trimmed.startsWith(']')) {
                        indent = Math.max(0, indent - 1);
                    }

                    result.push(getIndent().repeat(indent) + trimmed);

                    if (trimmed.endsWith(':') || indentTokens.some(t => trimmed.startsWith(t) && trimmed !== t)) {
                        if (!trimmed.endsWith(',') && !trimmed.endsWith('\\')) {
                            indent++;
                        }
                    }
                }

                return result.join('\n');
            } catch (e) {
                throw new Error('Python formatting error: ' + e.message);
            }
        }

        function formatHTML(code) {
            try {
                let formatted = code
                    .replace(/>\s+</g, '><')
                    .replace(/></g, '>\n<');

                const lines = formatted.split('\n');
                let indent = 0;
                const indentStr = getIndent();
                const result = [];
                const voidTags = ['br', 'hr', 'img', 'input', 'meta', 'link', 'area', 'base', 'col', 'embed', 'param', 'source', 'track', 'wbr'];

                for (let line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    if (trimmed.startsWith('</')) {
                        indent = Math.max(0, indent - 1);
                    }

                    result.push(indentStr.repeat(indent) + trimmed);

                    if (trimmed.startsWith('<') && !trimmed.startsWith('</') && !trimmed.startsWith('<!') && !trimmed.endsWith('/>') && !voidTags.some(t => trimmed.startsWith('<' + t))) {
                        if (!trimmed.endsWith('</')) {
                            indent++;
                        }
                    }
                }

                return result.join('\n');
            } catch (e) {
                throw new Error('HTML formatting error: ' + e.message);
            }
        }

        function formatCSS(code) {
            try {
                let formatted = code
                    .replace(/\s*{\s*/g, ' {\n')
                    .replace(/\s*}\s*/g, '\n}\n')
                    .replace(/\s*;\s*/g, ';\n')
                    .replace(/:\s*/g, ': ')
                    .replace(/,\s*/g, ',\n');

                const lines = formatted.split('\n');
                let indent = 0;
                const indentStr = getIndent();
                const result = [];

                for (let line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    if (trimmed.startsWith('}')) {
                        indent = Math.max(0, indent - 1);
                    }

                    result.push(indentStr.repeat(indent) + trimmed);

                    if (trimmed.endsWith('{')) {
                        indent++;
                    }
                }

                return result.join('\n');
            } catch (e) {
                throw new Error('CSS formatting error: ' + e.message);
            }
        }

        function formatCode() {
            const code = input.value;
            const lang = language.value;
            const width = parseInt(lineWidth.value) || 80;

            errorEl.textContent = '';
            output.textContent = '';

            if (!code.trim()) {
                errorEl.textContent = 'Please enter some code to format.';
                return;
            }

            try {
                let formatted;
                switch (lang) {
                    case 'js': formatted = formatJS(code); break;
                    case 'py': formatted = formatPython(code); break;
                    case 'html': formatted = formatHTML(code); break;
                    case 'css': formatted = formatCSS(code); break;
                    default: formatted = code;
                }
                output.textContent = formatted;
            } catch (e) {
                errorEl.textContent = e.message;
            }
        }

        function copyOutput() {
            const text = output.textContent;
            if (!text) {
                errorEl.textContent = 'Nothing to copy. Format some code first.';
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                feedback.classList.add('show');
                setTimeout(() => feedback.classList.remove('show'), 1500);
            });
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = input.selectionStart;
                const end = input.selectionEnd;
                input.value = input.value.substring(0, start) + '  ' + input.value.substring(end);
                input.selectionStart = input.selectionEnd = start + 2;
            }
        });
    </script>
</body>
</html>
