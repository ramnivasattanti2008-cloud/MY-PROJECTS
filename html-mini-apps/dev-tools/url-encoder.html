<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Encoder/Decoder</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --border: #333;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--accent); }
    .mode-toggle {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .mode-btn:hover:not(.active) { background: var(--surface2); }
    .input-group { margin-bottom: 1rem; }
    .input-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .input-label span { font-size: 0.875rem; color: var(--text-dim); }
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 1rem;
      border-radius: var(--radius);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
      resize: vertical;
      min-height: 120px;
    }
    textarea:focus { outline: 2px solid var(--accent); }
    .action-row {
      display: flex;
      gap: 0.5rem;
      margin: 1rem 0;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn.secondary { background: var(--surface2); color: var(--text); }
    .btn.secondary:hover { background: var(--border); }
    .btn.danger { background: var(--danger); }
    .btn.danger:hover { opacity: 0.9; }
    .output-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-top: 1.5rem;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .output-header span { font-size: 0.875rem; color: var(--text-dim); }
    .output-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: var(--radius);
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 0.875rem;
      word-break: break-all;
      min-height: 80px;
    }
    .info-section {
      margin-top: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .info-section h3 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: var(--accent);
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
    }
    .info-item {
      background: var(--surface2);
      padding: 0.75rem;
      border-radius: var(--radius);
      text-align: center;
    }
    .info-item .char { font-size: 1.5rem; font-weight: bold; }
    .info-item .desc { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.25rem; }
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1.2rem;
    }
    .error-msg {
      color: var(--danger);
      font-size: 0.75rem;
      margin-top: 0.25rem;
      display: none;
    }
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">&#9728;</button>
  <div class="container">
    <h1>URL Encoder/Decoder</h1>

    <div class="mode-toggle">
      <button class="mode-btn active" id="encodeBtn" onclick="setMode('encode')">Encode</button>
      <button class="mode-btn" id="decodeBtn" onclick="setMode('decode')">Decode</button>
    </div>

    <div class="input-group">
      <div class="input-label">
        <span id="inputLabel">Enter text to encode</span>
        <span id="charCount">0 characters</span>
      </div>
      <textarea id="inputText" placeholder="Enter text here..." oninput="updateCharCount(); showPreview()"></textarea>
      <div class="error-msg" id="errorMsg">Invalid encoded string</div>
    </div>

    <div class="action-row">
      <button class="btn" onclick="process()" id="processBtn">Encode</button>
      <button class="btn secondary" onclick="swap()">Swap</button>
      <button class="btn secondary" onclick="clearAll()">Clear</button>
    </div>

    <div class="output-section">
      <div class="output-header">
        <span id="outputLabel">Encoded output</span>
        <button class="btn secondary" style="padding:0.5rem 1rem; font-size:0.75rem;" onclick="copyOutput()">Copy</button>
      </div>
      <div class="output-box" id="outputText">Output will appear here...</div>
    </div>

    <div class="info-section">
      <h3>Common URL Encodings</h3>
      <div class="info-grid">
        <div class="info-item"><div class="char">space</div><div class="desc">%20</div></div>
        <div class="info-item"><div class="char">!</div><div class="desc">%21</div></div>
        <div class="info-item"><div class="char">#</div><div class="desc">%23</div></div>
        <div class="info-item"><div class="char">$</div><div class="desc">%24</div></div>
        <div class="info-item"><div class="char">&</div><div class="desc">%26</div></div>
        <div class="info-item"><div class="char">=</div><div class="desc">%3D</div></div>
        <div class="info-item"><div class="char">?</div><div class="desc">%3F</div></div>
        <div class="info-item"><div class="char">@</div><div class="desc">%40</div></div>
        <div class="info-item"><div class="char">/</div><div class="desc">%2F</div></div>
        <div class="info-item"><div class="char">:</div><div class="desc">%3A</div></div>
        <div class="info-item"><div class="char">;</div><div class="desc">%3B</div></div>
        <div class="info-item"><div class="char">+</div><div class="desc">%2B</div></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const root = document.documentElement;
    let isDark = true;
    let mode = 'encode';

    function toggleTheme() {
      isDark = !isDark;
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.querySelector('.theme-toggle').innerHTML = isDark ? '&#9728;' : '&#9790;';
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('encodeBtn').classList.toggle('active', mode === 'encode');
      document.getElementById('decodeBtn').classList.toggle('active', mode === 'decode');
      document.getElementById('inputLabel').textContent = mode === 'encode' ? 'Enter text to encode' : 'Enter URL-encoded text to decode';
      document.getElementById('outputLabel').textContent = mode === 'encode' ? 'Encoded output' : 'Decoded output';
      document.getElementById('processBtn').textContent = mode === 'encode' ? 'Encode' : 'Decode';
      document.getElementById('inputText').placeholder = mode === 'encode' ? 'Enter text here...' : 'Enter encoded URL here...';
      showPreview();
    }

    function updateCharCount() {
      const text = document.getElementById('inputText').value;
      document.getElementById('charCount').textContent = `${text.length} character${text.length !== 1 ? 's' : ''}`;
    }

    function showPreview() {
      const input = document.getElementById('inputText').value;
      const output = document.getElementById('outputText');
      const errorMsg = document.getElementById('errorMsg');

      if (!input) {
        output.textContent = 'Output will appear here...';
        errorMsg.style.display = 'none';
        return;
      }

      try {
        if (mode === 'encode') {
          output.textContent = encodeURIComponent(input);
        } else {
          output.textContent = decodeURIComponent(input);
        }
        errorMsg.style.display = 'none';
      } catch (e) {
        errorMsg.style.display = 'block';
        output.textContent = 'Error: Invalid encoded string';
      }
    }

    function process() {
      const input = document.getElementById('inputText').value;
      const output = document.getElementById('outputText');
      const errorMsg = document.getElementById('errorMsg');

      if (!input) return;

      try {
        if (mode === 'encode') {
          output.textContent = encodeURIComponent(input);
        } else {
          output.textContent = decodeURIComponent(input);
        }
        errorMsg.style.display = 'none';
      } catch (e) {
        errorMsg.style.display = 'block';
        output.textContent = 'Error: Invalid encoded string';
      }
    }

    function swap() {
      const input = document.getElementById('inputText');
      const output = document.getElementById('outputText');

      if (output.textContent && !output.textContent.startsWith('Error') && output.textContent !== 'Output will appear here...') {
        input.value = output.textContent;
        setMode(mode === 'encode' ? 'decode' : 'encode');
        updateCharCount();
      }
    }

    function clearAll() {
      document.getElementById('inputText').value = '';
      document.getElementById('outputText').textContent = 'Output will appear here...';
      document.getElementById('errorMsg').style.display = 'none';
      updateCharCount();
    }

    function copyOutput() {
      const output = document.getElementById('outputText').textContent;
      if (output && output !== 'Output will appear here...' && !output.startsWith('Error:')) {
        navigator.clipboard.writeText(output).then(() => {
          const toast = document.getElementById('toast');
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2000);
        });
      }
    }

    // Handle paste events
    document.getElementById('inputText').addEventListener('paste', () => {
      setTimeout(showPreview, 0);
    });
  </script>
</body>
</html>
