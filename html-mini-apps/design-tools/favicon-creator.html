<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favicon Creator</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --accent: #f778ba;
            --accent-hover: #ff9bda;
            --success: #3fb950;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 0.6s ease;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a371f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            animation: slideUp 0.5s ease;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(247, 120, 186, 0.05);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .upload-text {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.7;
        }

        #fileInput {
            display: none;
        }

        .preview-row {
            display: flex;
            gap: 2rem;
            align-items: center;
            margin-top: 1.5rem;
        }

        .source-preview {
            flex-shrink: 0;
        }

        .source-preview img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .sizes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            flex: 1;
        }

        .size-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .size-canvas {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .size-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .options-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .option-group label {
            font-size: 0.75rem;
            margin-bottom: 0.3rem;
        }

        select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem;
            color: var(--text);
            font-size: 0.85rem;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .color-picker-wrapper {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        input[type="color"] {
            width: 40px;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            padding: 2px;
            background: var(--bg);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--success);
            color: var(--bg);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            .preview-row { flex-direction: column; }
            .sizes-grid { grid-template-columns: repeat(2, 1fr); }
            .options-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Favicon Creator</h1>
            <p class="subtitle">Generate favicons in all required sizes from an image</p>
        </header>

        <div class="card">
            <label>Upload Image</label>
            <div class="upload-area" id="uploadArea">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p class="upload-text">Drop an image here or click to browse</p>
                <p class="upload-hint">Supports PNG, JPG, SVG (max 5MB)</p>
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="card" id="optionsCard" style="display: none;">
            <label>Options</label>
            <div class="options-section">
                <div class="option-group">
                    <label>Background</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="bgColor" value="#0d1117">
                        <select id="bgMode">
                            <option value="none">Transparent</option>
                            <option value="color">Solid Color</option>
                        </select>
                    </div>
                </div>
                <div class="option-group">
                    <label>Shape</label>
                    <select id="shape">
                        <option value="square">Square</option>
                        <option value="circle">Circle</option>
                        <option value="rounded">Rounded</option>
                    </select>
                </div>
                <div class="option-group">
                    <label>Padding</label>
                    <select id="padding">
                        <option value="0">None</option>
                        <option value="5">Small</option>
                        <option value="10" selected>Medium</option>
                        <option value="15">Large</option>
                    </select>
                </div>
            </div>

            <label>Preview & Sizes</label>
            <div class="preview-row">
                <div class="source-preview">
                    <img id="sourceImg" alt="Source">
                </div>
                <div class="sizes-grid" id="sizesGrid"></div>
            </div>

            <div class="btn-row">
                <button class="btn" id="downloadIco">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download ICO
                </button>
                <button class="btn btn-secondary" id="downloadPng">
                    Download All PNGs
                </button>
                <button class="btn btn-secondary" onclick="resetUpload()">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Downloaded successfully!</div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const optionsCard = document.getElementById('optionsCard');
        const sourceImg = document.getElementById('sourceImg');
        const sizesGrid = document.getElementById('sizesGrid');
        const toast = document.getElementById('toast');
        const bgMode = document.getElementById('bgMode');
        const bgColor = document.getElementById('bgColor');
        const shape = document.getElementById('shape');
        const padding = document.getElementById('padding');

        const sizes = [16, 32, 48, 64, 128, 256];
        let sourceImage = null;

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', e => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                loadImage(file);
            }
        });

        fileInput.addEventListener('change', e => {
            if (e.target.files[0]) {
                loadImage(e.target.files[0]);
            }
        });

        [bgMode, bgColor, shape, padding].forEach(el => {
            el.addEventListener('change', renderAllSizes);
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = e => {
                sourceImage = new Image();
                sourceImage.onload = () => {
                    sourceImg.src = e.target.result;
                    optionsCard.style.display = 'block';
                    renderAllSizes();
                };
                sourceImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderAllSizes() {
            sizesGrid.innerHTML = '';
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const paddingVal = parseInt(padding.value);
                const drawSize = size - (paddingVal * 2);
                const offset = paddingVal;

                if (bgMode.value === 'color') {
                    ctx.fillStyle = bgColor.value;
                    ctx.fillRect(0, 0, size, size);
                }

                if (shape.value === 'circle') {
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.closePath();
                    if (bgMode.value === 'color') {
                        ctx.fill();
                    }
                    ctx.clip();
                } else if (shape.value === 'rounded') {
                    const r = size * 0.15;
                    ctx.beginPath();
                    ctx.moveTo(r, 0);
                    ctx.lineTo(size - r, 0);
                    ctx.quadraticCurveTo(size, 0, size, r);
                    ctx.lineTo(size, size - r);
                    ctx.quadraticCurveTo(size, size, size - r, size);
                    ctx.lineTo(r, size);
                    ctx.quadraticCurveTo(0, size, 0, size - r);
                    ctx.lineTo(0, r);
                    ctx.quadraticCurveTo(0, 0, r, 0);
                    ctx.closePath();
                    if (bgMode.value === 'color') {
                        ctx.fill();
                    }
                    ctx.clip();
                }

                const scale = Math.min(drawSize / sourceImage.width, drawSize / sourceImage.height);
                const imgW = sourceImage.width * scale;
                const imgH = sourceImage.height * scale;
                const x = offset + (drawSize - imgW) / 2;
                const y = offset + (drawSize - imgH) / 2;

                ctx.drawImage(sourceImage, x, y, imgW, imgH);

                const previewCanvas = document.createElement('canvas');
                previewCanvas.width = 64;
                previewCanvas.height = 64;
                const previewCtx = previewCanvas.getContext('2d');
                previewCtx.drawImage(canvas, 0, 0, 64, 64);

                const item = document.createElement('div');
                item.className = 'size-item';
                item.innerHTML = `
                    <canvas class="size-canvas" width="64" height="64" data-size="${size}" data-url="${canvas.toDataURL('image/png')}"></canvas>
                    <span class="size-label">${size}x${size}</span>
                `;
                item.querySelector('canvas').addEventListener('click', () => downloadSingle(size, canvas));
                sizesGrid.appendChild(item);

                const existing = sizesGrid.querySelector(`[data-size="${size}"]`);
                if (existing) {
                    const ctx2 = existing.getContext('2d');
                    ctx2.clearRect(0, 0, 64, 64);
                    ctx2.drawImage(canvas, 0, 0, 64, 64);
                }
            });
        }

        function downloadSingle(size, canvas) {
            const link = document.createElement('a');
            link.download = `favicon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast();
        }

        document.getElementById('downloadPng').addEventListener('click', () => {
            sizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const paddingVal = parseInt(padding.value);
                const drawSize = size - (paddingVal * 2);
                const offset = paddingVal;

                if (bgMode.value === 'color') {
                    ctx.fillStyle = bgColor.value;
                    ctx.fillRect(0, 0, size, size);
                }

                if (shape.value === 'circle') {
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
                    ctx.closePath();
                    if (bgMode.value === 'color') {
                        ctx.fill();
                    }
                    ctx.clip();
                } else if (shape.value === 'rounded') {
                    const r = size * 0.15;
                    ctx.beginPath();
                    ctx.moveTo(r, 0);
                    ctx.lineTo(size - r, 0);
                    ctx.quadraticCurveTo(size, 0, size, r);
                    ctx.lineTo(size, size - r);
                    ctx.quadraticCurveTo(size, size, size - r, size);
                    ctx.lineTo(r, size);
                    ctx.quadraticCurveTo(0, size, 0, size - r);
                    ctx.lineTo(0, r);
                    ctx.quadraticCurveTo(0, 0, r, 0);
                    ctx.closePath();
                    if (bgMode.value === 'color') {
                        ctx.fill();
                    }
                    ctx.clip();
                }

                const scale = Math.min(drawSize / sourceImage.width, drawSize / sourceImage.height);
                const imgW = sourceImage.width * scale;
                const imgH = sourceImage.height * scale;
                const x = offset + (drawSize - imgW) / 2;
                const y = offset + (drawSize - imgH) / 2;

                ctx.drawImage(sourceImage, x, y, imgW, imgH);

                setTimeout(() => {
                    const link = document.createElement('a');
                    link.download = `favicon-${size}x${size}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }, size * 10);
            });
            setTimeout(showToast, 500);
        });

        document.getElementById('downloadIco').addEventListener('click', () => {
            const canvas256 = document.createElement('canvas');
            canvas256.width = 256;
            canvas256.height = 256;
            const ctx = canvas256.getContext('2d');

            const paddingVal = parseInt(padding.value);
            const drawSize = 256 - (paddingVal * 2);
            const offset = paddingVal;

            if (bgMode.value === 'color') {
                ctx.fillStyle = bgColor.value;
                ctx.fillRect(0, 0, 256, 256);
            }

            if (shape.value === 'circle') {
                ctx.beginPath();
                ctx.arc(128, 128, 128, 0, Math.PI * 2);
                ctx.closePath();
                if (bgMode.value === 'color') ctx.fill();
                ctx.clip();
            } else if (shape.value === 'rounded') {
                const r = 38;
                ctx.beginPath();
                ctx.moveTo(r, 0);
                ctx.lineTo(256 - r, 0);
                ctx.quadraticCurveTo(256, 0, 256, r);
                ctx.lineTo(256, 256 - r);
                ctx.quadraticCurveTo(256, 256, 256 - r, 256);
                ctx.lineTo(r, 256);
                ctx.quadraticCurveTo(0, 256, 0, 256 - r);
                ctx.lineTo(0, r);
                ctx.quadraticCurveTo(0, 0, r, 0);
                ctx.closePath();
                if (bgMode.value === 'color') ctx.fill();
                ctx.clip();
            }

            const scale = Math.min(drawSize / sourceImage.width, drawSize / sourceImage.height);
            const imgW = sourceImage.width * scale;
            const imgH = sourceImage.height * scale;
            const x = offset + (drawSize - imgW) / 2;
            const y = offset + (drawSize - imgH) / 2;

            ctx.drawImage(sourceImage, x, y, imgW, imgH);

            const link = document.createElement('a');
            link.download = 'favicon.ico';
            link.href = canvas256.toDataURL('image/png');
            link.click();
            showToast();
        });

        function resetUpload() {
            sourceImage = null;
            sourceImg.src = '';
            optionsCard.style.display = 'none';
            fileInput.value = '';
            sizesGrid.innerHTML = '';
        }

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
