<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Variables Generator</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #252525;
      --border: #333;
      --text: #e0e0e0;
      --text-dim: #888;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --success: #22c55e;
      --radius: 8px;
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --surface: #fff;
      --surface2: #f0f0f0;
      --border: #ddd;
      --text: #1a1a1a;
      --text-dim: #666;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      line-height: 1.6;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: var(--accent); }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .tab {
      padding: 0.5rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tab:hover:not(.active) { background: var(--surface2); }
    .panel { display: none; }
    .panel.active { display: block; }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .color-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
    }
    .color-item label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .color-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    input[type="color"] {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      background: none;
    }
    input[type="text"] {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem;
      border-radius: var(--radius);
      font-family: 'Consolas', monospace;
      font-size: 0.875rem;
    }
    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .preview-card h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    .preview-card p { font-size: 0.875rem; color: var(--text-dim); }
    .preview-card button {
      margin-top: 1rem;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 1rem;
      border-radius: var(--radius);
      font-family: 'Consolas', monospace;
      font-size: 0.8rem;
      resize: vertical;
      min-height: 300px;
    }
    textarea:focus { outline: 2px solid var(--accent); }
    button.copy-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      margin: 1rem 0;
      transition: background 0.2s;
    }
    button.copy-btn:hover { background: var(--accent-hover); }
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.5rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 1.2rem;
    }
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">&#9728;</button>
  <div class="container">
    <h1>CSS Variables Generator</h1>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('dark')">Dark Theme</button>
      <button class="tab" onclick="switchTab('light')">Light Theme</button>
    </div>

    <div id="dark-panel" class="panel active">
      <div class="color-grid">
        <div class="color-item">
          <label>Background</label>
          <div class="color-row">
            <input type="color" value="#0f0f0f" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#0f0f0f" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Surface</label>
          <div class="color-row">
            <input type="color" value="#1a1a1a" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#1a1a1a" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Surface 2</label>
          <div class="color-row">
            <input type="color" value="#252525" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#252525" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Border</label>
          <div class="color-row">
            <input type="color" value="#333333" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#333333" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Text</label>
          <div class="color-row">
            <input type="color" value="#e0e0e0" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#e0e0e0" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Text Dim</label>
          <div class="color-row">
            <input type="color" value="#888888" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#888888" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Accent</label>
          <div class="color-row">
            <input type="color" value="#6366f1" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#6366f1" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Accent Hover</label>
          <div class="color-row">
            <input type="color" value="#818cf8" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#818cf8" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
      </div>
    </div>

    <div id="light-panel" class="panel">
      <div class="color-grid">
        <div class="color-item">
          <label>Background</label>
          <div class="color-row">
            <input type="color" value="#f5f5f5" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#f5f5f5" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Surface</label>
          <div class="color-row">
            <input type="color" value="#ffffff" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#ffffff" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Surface 2</label>
          <div class="color-row">
            <input type="color" value="#f0f0f0" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#f0f0f0" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Border</label>
          <div class="color-row">
            <input type="color" value="#dddddd" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#dddddd" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Text</label>
          <div class="color-row">
            <input type="color" value="#1a1a1a" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#1a1a1a" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Text Dim</label>
          <div class="color-row">
            <input type="color" value="#666666" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#666666" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Accent</label>
          <div class="color-row">
            <input type="color" value="#6366f1" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#6366f1" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
        <div class="color-item">
          <label>Accent Hover</label>
          <div class="color-row">
            <input type="color" value="#4f46e5" onchange="updatePreview(); generateCSS()">
            <input type="text" value="#4f46e5" onchange="updateFromText(this); generateCSS()">
          </div>
        </div>
      </div>
    </div>

    <div class="preview-card" id="preview-card">
      <h3 style="color: var(--text);">Preview Card</h3>
      <p style="color: var(--text-dim);">This is how your theme colors will look. Edit the values above to customize.</p>
      <button>Sample Button</button>
    </div>

    <button class="copy-btn" onclick="copyCSS()">Copy CSS Variables</button>
    <textarea id="css-output" readonly></textarea>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    const root = document.documentElement;
    let isDark = true;

    function toggleTheme() {
      isDark = !isDark;
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.querySelector('.theme-toggle').innerHTML = isDark ? '&#9728;' : '&#9790;';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(`${tab}-panel`).classList.add('active');
    }

    function updateFromText(input) {
      const colorItem = input.closest('.color-item');
      const colorPicker = colorItem.querySelector('input[type="color"]');
      if (/^#[0-9a-fA-F]{6}$/.test(input.value)) {
        colorPicker.value = input.value;
        updatePreview();
      }
    }

    function updatePreview() {
      const activePanel = document.querySelector('.panel.active');
      const colors = {};
      activePanel.querySelectorAll('.color-item').forEach(item => {
        const label = item.querySelector('label').textContent.toLowerCase().replace(' ', '-');
        const colorPicker = item.querySelector('input[type="color"]');
        const textInput = item.querySelector('input[type="text"]');
        colors[label] = colorPicker.value;
        textInput.value = colorPicker.value;
      });

      const map = {
        'background': '--bg',
        'surface': '--surface',
        'surface-2': '--surface2',
        'border': '--border',
        'text': '--text',
        'text-dim': '--text-dim',
        'accent': '--accent',
        'accent-hover': '--accent-hover'
      };

      Object.entries(colors).forEach(([name, value]) => {
        if (map[name]) {
          root.style.setProperty(map[name], value);
        }
      });
    }

    function generateCSS() {
      const darkPanel = document.getElementById('dark-panel');
      const lightPanel = document.getElementById('light-panel');

      const getColors = (panel) => {
        const colors = {};
        panel.querySelectorAll('.color-item').forEach(item => {
          const label = item.querySelector('label').textContent.toLowerCase().replace(' ', '-');
          const colorPicker = item.querySelector('input[type="color"]');
          colors[label] = colorPicker.value;
        });
        return colors;
      };

      const darkColors = getColors(darkPanel);
      const lightColors = getColors(lightPanel);

      const map = {
        'background': '--bg',
        'surface': '--surface',
        'surface-2': '--surface2',
        'border': '--border',
        'text': '--text',
        'text-dim': '--text-dim',
        'accent': '--accent',
        'accent-hover': '--accent-hover'
      };

      let css = ':root {\n';
      Object.entries(darkColors).forEach(([name, value]) => {
        css += `  ${map[name]}: ${value};\n`;
      });
      css += '}\n\n';
      css += '[data-theme="light"] {\n';
      Object.entries(lightColors).forEach(([name, value]) => {
        css += `  ${map[name]}: ${value};\n`;
      });
      css += '}';

      document.getElementById('css-output').value = css;
    }

    function copyCSS() {
      navigator.clipboard.writeText(document.getElementById('css-output').value).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    generateCSS();
  </script>
</body>
</html>
