<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 2rem; color: #f59e0b; }
    .search-box { position: relative; margin-bottom: 2rem; }
    .search-box input { width: 100%; background: #1c1c1c; border: 1px solid #3f3f46; border-radius: 12px; color: #fff; padding: 1rem 1rem 1rem 3rem; font-size: 1.1rem; }
    .search-box input:focus { outline: none; border-color: #f59e0b; }
    .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); font-size: 1.25rem; }
    .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 0.5rem; }
    .emoji-card { background: #1c1c1c; border-radius: 8px; padding: 0.75rem; text-align: center; cursor: pointer; transition: all 0.2s; }
    .emoji-card:hover { background: #27272a; transform: scale(1.1); }
    .emoji-char { font-size: 2rem; margin-bottom: 0.25rem; }
    .emoji-name { font-size: 0.65rem; color: #a1a1aa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 0.75rem 1.5rem; border-radius: 8px; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
    .no-results { text-align: center; padding: 3rem; color: #a1a1aa; }
    .count { text-align: center; color: #a1a1aa; margin-bottom: 1rem; }
  </style>
</head>

    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const count = document.getElementById('count');
    const noResults = document.getElementById('noResults');
    const toast = document.getElementById('toast');

    function render(emojis) {
      count.textContent = `${emojis.length} emojis`;
      grid.innerHTML = emojis.map(e => `<div class="emoji-card" onclick="copy('${e.emoji}')"><div class="emoji-char">${e.emoji}</div><div class="emoji-name">${e.name}</div></div>`).join('');
      noResults.style.display = emojis.length === 0 ? 'block' : 'none';
    }

    function copy(emoji) {
      const txt = document.createElement('textarea');
      txt.value = emoji;
      document.body.appendChild(txt);
      txt.select();
      document.execCommand('copy');
      document.body.removeChild(txt);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      const filtered = emojis.filter(e => e.name.toLowerCase().includes(q) || e.keywords.toLowerCase().includes(q));
      render(filtered);
    });

    render(emojis);
  </script>
