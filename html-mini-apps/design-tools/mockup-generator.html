<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Generator</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border: #30363d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
        h1 { font-size: 1.5rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .controls { display: flex; gap: 12px; align-items: center; }
        .device-select { display: flex; gap: 4px; background: var(--bg-secondary); padding: 4px; border-radius: 8px; }
        .device-btn { padding: 8px 16px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; border-radius: 6px; font-size: 0.9rem; transition: all 0.2s; display: flex; align-items: center; gap: 6px; }
        .device-btn.active { background: var(--bg-tertiary); color: var(--text-primary); }
        .device-btn:hover:not(.active) { color: var(--text-primary); }
        .upload-area { border: 2px dashed var(--border); border-radius: 12px; padding: 40px; text-align: center; transition: all 0.2s; cursor: pointer; margin-bottom: 30px; }
        .upload-area:hover { border-color: var(--accent); background: rgba(88, 166, 255, 0.05); }
        .upload-area.dragover { border-color: var(--accent); background: rgba(88, 166, 255, 0.1); }
        .upload-icon { width: 48px; height: 48px; margin: 0 auto 16px; color: var(--text-secondary); }
        .upload-text { font-size: 1rem; color: var(--text-secondary); }
        .upload-text span { color: var(--accent); }
        .upload-hint { font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px; }
        #imageInput { display: none; }
        .preview-area { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 40px; padding: 40px; background: var(--bg-secondary); border-radius: 16px; min-height: 400px; }
        .mockup-wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .mockup-container { position: relative; transform-origin: center top; }
        .mockup-container.transformed { transition: transform 0.3s ease; }

        /* iPhone Mockup */
        .iphone-frame {
            background: #1a1a1a;
            border-radius: 40px;
            padding: 12px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 0 0 2px #333;
            position: relative;
        }
        .iphone-notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 28px;
            background: #1a1a1a;
            border-radius: 0 0 16px 16px;
            z-index: 10;
        }
        .iphone-screen {
            border-radius: 32px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 9/19.5;
            width: 270px;
        }
        .iphone-screen img { width: 100%; height: 100%; object-fit: cover; }
        .iphone-button {
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 80px;
            background: #333;
            border-radius: 0 2px 2px 0;
        }
        .iphone-mute {
            position: absolute;
            left: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 40px;
            background: #333;
            border-radius: 2px 0 0 2px;
        }
        .iphone-volume-up {
            position: absolute;
            left: -3px;
            top: calc(50% - 60px);
            width: 4px;
            height: 30px;
            background: #333;
            border-radius: 2px 0 0 2px;
        }
        .iphone-volume-down {
            position: absolute;
            left: -3px;
            top: calc(50% - 20px);
            width: 4px;
            height: 30px;
            background: #333;
            border-radius: 2px 0 0 2px;
        }

        /* MacBook Mockup */
        .macbook-frame {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 12px 12px 0 0;
            padding: 12px 12px 0;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            position: relative;
        }
        .macbook-camera {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
        }
        .macbook-screen {
            border-radius: 4px 4px 0 0;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/10;
            width: 600px;
        }
        .macbook-screen img { width: 100%; height: 100%; object-fit: cover; }
        .macbook-base {
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
            height: 12px;
            border-radius: 0 0 8px 8px;
            position: relative;
        }
        .macbook-base::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #555, transparent);
            border-radius: 2px;
        }
        .macbook-notch {
            display: none;
        }

        /* iPad Mockup */
        .ipad-frame {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4), inset 0 0 0 2px #333;
        }
        .ipad-camera {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #333;
            border-radius: 50%;
        }
        .ipad-screen {
            border-radius: 4px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            width: 400px;
        }
        .ipad-screen img { width: 100%; height: 100%; object-fit: cover; }

        /* Foldable Mockup */
        .foldable-frame {
            background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
            border-radius: 20px;
            padding: 8px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            display: flex;
            gap: 4px;
        }
        .foldable-screen {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
        }
        .foldable-screen img { width: 100%; height: 100%; object-fit: cover; }
        .foldable-left, .foldable-right {
            width: 160px;
            aspect-ratio: 9/16;
        }
        .foldable-fold {
            width: 4px;
            background: #333;
            border-radius: 2px;
        }

        .mockup-label { font-size: 0.85rem; color: var(--text-secondary); text-align: center; }
        .scale-control { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
        .scale-control label { font-size: 0.85rem; color: var(--text-secondary); }
        .scale-slider { width: 120px; accent-color: var(--accent); }
        .scale-value { font-family: 'Cascadia Code', monospace; font-size: 0.85rem; min-width: 45px; }
        .download-btn { padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .download-btn:hover { filter: brightness(1.1); }
        .mockup-actions { display: flex; gap: 8px; }

        @media (max-width: 768px) {
            .preview-area { padding: 20px; gap: 30px; }
            .macbook-screen { width: 100%; max-width: 400px; }
            .ipad-screen { width: 280px; }
            .iphone-screen { width: 200px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg> Mockup Generator</h1>
            <div class="controls">
                <div class="device-select">
                    <button class="device-btn active" data-device="iphone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/></svg> iPhone</button>
                    <button class="device-btn" data-device="macbook"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M1 17h22"/></svg> MacBook</button>
                    <button class="device-btn" data-device="ipad"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/></svg> iPad</button>
                    <button class="device-btn" data-device="foldable"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v16H4zM14 4h6v16h-6z"/></svg> Fold</button>
                </div>
            </div>
        </header>

        <div class="upload-area" id="uploadArea">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <div class="upload-text">Drop your screenshot here or <span>browse</span></div>
            <div class="upload-hint">Supports PNG, JPG, WebP</div>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="preview-area" id="previewArea">
            <div class="mockup-wrapper">
                <div class="mockup-container transformed" id="mockupContainer">
                    <div class="iphone-frame" id="deviceFrame">
                        <div class="iphone-notch"></div>
                        <div class="iphone-button"></div>
                        <div class="iphone-mute"></div>
                        <div class="iphone-volume-up"></div>
                        <div class="iphone-volume-down"></div>
                        <div class="iphone-screen">
                            <img id="previewImage" src="" alt="Preview">
                        </div>
                    </div>
                </div>
                <div class="scale-control">
                    <label>Scale:</label>
                    <input type="range" class="scale-slider" id="scaleSlider" min="50" max="150" value="100">
                    <span class="scale-value" id="scaleValue">100%</span>
                </div>
                <div class="mockup-label" id="mockupLabel">iPhone 15 Pro</div>
                <div class="mockup-actions">
                    <button class="download-btn" id="downloadBtn">Download PNG</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const imageInput = document.getElementById('imageInput');
        const previewImage = document.getElementById('previewImage');
        const mockupContainer = document.getElementById('mockupContainer');
        const deviceFrame = document.getElementById('deviceFrame');
        const scaleSlider = document.getElementById('scaleSlider');
        const scaleValue = document.getElementById('scaleValue');
        const mockupLabel = document.getElementById('mockupLabel');
        const downloadBtn = document.getElementById('downloadBtn');
        const deviceBtns = document.querySelectorAll('.device-btn');

        let currentDevice = 'iphone';
        let currentScale = 100;

        const deviceConfigs = {
            iphone: {
                frameClass: 'iphone-frame',
                label: 'iPhone 15 Pro',
                scale: 100,
                extraElements: `
                    <div class="iphone-notch"></div>
                    <div class="iphone-button"></div>
                    <div class="iphone-mute"></div>
                    <div class="iphone-volume-up"></div>
                    <div class="iphone-volume-down"></div>
                `,
                screenClass: 'iphone-screen'
            },
            macbook: {
                frameClass: 'macbook-frame',
                label: 'MacBook Pro 14"',
                scale: 60,
                extraElements: `
                    <div class="macbook-camera"></div>
                `,
                screenClass: 'macbook-screen'
            },
            ipad: {
                frameClass: 'ipad-frame',
                label: 'iPad Pro 12.9"',
                scale: 80,
                extraElements: `
                    <div class="ipad-camera"></div>
                `,
                screenClass: 'ipad-screen'
            },
            foldable: {
                frameClass: 'foldable-frame',
                label: 'Samsung Galaxy Fold',
                scale: 100,
                extraElements: '',
                screenHTML: `
                    <div class="foldable-screen">
                        <div class="foldable-left">
                            <img id="previewImage" src="" alt="Preview">
                        </div>
                        <div class="foldable-fold"></div>
                        <div class="foldable-right">
                            <img id="previewImageRight" src="" alt="Preview">
                        </div>
                    </div>
                `
            }
        };

        function handleImage(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                const rightImage = document.getElementById('previewImageRight');
                if (rightImage) rightImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        uploadArea.addEventListener('click', () => imageInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            handleImage(file);
        });
        imageInput.addEventListener('change', (e) => {
            handleImage(e.target.files[0]);
        });

        deviceBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                deviceBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDevice = btn.dataset.device;
                applyDevice();
            });
        });

        function applyDevice() {
            const config = deviceConfigs[currentDevice];
            mockupLabel.textContent = config.label;
            scaleSlider.value = config.scale;
            currentScale = config.scale;
            scaleValue.textContent = config.scale + '%';
            mockupContainer.style.transform = `scale(${config.scale / 100})`;

            if (currentDevice === 'foldable') {
                deviceFrame.innerHTML = config.screenHTML;
                deviceFrame.className = config.frameClass;
                const rightImage = document.getElementById('previewImageRight');
                if (rightImage && previewImage.src) {
                    rightImage.src = previewImage.src;
                }
            } else {
                deviceFrame.className = config.frameClass;
                const screenDiv = deviceFrame.querySelector('.iphone-screen, .macbook-screen, .ipad-screen, .foldable-screen');
                if (screenDiv) {
                    screenDiv.className = config.screenClass;
                } else {
                    const newScreen = document.createElement('div');
                    newScreen.className = config.screenClass;
                    newScreen.innerHTML = `<img id="previewImage" src="${previewImage.src}" alt="Preview">`;
                    deviceFrame.innerHTML = config.extraElements;
                    deviceFrame.appendChild(newScreen);
                }
            }
        }

        scaleSlider.addEventListener('input', (e) => {
            currentScale = parseInt(e.target.value);
            scaleValue.textContent = currentScale + '%';
            mockupContainer.style.transform = `scale(${currentScale / 100})`;
        });

        downloadBtn.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                const scaleFactor = 2;
                canvas.width = deviceFrame.offsetWidth * scaleFactor;
                canvas.height = deviceFrame.offsetHeight * scaleFactor;

                ctx.scale(scaleFactor, scaleFactor);
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const svgData = new XMLSerializer().serializeToString(deviceFrame);
                const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(svgBlob);

                const img2 = new Image();
                img2.onload = () => {
                    ctx.drawImage(img2, 0, 0);
                    URL.revokeObjectURL(url);

                    const link = document.createElement('a');
                    link.download = `mockup-${currentDevice}-${Date.now()}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                };
                img2.src = url;
            };
            img.src = previewImage.src;
        });

        // Initialize with default image
        previewImage.src = 'data:image/svg+xml,' + encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" width="270" height="585" viewBox="0 0 270 585">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#6366f1"/>
                        <stop offset="100%" style="stop-color:#8b5cf6"/>
                    </linearGradient>
                </defs>
                <rect width="270" height="585" fill="url(#bg)"/>
                <rect x="20" y="100" width="230" height="40" rx="8" fill="rgba(255,255,255,0.2)"/>
                <rect x="20" y="160" width="230" height="120" rx="8" fill="rgba(255,255,255,0.15)"/>
                <rect x="20" y="300" width="105" height="100" rx="8" fill="rgba(255,255,255,0.15)"/>
                <rect x="135" y="300" width="115" height="100" rx="8" fill="rgba(255,255,255,0.15)"/>
                <circle cx="135" cy="200" r="30" fill="rgba(255,255,255,0.3)"/>
                <text x="135" y="205" text-anchor="middle" fill="white" font-size="14" font-family="system-ui">Your</text>
                <text x="135" y="220" text-anchor="middle" fill="white" font-size="14" font-family="system-ui">Screenshot</text>
            </svg>
        `);
    </script>
</body>
</html>
