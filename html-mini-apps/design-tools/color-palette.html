<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Extractor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; padding: 2rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 2rem; color: #a855f7; }
    .upload-area { border: 2px dashed #3f3f46; border-radius: 12px; padding: 3rem; text-align: center; cursor: pointer; transition: border-color 0.2s; margin-bottom: 2rem; }
    .upload-area:hover { border-color: #a855f7; }
    .upload-area input { display: none; }
    .upload-icon { font-size: 3rem; margin-bottom: 1rem; }
    .preview { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 2rem; display: none; }
    .palette { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 2rem; }
    .color-card { background: #1c1c1c; border-radius: 8px; overflow: hidden; width: 120px; cursor: pointer; transition: transform 0.2s; }
    .color-card:hover { transform: scale(1.05); }
    .color-swatch { height: 80px; }
    .color-info { padding: 0.5rem; text-align: center; }
    .color-hex { font-family: monospace; font-size: 0.85rem; }
    .color-rgb { font-size: 0.7rem; color: #a1a1aa; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #22c55e; color: #fff; padding: 0.75rem 1.5rem; border-radius: 8px; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Color Palette Extractor</h1>
    <div class="upload-area" id="uploadArea">
      <div class="upload-icon">🎨</div>
      <p>Click or drag an image to extract colors</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
    <img id="preview" class="preview" alt="Preview">
    <div class="palette" id="palette"></div>
  </div>
  <div class="toast" id="toast">Copied!</div>
  <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const palette = document.getElementById('palette');
    const toast = document.getElementById('toast');

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#a855f7'; });
    uploadArea.addEventListener('dragleave', () => uploadArea.style.borderColor = '#3f3f46'; });
    uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.style.borderColor = '#3f3f46'; handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.style.display = 'block';
      extractColors(url);
    }

    function extractColors(src) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const scale = Math.min(150 / img.width, 150 / img.height);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        const colorCounts = {};
        for (let i = 0; i < data.length; i += 4) {
          const r = Math.round(data[i] / 32) * 32;
          const g = Math.round(data[i + 1] / 32) * 32;
          const b = Math.round(data[i + 2] / 32) * 32;
          const key = `${r},${g},${b}`;
          colorCounts[key] = (colorCounts[key] || 0) + 1;
        }
        const sorted = Object.entries(colorCounts).sort((a, b) => b[1] - a[1]).slice(0, 8);
        palette.innerHTML = sorted.map(([key]) => {
          const [r, g, b] = key.split(',').map(Number);
          const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
          return `<div class="color-card" onclick="copyColor('${hex}')"><div class="color-swatch" style="background:${hex}"></div><div class="color-info"><div class="color-hex">${hex.toUpperCase()}</div><div class="color-rgb">RGB(${r},${g},${b})</div></div></div>`;
        }).join('');
      };
      img.src = src;
    }

    function copyColor(hex) {
      navigator.clipboard.writeText(hex);
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }
  </script>
</body>
</html>
