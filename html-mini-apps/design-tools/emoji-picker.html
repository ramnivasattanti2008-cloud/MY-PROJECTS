<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Emoji Picker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0d0d0d; --card: #1a1a1a; --border: #2a2a2a;
            --text: #e0e0e0; --text-dim: #888; --accent: #6366f1;
            --success: #22c55e; --hover: #252525;
        }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0 20px; }
        h1 { font-size: 2rem; margin-bottom: 8px; background: linear-gradient(135deg, #f472b6, #a78bfa, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-dim); }
        .search-box { position: relative; margin: 20px 0; }
        .search-box input { width: 100%; padding: 14px 20px 14px 50px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); font-size: 1rem; transition: border-color 0.2s; }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .search-box svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--success); color: #000; padding: 12px 24px; border-radius: 8px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .cat-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); color: var(--text); cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
        .cat-btn:hover { background: var(--hover); border-color: var(--accent); }
        .cat-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
        .emoji-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .emoji-card:hover { background: var(--hover); transform: scale(1.05); border-color: var(--accent); }
        .emoji-card .emoji { font-size: 2rem; margin-bottom: 4px; }
        .emoji-card .name { font-size: 0.7rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .emoji-card .unicode { font-size: 0.65rem; color: var(--accent); }
        .no-results { text-align: center; padding: 60px; color: var(--text-dim); }
        @media (max-width: 600px) {
            .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>

            {emoji: '💩', name: 'Pile of Poo', unicode: 'U+1F4A9' }
        ];
        let activeCategory = 'All';
        let searchTerm = '';
        function renderCategories() {
            const container = document.getElementById('categories');
            container.innerHTML = categories.map(cat =>
                `<button class="cat-btn ${activeCategory === cat.name ? 'active' : ''}" data-cat="${cat.name}">${cat.emoji} ${cat.name}</button>`
            ).join('');
            container.querySelectorAll('.cat-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeCategory = btn.dataset.cat;
                    renderCategories();
                    renderEmojis();
                });
            });
        }
        function filterEmojis() {
            let filtered = emojis;
            if (activeCategory !== 'All') {
                const cat = categories.find(c => c.name === activeCategory);
                if (cat) {
                    filtered = filtered.filter(e =>
                        e.name.toLowerCase().includes(cat.keywords.join('|').replace(/\|/g, '').toLowerCase()) ||
                        cat.keywords.some(k => e.name.toLowerCase().includes(k))
                    );
                }
            }
            if (searchTerm) {
                filtered = filtered.filter(e =>
                    e.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    e.emoji.includes(searchTerm)
                );
            }
            return filtered;
        }
        function renderEmojis() {
            const grid = document.getElementById('grid');
            const noResults = document.getElementById('noResults');
            const filtered = filterEmojis();
            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            noResults.style.display = 'none';
            grid.innerHTML = filtered.map(e =>
                `<div class="emoji-card" data-emoji="${e.emoji}">
                    <div class="emoji">${e.emoji}</div>
                    <div class="name">${e.name}</div>
                    <div class="unicode">${e.unicode}</div>
                </div>`
            ).join('');
            grid.querySelectorAll('.emoji-card').forEach(card => {
                card.addEventListener('click', () => {
                    navigator.clipboard.writeText(card.dataset.emoji).then(() => {
                        showToast(`Copied ${card.dataset.emoji}`);
                        card.style.transform = 'scale(0.95)';
                        setTimeout(() => card.style.transform = '', 150);
                    });
                });
            });
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        document.getElementById('search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderEmojis();
        });
        renderCategories();
        renderEmojis();
    </script>
