<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Dice Roller</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d0d14;
            --bg-secondary: #151521;
            --bg-card: #1a1a2e;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input[type="number"], select {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .dice-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 30px 0;
            min-height: 120px;
            align-items: center;
        }

        .die {
            width: 80px;
            height: 80px;
            background: linear-gradient(145deg, #ffffff, #e6e6e6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a2e;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 -2px 5px rgba(0, 0, 0, 0.1),
                inset 0 2px 5px rgba(255, 255, 255, 0.8);
            transition: transform 0.1s;
            position: relative;
        }

        .die.rolling {
            animation: diceRoll 0.1s ease-in-out infinite;
        }

        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(15deg) scale(1.1); }
            50% { transform: rotate(0deg) scale(1); }
            75% { transform: rotate(-15deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }

        .die:hover {
            transform: scale(1.1);
        }

        .total {
            text-align: center;
            margin: 20px 0;
        }

        .total-value {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--success), #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .total-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .history {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-dice {
            font-weight: 600;
            color: var(--accent);
        }

        .history-total {
            font-weight: 700;
            font-size: 1.125rem;
        }

        .history-time {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            .die { width: 60px; height: 60px; font-size: 1.75rem; }
            .total-value { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dice Roller</h1>
            <p class="subtitle">Roll virtual dice with style</p>
        </header>

        <div class="card">
            <div class="controls">
                <div class="control-group">
                    <label for="numDice">Number of Dice</label>
                    <input type="number" id="numDice" min="1" max="6" value="2">
                </div>
                <div class="control-group">
                    <label for="diceSides">Dice Type</label>
                    <select id="diceSides">
                        <option value="6">D6 (Standard)</option>
                        <option value="4">D4</option>
                        <option value="8">D8</option>
                        <option value="10">D10</option>
                        <option value="12">D12</option>
                        <option value="20">D20</option>
                    </select>
                </div>
            </div>
            <button class="btn" id="rollBtn">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
                    <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
                </svg>
                Roll Dice
            </button>
        </div>

        <div class="card">
            <div class="dice-container" id="diceContainer">
                <div class="die">?</div>
                <div class="die">?</div>
            </div>
            <div class="total" id="totalSection" style="display: none;">
                <div class="total-label">Total</div>
                <div class="total-value" id="totalValue">0</div>
            </div>
        </div>

        <div class="card">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalRolls">0</div>
                    <div class="stat-label">Total Rolls</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="avgRoll">-</div>
                    <div class="stat-label">Average</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="highestRoll">-</div>
                    <div class="stat-label">Highest</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lowestRoll">-</div>
                    <div class="stat-label">Lowest</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 1.125rem;">Roll History</h3>
                <button class="clear-btn" id="clearHistory">Clear History</button>
            </div>
            <div class="history" id="history"></div>
        </div>
    </div>

    <script>
        const numDiceInput = document.getElementById('numDice');
        const diceSidesSelect = document.getElementById('diceSides');
        const rollBtn = document.getElementById('rollBtn');
        const diceContainer = document.getElementById('diceContainer');
        const totalSection = document.getElementById('totalSection');
        const totalValue = document.getElementById('totalValue');
        const historyDiv = document.getElementById('history');
        const totalRollsEl = document.getElementById('totalRolls');
        const avgRollEl = document.getElementById('avgRoll');
        const highestRollEl = document.getElementById('highestRoll');
        const lowestRollEl = document.getElementById('lowestRoll');
        const clearHistoryBtn = document.getElementById('clearHistory');

        let rollHistory = [];
        let isRolling = false;

        function rollDie(sides) {
            return Math.floor(Math.random() * sides) + 1;
        }

        function updateDiceDisplay(values) {
            diceContainer.innerHTML = values.map(v => `<div class="die">${v}</div>`).join('');
        }

        function animateRoll(numDice, sides, finalValues) {
            return new Promise(resolve => {
                const dice = diceContainer.querySelectorAll('.die');
                dice.forEach(die => die.classList.add('rolling'));

                let iterations = 0;
                const maxIterations = 15;

                const interval = setInterval(() => {
                    dice.forEach(die => {
                        die.textContent = rollDie(sides);
                    });
                    iterations++;

                    if (iterations >= maxIterations) {
                        clearInterval(interval);
                        dice.forEach((die, i) => {
                            die.classList.remove('rolling');
                            die.textContent = finalValues[i];
                        });
                        resolve();
                    }
                }, 50);
            });
        }

        function updateStats() {
            totalRollsEl.textContent = rollHistory.length;

            if (rollHistory.length > 0) {
                const totals = rollHistory.map(r => r.total);
                const sum = totals.reduce((a, b) => a + b, 0);
                const avg = sum / totals.length;
                const highest = Math.max(...totals);
                const lowest = Math.min(...totals);

                avgRollEl.textContent = avg.toFixed(1);
                highestRollEl.textContent = highest;
                lowestRollEl.textContent = lowest;
            } else {
                avgRollEl.textContent = '-';
                highestRollEl.textContent = '-';
                lowestRollEl.textContent = '-';
            }
        }

        function addToHistory(dice, sides, total) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            rollHistory.unshift({ dice, sides, total, time: timeStr });
            if (rollHistory.length > 50) rollHistory.pop();

            historyDiv.innerHTML = rollHistory.map(r => `
                <div class="history-item">
                    <div>
                        <span class="history-dice">${r.dice}x D${r.sides}</span>
                    </div>
                    <div class="history-total">${r.total}</div>
                    <div class="history-time">${r.time}</div>
                </div>
            `).join('');
        }

        async function roll() {
            if (isRolling) return;
            isRolling = true;
            rollBtn.disabled = true;

            const numDice = parseInt(numDiceInput.value) || 2;
            const sides = parseInt(diceSidesSelect.value) || 6;
            const clampedDice = Math.min(Math.max(numDice, 1), 10);

            diceContainer.innerHTML = Array(clampedDice).fill('<div class="die rolling">?</div>').join('');

            const finalValues = Array.from({ length: clampedDice }, () => rollDie(sides));
            await animateRoll(clampedDice, sides, finalValues);

            const total = finalValues.reduce((a, b) => a + b, 0);
            totalSection.style.display = 'block';
            totalValue.textContent = total;

            addToHistory(clampedDice, sides, total);
            updateStats();

            isRolling = false;
            rollBtn.disabled = false;
        }

        rollBtn.addEventListener('click', roll);

        numDiceInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') roll();
        });

        clearHistoryBtn.addEventListener('click', () => {
            rollHistory = [];
            historyDiv.innerHTML = '';
            updateStats();
        });

        numDiceInput.addEventListener('change', () => {
            const val = parseInt(numDiceInput.value) || 1;
            numDiceInput.value = Math.min(Math.max(val, 1), 10);
        });
    </script>
</body>
</html>
