<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d0d14;
            --bg-secondary: #151521;
            --bg-card: #1a1a2e;
            --accent: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --gold: #fbbf24;
            --silver: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold), #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 158, 11, 0.1);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input[type="number"] {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, var(--accent), #f97316);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .coin-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin: 30px 0;
            min-height: 100px;
            align-items: center;
        }

        .coin {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            position: relative;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 -3px 8px rgba(0, 0, 0, 0.2),
                inset 0 3px 8px rgba(255, 255, 255, 0.3);
            perspective: 1000px;
        }

        .coin.heads {
            background: linear-gradient(145deg, var(--gold), #d97706);
            color: #78350f;
        }

        .coin.tails {
            background: linear-gradient(145deg, var(--silver), #64748b);
            color: #1e293b;
        }

        .coin.flipping {
            animation: coinFlip 0.5s ease-in-out;
        }

        @keyframes coinFlip {
            0% { transform: rotateY(0deg) translateY(0); }
            50% { transform: rotateY(900deg) translateY(-50px); }
            100% { transform: rotateY(1800deg) translateY(0); }
        }

        .coin:hover {
            transform: scale(1.1);
        }

        .result-summary {
            text-align: center;
            margin: 20px 0;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
        }

        .result-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .result-item {
            text-align: center;
        }

        .result-count {
            font-size: 2.5rem;
            font-weight: 800;
        }

        .result-item.heads .result-count {
            color: var(--gold);
        }

        .result-item.tails .result-count {
            color: var(--silver);
        }

        .result-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .streaks {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .streak-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px 24px;
            text-align: center;
        }

        .streak-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .streak-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .stat-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .history {
            max-height: 200px;
            overflow-y: auto;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-coins {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-coin {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.625rem;
            font-weight: 700;
        }

        .mini-coin.heads {
            background: var(--gold);
            color: #78350f;
        }

        .mini-coin.tails {
            background: var(--silver);
            color: #1e293b;
        }

        .history-summary {
            font-weight: 600;
            font-size: 1.125rem;
        }

        .history-time {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            .coin { width: 60px; height: 60px; font-size: 1.125rem; }
            .result-count { font-size: 2rem; }
            .result-row { gap: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Coin Flip Simulator</h1>
            <p class="subtitle">Test your luck with virtual coins</p>
        </header>

        <div class="card">
            <div class="controls">
                <div class="control-group">
                    <label for="numCoins">Number of Coins</label>
                    <input type="number" id="numCoins" min="1" max="10" value="1">
                </div>
            </div>
            <button class="btn" id="flipBtn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 6v12M6 12h12"/>
                </svg>
                Flip Coin(s)
            </button>
        </div>

        <div class="card">
            <div class="coin-container" id="coinContainer">
                <div class="coin heads">H</div>
            </div>
            <div class="result-summary" id="resultSummary">
                <div class="result-row">
                    <div class="result-item heads">
                        <div class="result-count" id="headsCount">0</div>
                        <div class="result-label">Heads</div>
                    </div>
                    <div class="result-item tails">
                        <div class="result-count" id="tailsCount">0</div>
                        <div class="result-label">Tails</div>
                    </div>
                </div>
                <div class="streaks">
                    <div class="streak-item">
                        <div class="streak-value" id="currentStreak">0</div>
                        <div class="streak-label">Current Streak</div>
                    </div>
                    <div class="streak-item">
                        <div class="streak-value" id="bestStreak">0</div>
                        <div class="streak-label">Best Streak</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="totalFlips">0</div>
                    <div class="stat-label">Total Flips</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="headsPercent">0%</div>
                    <div class="stat-label">Heads %</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="tailsPercent">0%</div>
                    <div class="stat-label">Tails %</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="mostLikely">-</div>
                    <div class="stat-label">More Likely</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 1.125rem;">Flip History</h3>
                <button class="clear-btn" id="clearHistory">Clear History</button>
            </div>
            <div class="history" id="history"></div>
        </div>
    </div>

    <script>
        const numCoinsInput = document.getElementById('numCoins');
        const flipBtn = document.getElementById('flipBtn');
        const coinContainer = document.getElementById('coinContainer');
        const headsCountEl = document.getElementById('headsCount');
        const tailsCountEl = document.getElementById('tailsCount');
        const currentStreakEl = document.getElementById('currentStreak');
        const bestStreakEl = document.getElementById('bestStreak');
        const totalFlipsEl = document.getElementById('totalFlips');
        const headsPercentEl = document.getElementById('headsPercent');
        const tailsPercentEl = document.getElementById('tailsPercent');
        const mostLikelyEl = document.getElementById('mostLikely');
        const historyDiv = document.getElementById('history');
        const clearHistoryBtn = document.getElementById('clearHistory');

        let flipHistory = [];
        let totalHeads = 0;
        let totalTails = 0;
        let currentStreak = 0;
        let bestStreak = 0;
        let lastResult = null;
        let isFlipping = false;

        function flipCoin() {
            return Math.random() < 0.5 ? 'heads' : 'tails';
        }

        function createCoinHTML(result) {
            return `<div class="coin ${result}">${result === 'heads' ? 'H' : 'T'}</div>`;
        }

        function animateFlips(numCoins, finalResults) {
            return new Promise(resolve => {
                const coins = coinContainer.querySelectorAll('.coin');

                let iterations = 0;
                const maxIterations = 10;

                const interval = setInterval(() => {
                    coins.forEach(coin => {
                        const tempResult = flipCoin();
                        coin.className = `coin ${tempResult} flipping`;
                        coin.textContent = tempResult === 'heads' ? 'H' : 'T';
                    });
                    iterations++;

                    if (iterations >= maxIterations) {
                        clearInterval(interval);
                        coins.forEach((coin, i) => {
                            coin.className = `coin ${finalResults[i]}`;
                            coin.textContent = finalResults[i] === 'heads' ? 'H' : 'T';
                        });
                        setTimeout(resolve, 100);
                    }
                }, 50);
            });
        }

        function updateStats() {
            const total = totalHeads + totalTails;
            totalFlipsEl.textContent = total;

            if (total > 0) {
                const headsPct = ((totalHeads / total) * 100).toFixed(1);
                const tailsPct = ((totalTails / total) * 100).toFixed(1);
                headsPercentEl.textContent = headsPct + '%';
                tailsPercentEl.textContent = tailsPct + '%';

                if (totalHeads > totalTails) {
                    mostLikelyEl.textContent = 'Heads';
                    mostLikelyEl.style.color = 'var(--gold)';
                } else if (totalTails > totalHeads) {
                    mostLikelyEl.textContent = 'Tails';
                    mostLikelyEl.style.color = 'var(--silver)';
                } else {
                    mostLikelyEl.textContent = 'Equal';
                    mostLikelyEl.style.color = 'var(--text-secondary)';
                }
            } else {
                headsPercentEl.textContent = '0%';
                tailsPercentEl.textContent = '0%';
                mostLikelyEl.textContent = '-';
            }

            currentStreakEl.textContent = currentStreak;
            bestStreakEl.textContent = bestStreak;
        }

        function addToHistory(results, numCoins) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const heads = results.filter(r => r === 'heads').length;
            const tails = results.filter(r => r === 'tails').length;

            flipHistory.unshift({ results, heads, tails, time: timeStr });
            if (flipHistory.length > 50) flipHistory.pop();

            historyDiv.innerHTML = flipHistory.map(f => `
                <div class="history-item">
                    <div class="history-coins">
                        ${f.results.map(r => `<div class="mini-coin ${r}">${r === 'heads' ? 'H' : 'T'}</div>`).join('')}
                    </div>
                    <div class="history-summary">
                        ${f.heads > f.tails ? 'H' : f.tails > f.heads ? 'T' : '='} won (${Math.max(f.heads, f.tails)}/${numCoins})
                    </div>
                    <div class="history-time">${f.time}</div>
                </div>
            `).join('');
        }

        async function flip() {
            if (isFlipping) return;
            isFlipping = true;
            flipBtn.disabled = true;

            const numCoins = parseInt(numCoinsInput.value) || 1;
            const clampedCoins = Math.min(Math.max(numCoins, 1), 10);

            coinContainer.innerHTML = Array(clampedCoins).fill(createCoinHTML('heads')).join('');
            const coins = coinContainer.querySelectorAll('.coin');

            const finalResults = Array.from({ length: clampedCoins }, () => flipCoin());

            await Promise.all(Array.from(coins).map((coin, i) => {
                return new Promise(resolve => {
                    setTimeout(() => {
                        coin.classList.add('flipping');
                        resolve();
                    }, i * 50);
                });
            }));

            await animateFlips(clampedCoins, finalResults);

            const heads = finalResults.filter(r => r === 'heads').length;
            const tails = finalResults.filter(r => r === 'tails').length;

            headsCountEl.textContent = heads;
            tailsCountEl.textContent = tails;
            totalHeads += heads;
            totalTails += tails;

            // Update streaks based on majority
            const majority = heads > tails ? 'heads' : tails > heads ? 'tails' : null;
            if (majority === lastResult && majority !== null) {
                currentStreak += heads > tails ? heads : tails;
            } else if (majority !== null) {
                currentStreak = heads > tails ? heads : tails;
                lastResult = majority;
            }
            if (currentStreak > bestStreak) {
                bestStreak = currentStreak;
            }

            addToHistory(finalResults, clampedCoins);
            updateStats();

            isFlipping = false;
            flipBtn.disabled = false;
        }

        flipBtn.addEventListener('click', flip);

        numCoinsInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') flip();
        });

        clearHistoryBtn.addEventListener('click', () => {
            flipHistory = [];
            totalHeads = 0;
            totalTails = 0;
            currentStreak = 0;
            bestStreak = 0;
            lastResult = null;
            historyDiv.innerHTML = '';
            headsCountEl.textContent = '0';
            tailsCountEl.textContent = '0';
            updateStats();
        });

        numCoinsInput.addEventListener('change', () => {
            const val = parseInt(numCoinsInput.value) || 1;
            numCoinsInput.value = Math.min(Math.max(val, 1), 10);
        });
    </script>
</body>
</html>
