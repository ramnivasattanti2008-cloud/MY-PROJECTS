<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .shortcuts {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 30px;
        }

        .shortcuts kbd {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            margin: 0 2px;
        }

        .stopwatch-display {
            font-size: 5rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
            letter-spacing: 2px;
        }

        .stopwatch-display .milliseconds {
            font-size: 2rem;
            color: #667eea;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-lap {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #0f0f1a;
        }

        .btn-reset {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .laps-container {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .laps-container::-webkit-scrollbar {
            width: 6px;
        }

        .laps-container::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .laps-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .lap-header {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            color: #888;
            font-size: 0.9rem;
            border-bottom: 1px solid #333;
            margin-bottom: 10px;
        }

        .lap-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.05);
            margin: 5px 0;
            border-radius: 8px;
            animation: slideIn 0.3s ease-out;
            transition: background 0.3s;
        }

        .lap-row:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .lap-row.best {
            border-left: 3px solid #38ef7d;
        }

        .lap-row.worst {
            border-left: 3px solid #eb3349;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .no-laps {
            color: #555;
            font-style: italic;
            margin-top: 20px;
        }

        @media (max-width: 500px) {
            .stopwatch-display {
                font-size: 3rem;
            }
            .stopwatch-display .milliseconds {
                font-size: 1.2rem;
            }
            button {
                padding: 12px 25px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stopwatch</h1>
        <p class="shortcuts">
            <kbd>Space</kbd> Start/Pause &nbsp;
            <kbd>L</kbd> Lap &nbsp;
            <kbd>R</kbd> Reset
        </p>

        <div class="stopwatch-display">
            <span id="time">00:00:00</span><span class="milliseconds">.<span id="ms">00</span></span>
        </div>

        <div class="controls">
            <button class="btn-start" id="startBtn" onclick="toggleTimer()">Start</button>
            <button class="btn-lap" id="lapBtn" onclick="recordLap()" disabled>Lap</button>
            <button class="btn-reset" id="resetBtn" onclick="resetTimer()" disabled>Reset</button>
        </div>

        <div class="laps-container" id="lapsContainer">
            <div class="lap-header">
                <span>Lap</span>
                <span>Time</span>
                <span>Split</span>
            </div>
            <div id="lapsList"></div>
        </div>
    </div>

    <script>
        let startTime;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;
        let lapCount = 0;
        let laps = [];

        const timeEl = document.getElementById('time');
        const msEl = document.getElementById('ms');
        const startBtn = document.getElementById('startBtn');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapsList = document.getElementById('lapsList');

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const milliseconds = Math.floor((ms % 1000) / 10);

            return {
                time: `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`,
                ms: String(milliseconds).padStart(2, '0')
            };
        }

        function updateDisplay() {
            const currentTime = Date.now();
            const totalElapsed = elapsedTime + (isRunning ? currentTime - startTime : 0);
            const formatted = formatTime(totalElapsed);
            timeEl.textContent = formatted.time;
            msEl.textContent = formatted.ms;
        }

        function toggleTimer() {
            if (!isRunning) {
                startTime = Date.now();
                timerInterval = setInterval(updateDisplay, 10);
                isRunning = true;
                startBtn.textContent = 'Pause';
                lapBtn.disabled = false;
                resetBtn.disabled = false;
            } else {
                elapsedTime += Date.now() - startTime;
                clearInterval(timerInterval);
                isRunning = false;
                startBtn.textContent = 'Start';
                lapBtn.disabled = true;
            }
        }

        function recordLap() {
            if (!isRunning) return;

            const currentTime = Date.now();
            const totalElapsed = elapsedTime + (currentTime - startTime);
            lapCount++;

            const lastLapTime = laps.length > 0 ? laps[laps.length - 1].total : 0;
            const lapTime = totalElapsed - lastLapTime;

            laps.push({ lap: lapCount, lapTime, total: totalElapsed });
            renderLaps();
        }

        function renderLaps() {
            if (laps.length === 0) {
                lapsList.innerHTML = '<p class="no-laps">No laps recorded yet</p>';
                return;
            }

            // Find best and worst lap times (excluding very short laps)
            const validLaps = laps.filter(l => l.lapTime > 1000);
            let bestIdx = -1, worstIdx = -1;

            if (validLaps.length > 0) {
                let minTime = Infinity, maxTime = -Infinity;
                validLaps.forEach((lap, i) => {
                    if (lap.lapTime < minTime) { minTime = lap.lapTime; bestIdx = i; }
                    if (lap.lapTime > maxTime) { maxTime = lap.lapTime; worstIdx = i; }
                });
            }

            lapsList.innerHTML = laps.map((lap, i) => {
                const formatted = formatTime(lap.lapTime);
                const splitFormatted = formatTime(lap.total);
                let className = 'lap-row';
                if (i === bestIdx) className += ' best';
                if (i === worstIdx) className += ' worst';
                return `
                    <div class="${className}">
                        <span>Lap ${lap.lap}</span>
                        <span>${formatted.time}.${formatted.ms}</span>
                        <span>${splitFormatted.time}</span>
                    </div>
                `;
            }).reverse().join('');
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;
            lapCount = 0;
            laps = [];
            timeEl.textContent = '00:00:00';
            msEl.textContent = '00';
            startBtn.textContent = 'Start';
            lapBtn.disabled = true;
            resetBtn.disabled = true;
            lapsList.innerHTML = '<p class="no-laps">No laps recorded yet</p>';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'KeyL' && isRunning) {
                recordLap();
            } else if (e.code === 'KeyR') {
                resetTimer();
            }
        });
    </script>
</body>
</html>
