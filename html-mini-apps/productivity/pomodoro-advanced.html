<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d0d14;
            --bg-secondary: #151521;
            --bg-card: #1a1a2e;
            --accent: #22c55e;
            --accent-glow: rgba(34, 197, 94, 0.4);
            --break: #3b82f6;
            --break-glow: rgba(59, 130, 246, 0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(34, 197, 94, 0.1);
        }

        .timer-card {
            text-align: center;
            padding: 40px 24px;
        }

        .mode-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .mode-tab {
            padding: 10px 24px;
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .mode-tab.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(34, 197, 94, 0.1);
        }

        .mode-tab.active.break {
            border-color: var(--break);
            color: var(--break);
            background: rgba(59, 130, 246, 0.1);
        }

        .timer-display {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px;
        }

        .timer-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-secondary);
            position: relative;
            box-shadow:
                0 0 40px rgba(34, 197, 94, 0.1),
                inset 0 0 40px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-circle.break-mode {
            box-shadow:
                0 0 40px rgba(59, 130, 246, 0.1),
                inset 0 0 40px rgba(0, 0, 0, 0.3);
        }

        .timer-progress {
            position: absolute;
            top: -8px;
            left: -8px;
            width: calc(100% + 16px);
            height: calc(100% + 16px);
            transform: rotate(-90deg);
        }

        .timer-progress circle {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
        }

        .timer-progress .bg {
            stroke: rgba(255, 255, 255, 0.1);
        }

        .timer-progress .progress {
            stroke: var(--accent);
            stroke-dasharray: 888;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-progress .progress.break {
            stroke: var(--break);
        }

        .timer-time {
            font-size: 4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            z-index: 1;
        }

        .timer-label {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        .timer-label.break-label {
            color: var(--break);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #16a34a);
            color: white;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        .btn-break {
            background: linear-gradient(135deg, var(--break), #2563eb);
            color: white;
            box-shadow: 0 4px 15px var(--break-glow);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input[type="number"] {
            background: var(--bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            width: 100%;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 16px;
        }

        .stat-item {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-item.break-stat .stat-value {
            color: var(--break);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .stat-sublabel {
            color: var(--text-secondary);
            font-size: 0.7rem;
            margin-top: 2px;
        }

        .session-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .session-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .session-type {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .session-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
        }

        .session-dot.break {
            background: var(--break);
        }

        .session-time {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 16px;
        }

        .clear-btn:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .sound-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: var(--bg-secondary);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: var(--accent);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active::after {
            transform: translateX(24px);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.75rem; }
            .timer-display { width: 240px; height: 240px; }
            .timer-time { font-size: 3rem; }
            .timer-progress .progress { stroke-dasharray: 754; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pomodoro Timer</h1>
            <p class="subtitle">Stay focused, stay productive</p>
        </header>

        <div class="card timer-card">
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="work">Work</button>
                <button class="mode-tab break" data-mode="short">Short Break</button>
                <button class="mode-tab break" data-mode="long">Long Break</button>
            </div>

            <div class="timer-display">
                <svg class="timer-progress" viewBox="0 0 300 300">
                    <circle class="bg" cx="150" cy="150" r="141"/>
                    <circle class="progress" cx="150" cy="150" r="141"/>
                </svg>
                <div class="timer-circle" id="timerCircle">
                    <div>
                        <div class="timer-time" id="timerDisplay">25:00</div>
                        <div class="timer-label" id="timerLabel">Focus Time</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startBtn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Start
                </button>
                <button class="btn btn-secondary" id="pauseBtn" style="display: none;">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 4h4v16H6zM14 4h4v16h-4z"/>
                    </svg>
                    Pause
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 4v6h6M23 20v-6h-6"/>
                        <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
                    </svg>
                    Reset
                </button>
                <button class="btn btn-secondary" id="skipBtn">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M5 4l10 8-10 8V4zM19 5v14H5"/>
                    </svg>
                    Skip
                </button>
            </div>

            <div class="sound-toggle">
                <div class="toggle-switch active" id="soundToggle"></div>
                <span>Sound Notifications</span>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 1.125rem; margin-bottom: 16px;">Timer Settings</h3>
            <div class="settings-grid">
                <div class="setting-item">
                    <label for="workDuration">Work Duration (min)</label>
                    <input type="number" id="workDuration" min="1" max="60" value="25">
                </div>
                <div class="setting-item">
                    <label for="shortBreak">Short Break (min)</label>
                    <input type="number" id="shortBreak" min="1" max="30" value="5">
                </div>
                <div class="setting-item">
                    <label for="longBreak">Long Break (min)</label>
                    <input type="number" id="longBreak" min="1" max="60" value="15">
                </div>
                <div class="setting-item">
                    <label for="sessionsUntilLong">Sessions until Long Break</label>
                    <input type="number" id="sessionsUntilLong" min="1" max="10" value="4">
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 1.125rem; margin-bottom: 16px;">Today's Statistics</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="sessionsCompleted">0</div>
                    <div class="stat-label">Sessions</div>
                    <div class="stat-sublabel">completed</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalFocusTime">0h 0m</div>
                    <div class="stat-label">Focus Time</div>
                    <div class="stat-sublabel">today</div>
                </div>
                <div class="stat-item break-stat">
                    <div class="stat-value" id="breaksTaken">0</div>
                    <div class="stat-label">Breaks</div>
                    <div class="stat-sublabel">taken</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentStreak">0</div>
                    <div class="stat-label">Streak</div>
                    <div class="stat-sublabel">sessions</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="font-size: 1.125rem;">Session History</h3>
                <button class="clear-btn" id="clearHistory">Clear</button>
            </div>
            <div class="session-list" id="sessionList">
                <div style="color: var(--text-secondary); text-align: center; padding: 20px;">
                    No sessions yet. Start your first Pomodoro!
                </div>
            </div>
        </div>
    </div>

    <script>
        const timerDisplay = document.getElementById('timerDisplay');
        const timerLabel = document.getElementById('timerLabel');
        const timerCircle = document.getElementById('timerCircle');
        const progressCircle = document.querySelector('.timer-progress .progress');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const skipBtn = document.getElementById('skipBtn');
        const modeTabs = document.querySelectorAll('.mode-tab');
        const soundToggle = document.getElementById('soundToggle');
        const sessionList = document.getElementById('sessionList');
        const sessionsCompletedEl = document.getElementById('sessionsCompleted');
        const totalFocusTimeEl = document.getElementById('totalFocusTime');
        const breaksTakenEl = document.getElementById('breaksTaken');
        const currentStreakEl = document.getElementById('currentStreak');
        const clearHistoryBtn = document.getElementById('clearHistory');

        const workDurationInput = document.getElementById('workDuration');
        const shortBreakInput = document.getElementById('shortBreak');
        const longBreakInput = document.getElementById('longBreak');
        const sessionsUntilLongInput = document.getElementById('sessionsUntilLong');

        let currentMode = 'work';
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let isRunning = false;
        let intervalId = null;
        let sessionsCompleted = 0;
        let breaksTakenCount = 0;
        let currentStreakCount = 0;
        let totalFocusMinutes = 0;
        let soundEnabled = true;
        let sessionHistory = [];
        let circumference = 2 * Math.PI * 141;

        progressCircle.style.strokeDasharray = circumference;

        function playSound() {
            if (!soundEnabled) return;

            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.2);

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function getDuration(mode) {
            switch (mode) {
                case 'work': return parseInt(workDurationInput.value) || 25;
                case 'short': return parseInt(shortBreakInput.value) || 5;
                case 'long': return parseInt(longBreakInput.value) || 15;
                default: return 25;
            }
        }

        function setMode(mode) {
            currentMode = mode;
            modeTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });

            if (mode === 'work') {
                timerCircle.classList.remove('break-mode');
                progressCircle.classList.remove('break');
                timerLabel.textContent = 'Focus Time';
                timerLabel.classList.remove('break-label');
            } else {
                timerCircle.classList.add('break-mode');
                progressCircle.classList.add('break');
                timerLabel.textContent = mode === 'short' ? 'Short Break' : 'Long Break';
                timerLabel.classList.add('break-label');
            }

            stop();
            totalTime = getDuration(mode) * 60;
            timeLeft = totalTime;
            updateDisplay();
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            const progress = (totalTime - timeLeft) / totalTime;
            progressCircle.style.strokeDashoffset = circumference * (1 - progress);
        }

        function start() {
            if (isRunning) return;
            isRunning = true;
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'flex';

            intervalId = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    playSound();
                    completeSession();
                }
            }, 1000);
        }

        function pause() {
            isRunning = false;
            clearInterval(intervalId);
            startBtn.style.display = 'flex';
            pauseBtn.style.display = 'none';
        }

        function stop() {
            isRunning = false;
            clearInterval(intervalId);
            startBtn.style.display = 'flex';
            pauseBtn.style.display = 'none';
        }

        function reset() {
            stop();
            totalTime = getDuration(currentMode) * 60;
            timeLeft = totalTime;
            updateDisplay();
        }

        function skip() {
            playSound();
            completeSession();
        }

        function completeSession() {
            stop();

            if (currentMode === 'work') {
                sessionsCompleted++;
                currentStreakCount++;
                totalFocusMinutes += getDuration('work');
                addToHistory('work', getDuration('work'));
                updateStats();

                if (sessionsCompleted % parseInt(sessionsUntilLongInput.value) === 0) {
                    setMode('long');
                } else {
                    setMode('short');
                }
            } else {
                breaksTakenCount++;
                currentStreakCount = 0;
                addToHistory('break', getDuration(currentMode));
                updateStats();
                setMode('work');
            }

            start();
        }

        function addToHistory(type, duration) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            sessionHistory.unshift({ type, duration, time: timeStr });
            if (sessionHistory.length > 50) sessionHistory.pop();

            renderHistory();
        }

        function renderHistory() {
            if (sessionHistory.length === 0) {
                sessionList.innerHTML = `
                    <div style="color: var(--text-secondary); text-align: center; padding: 20px;">
                        No sessions yet. Start your first Pomodoro!
                    </div>
                `;
                return;
            }

            sessionList.innerHTML = sessionHistory.map(s => `
                <div class="session-item">
                    <div class="session-type">
                        <div class="session-dot ${s.type === 'break' ? 'break' : ''}"></div>
                        <span>${s.type === 'work' ? 'Focus Session' : 'Break'}</span>
                    </div>
                    <div class="session-time">${s.duration} min</div>
                    <div class="session-time">${s.time}</div>
                </div>
            `).join('');
        }

        function updateStats() {
            sessionsCompletedEl.textContent = sessionsCompleted;
            breaksTakenEl.textContent = breaksTakenCount;
            currentStreakEl.textContent = currentStreakCount;

            const hours = Math.floor(totalFocusMinutes / 60);
            const mins = totalFocusMinutes % 60;
            totalFocusTimeEl.textContent = `${hours}h ${mins}m`;
        }

        // Event Listeners
        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);
        skipBtn.addEventListener('click', skip);

        modeTabs.forEach(tab => {
            tab.addEventListener('click', () => setMode(tab.dataset.mode));
        });

        soundToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            soundToggle.classList.toggle('active', soundEnabled);
        });

        [workDurationInput, shortBreakInput, longBreakInput].forEach(input => {
            input.addEventListener('change', () => {
                if (!isRunning) {
                    totalTime = getDuration(currentMode) * 60;
                    timeLeft = totalTime;
                    updateDisplay();
                }
            });
        });

        clearHistoryBtn.addEventListener('click', () => {
            sessionHistory = [];
            sessionsCompleted = 0;
            breaksTakenCount = 0;
            currentStreakCount = 0;
            totalFocusMinutes = 0;
            renderHistory();
            updateStats();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                if (isRunning) pause();
                else start();
            }
        });

        // Initialize
        updateDisplay();
        updateStats();
    </script>
</body>
</html>
