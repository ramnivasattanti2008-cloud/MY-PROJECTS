<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .player {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 80px rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.2);
        }
        .album-art {
            width: 100%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .album-art::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: rgba(0,0,0,0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        .album-art::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        .album-art.playing::before { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .vinyl {
            position: absolute;
            width: 60%;
            height: 60%;
            border-radius: 50%;
            background: radial-gradient(circle at center, #333 0%, #1a1a1a 30%, #333 60%, #1a1a1a 100%);
        }
        .vinyl::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
        }
        .vinyl::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10%;
            height: 10%;
            border-radius: 50%;
            background: #0a0a0f;
        }
        .album-art.playing .vinyl { animation: spin 3s linear infinite; }
        .song-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .song-title {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(90deg, #fff, #b0b0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .artist {
            color: #888;
            font-size: 0.9rem;
        }
        .progress-container {
            margin-bottom: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a2a4a;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7c3aed, #ec4899);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .times {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #888;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:hover { color: #fff; transform: scale(1.1); }
        .ctrl-btn svg { width: 28px; height: 28px; }
        .play-btn {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            border-radius: 50%;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }
        .play-btn:hover { transform: scale(1.05); box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6); }
        .play-btn svg { width: 28px; height: 28px; color: #fff; }
        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .volume-container svg { color: #888; flex-shrink: 0; }
        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            background: #2a2a4a;
            border-radius: 2px;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            border-radius: 50%;
            cursor: pointer;
        }
        .playlist {
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #2a2a4a;
            padding-top: 16px;
        }
        .playlist::-webkit-scrollbar { width: 4px; }
        .playlist::-webkit-scrollbar-track { background: transparent; }
        .playlist::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 2px; }
        .playlist-title {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .playlist-item:hover { background: rgba(124, 58, 237, 0.1); }
        .playlist-item.active { background: rgba(124, 58, 237, 0.2); }
        .playlist-item-num {
            width: 24px;
            text-align: center;
            color: #666;
            font-size: 0.85rem;
        }
        .playlist-item-info { flex: 1; min-width: 0; }
        .playlist-item-title {
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .playlist-item.active .playlist-item-title { color: #7c3aed; }
        .playlist-item-duration { color: #666; font-size: 0.8rem; }
        .upload-area {
            border: 2px dashed #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .upload-area:hover { border-color: #7c3aed; background: rgba(124, 58, 237, 0.05); }
        .upload-area svg { color: #666; margin-bottom: 8px; }
        .upload-area p { color: #666; font-size: 0.9rem; }
        .upload-area span { color: #7c3aed; }
        #fileInput { display: none; }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .empty-state svg { margin-bottom: 12px; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="player">
        <input type="file" id="fileInput" multiple accept="audio/*">
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17,8 12,3 7,8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p>Drop audio files here or <span>browse</span></p>
        </div>

        <div id="playerContent">
            <div class="album-art" id="albumArt">
                <div class="vinyl"></div>
            </div>

            <div class="song-info">
                <div class="song-title" id="songTitle">Select a track</div>
                <div class="artist" id="artist">Upload files to start</div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="times">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="prevTrack()">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()">
                    <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="nextTrack()">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2 0V6l6.5 6L8 18zm8-12v12h2V6h-2z"/></svg>
                </button>
            </div>

            <div class="volume-container">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                </svg>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
            </div>

            <div class="playlist">
                <div class="playlist-title">Queue</div>
                <div id="playlistItems"></div>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const albumArt = document.getElementById('albumArt');
        const songTitle = document.getElementById('songTitle');
        const artist = document.getElementById('artist');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const playlistItems = document.getElementById('playlistItems');

        let playlist = [];
        let currentTrack = -1;
        let isPlaying = false;
        let audio = new Audio();

        fileInput.addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => {
                const url = URL.createObjectURL(file);
                playlist.push({ file, url, title: file.name.replace(/\.[^/.]+$/, ''), duration: 0 });
            });
            renderPlaylist();
            if (playlist.length === 1) loadTrack(0);
        });

        // Drag and drop
        const uploadArea = document.querySelector('.upload-area');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#7c3aed';
            uploadArea.style.background = 'rgba(124, 58, 237, 0.1)';
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#2a2a4a';
            uploadArea.style.background = 'transparent';
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#2a2a4a';
            uploadArea.style.background = 'transparent';
            Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('audio/')).forEach(file => {
                const url = URL.createObjectURL(file);
                playlist.push({ file, url, title: file.name.replace(/\.[^/.]+$/, ''), duration: 0 });
            });
            renderPlaylist();
            if (playlist.length === 1) loadTrack(0);
        });

        function renderPlaylist() {
            playlistItems.innerHTML = playlist.map((track, i) => `
                <div class="playlist-item ${i === currentTrack ? 'active' : ''}" onclick="loadTrack(${i})">
                    <span class="playlist-item-num">${i + 1}</span>
                    <div class="playlist-item-info">
                        <div class="playlist-item-title">${track.title}</div>
                    </div>
                    <span class="playlist-item-duration">${formatTime(track.duration)}</span>
                </div>
            `).join('');
        }

        function loadTrack(index) {
            if (index < 0 || index >= playlist.length) return;
            currentTrack = index;
            const track = playlist[index];
            audio.src = track.url;
            audio.load();
            songTitle.textContent = track.title;
            artist.textContent = 'Unknown Artist';
            renderPlaylist();
            play();
        }

        function togglePlay() {
            if (playlist.length === 0) return;
            if (currentTrack === -1) loadTrack(0);
            isPlaying ? pause() : play();
        }

        function play() {
            if (playlist.length === 0) return;
            isPlaying = true;
            audio.play();
            playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
            albumArt.classList.add('playing');
        }

        function pause() {
            isPlaying = false;
            audio.pause();
            playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            albumArt.classList.remove('playing');
        }

        function nextTrack() {
            if (playlist.length === 0) return;
            loadTrack((currentTrack + 1) % playlist.length);
        }

        function prevTrack() {
            if (playlist.length === 0) return;
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                loadTrack((currentTrack - 1 + playlist.length) % playlist.length);
            }
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
            if (playlist[currentTrack]) {
                playlist[currentTrack].duration = audio.duration;
            }
            renderPlaylist();
        });

        audio.addEventListener('ended', nextTrack);

        progressBar.addEventListener('click', (e) => {
            if (audio.duration) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
            }
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });
        audio.volume = 0.8;

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
            if (e.code === 'ArrowRight') nextTrack();
            if (e.code === 'ArrowLeft') prevTrack();
        });
    </script>
</body>
</html>
