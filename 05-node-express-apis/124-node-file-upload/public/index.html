<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    h1 { color: #333; margin-bottom: 10px; }
    .subtitle { color: #666; margin-bottom: 30px; }
    .upload-area { background: white; border: 3px dashed #ddd; border-radius: 10px; padding: 40px; text-align: center; margin-bottom: 30px; transition: border-color 0.3s; }
    .upload-area:hover { border-color: #007bff; }
    .upload-area.dragover { border-color: #007bff; background: #f0f7ff; }
    .upload-area input[type="file"] { display: none; }
    .upload-btn { display: inline-block; padding: 12px 30px; background: #007bff; color: white; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: background 0.3s; }
    .upload-btn:hover { background: #0056b3; }
    .selected-files { margin-top: 15px; color: #666; }
    .submit-btn { margin-top: 20px; padding: 12px 30px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; }
    .submit-btn:hover { background: #218838; }
    .progress { width: 100%; height: 5px; background: #ddd; border-radius: 3px; margin-top: 15px; display: none; }
    .progress-bar { height: 100%; background: #007bff; border-radius: 3px; width: 0%; transition: width 0.3s; }
    .files-list { background: white; border-radius: 10px; padding: 20px; }
    .files-list h2 { color: #333; margin-bottom: 15px; }
    .file-item { display: flex; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
    .file-item:last-child { border-bottom: none; }
    .file-icon { width: 40px; height: 40px; background: #e9ecef; border-radius: 5px; display: flex; align-items: center; justify-content: center; margin-right: 15px; font-size: 1.2rem; }
    .file-info { flex: 1; }
    .file-name { font-weight: 500; color: #333; }
    .file-meta { font-size: 0.85rem; color: #888; margin-top: 3px; }
    .file-actions { display: flex; gap: 10px; }
    .file-actions button { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
    .download-btn { background: #007bff; color: white; }
    .delete-btn { background: #dc3545; color: white; }
    .empty-state { text-align: center; padding: 40px; color: #888; }
    .stats { display: flex; gap: 20px; margin-bottom: 20px; }
    .stat { background: white; padding: 15px 25px; border-radius: 8px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: bold; color: #007bff; }
    .stat-label { color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>File Upload</h1>
    <p class="subtitle">Upload and manage your files</p>

    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-value" id="totalFiles">0</div>
        <div class="stat-label">Total Files</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="totalSize">0 KB</div>
        <div class="stat-label">Total Size</div>
      </div>
    </div>

    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" multiple />
      <div class="upload-btn" onclick="document.getElementById('fileInput').click()">
        Choose Files or Drag & Drop
      </div>
      <div class="selected-files" id="selectedFiles"></div>
      <div class="progress" id="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <button class="submit-btn" id="submitBtn" onclick="uploadFiles()" style="display: none;">Upload Files</button>
    </div>

    <div class="files-list">
      <h2>Uploaded Files</h2>
      <div id="filesContainer">
        <div class="empty-state">No files uploaded yet</div>
      </div>
    </div>
  </div>

  <script>
    let selectedFiles = [];

    document.getElementById('fileInput').addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      updateSelectedFiles();
    });

    const uploadArea = document.getElementById('uploadArea');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      selectedFiles = Array.from(e.dataTransfer.files);
      updateSelectedFiles();
    });

    function updateSelectedFiles() {
      const container = document.getElementById('selectedFiles');
      const submitBtn = document.getElementById('submitBtn');

      if (selectedFiles.length > 0) {
        container.textContent = `${selectedFiles.length} file(s) selected`;
        submitBtn.style.display = 'inline-block';
      } else {
        container.textContent = '';
        submitBtn.style.display = 'none';
      }
    }

    async function uploadFiles() {
      const formData = new FormData();
      selectedFiles.forEach(file => formData.append('files', file));

      const progress = document.getElementById('progress');
      const progressBar = document.getElementById('progressBar');
      progress.style.display = 'block';
      progressBar.style.width = '0%';

      try {
        const xhr = new XMLHttpRequest();
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            progressBar.style.width = (e.loaded / e.total * 100) + '%';
          }
        };

        const response = await new Promise((resolve, reject) => {
          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(JSON.parse(xhr.responseText));
            } else {
              reject(new Error(xhr.responseText));
            }
          };
          xhr.onerror = reject;
          xhr.open('POST', '/api/upload/multiple');
          xhr.send(formData);
        });

        selectedFiles = [];
        updateSelectedFiles();
        progress.style.display = 'none';
        loadFiles();
        loadStats();
      } catch (error) {
        alert('Upload failed: ' + (error.message || 'Unknown error'));
        progress.style.display = 'none';
      }
    }

    async function loadFiles() {
      try {
        const response = await fetch('/api/files');
        const files = await response.json();

        const container = document.getElementById('filesContainer');

        if (files.length === 0) {
          container.innerHTML = '<div class="empty-state">No files uploaded yet</div>';
          return;
        }

        container.innerHTML = files.map(file => `
          <div class="file-item">
            <div class="file-icon">📄</div>
            <div class="file-info">
              <div class="file-name">${escapeHtml(file.originalName)}</div>
              <div class="file-meta">${formatSize(file.size)} • ${new Date(file.uploadedAt).toLocaleDateString()}</div>
            </div>
            <div class="file-actions">
              <button class="download-btn" onclick="downloadFile('${file.id}')">Download</button>
              <button class="delete-btn" onclick="deleteFile('${file.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Failed to load files:', error);
      }
    }

    async function loadStats() {
      try {
        const response = await fetch('/api/stats');
        const stats = await response.json();
        document.getElementById('totalFiles').textContent = stats.totalFiles;
        document.getElementById('totalSize').textContent = stats.totalSizeFormatted;
      } catch (error) {
        console.error('Failed to load stats:', error);
      }
    }

    function downloadFile(id) {
      window.location.href = `/api/files/${id}/download`;
    }

    async function deleteFile(id) {
      if (!confirm('Are you sure you want to delete this file?')) return;

      try {
        await fetch(`/api/files/${id}`, { method: 'DELETE' });
        loadFiles();
        loadStats();
      } catch (error) {
        alert('Failed to delete file');
      }
    }

    function formatSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial load
    loadFiles();
    loadStats();
  </script>
</body>
</html>
